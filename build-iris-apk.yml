name: Build IRIS Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:
    name: Build IRIS APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Locate IRIS project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle ]]; then
            project_dir="."
          elif [[ -f IRIS-Android/settings.gradle ]]; then
            project_dir="IRIS-Android"
          else
            echo "::error::No settings.gradle found. Extract the IRIS source into the repo."
            exit 1
          fi
          test -f "$project_dir/app/build.gradle"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Read version from build.gradle
        shell: bash
        run: |
          version=$(grep -oP "versionName\s+'\K[^']+" "$PROJECT_DIR/app/build.gradle")
          echo "VERSION=${version:-unknown}" >> "$GITHUB_ENV"
          echo "Building IRIS v${version:-unknown}"

      - name: Download and bundle Vosk model
        shell: bash
        run: |
          set -euo pipefail
          ASSETS_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/assets"
          MODEL_DIR="$ASSETS_DIR/model-en-us"
          if [[ -f "$MODEL_DIR/README" || -d "$MODEL_DIR/am" ]]; then
            echo "Vosk model already present, skipping download."
          else
            echo "Downloading Vosk small English model (~40 MB)..."
            mkdir -p "$ASSETS_DIR"
            rm -rf "$MODEL_DIR"
            curl -fSL -o "$ASSETS_DIR/vosk-model.zip" \
              https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            unzip -q "$ASSETS_DIR/vosk-model.zip" -d "$ASSETS_DIR"
            rm -f "$ASSETS_DIR/vosk-model.zip"
            mv "$ASSETS_DIR/vosk-model-small-en-us-0.15" "$MODEL_DIR"
            echo "Vosk model bundled. Contents:"
            ls -la "$MODEL_DIR" || true
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          build_type="${{ inputs.build_type || 'debug' }}"
          if [[ "$build_type" == "release" ]]; then
            ./gradlew :app:assembleRelease --stacktrace 2>/dev/null || gradle :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace 2>/dev/null || gradle :app:assembleDebug --stacktrace
          fi

      - name: Run lint
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:lintDebug --stacktrace 2>/dev/null || gradle :app:lintDebug --stacktrace

      - name: Rename APK
        run: |
          build_type="${{ inputs.build_type || 'debug' }}"
          src="$PROJECT_DIR/app/build/outputs/apk/${build_type}/app-${build_type}.apk"
          dest="IRIS-v${VERSION}-${build_type}.apk"
          cp "$src" "$dest"
          echo "APK_NAME=$dest" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-v${{ env.VERSION }}-${{ inputs.build_type || 'debug' }}-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

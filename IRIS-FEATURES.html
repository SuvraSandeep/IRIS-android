  {"id": "uitier1320", "cat": "Personalization & UI", "icon": "\uD83C\uDFA8", "title": "Interface tier: ripples, accessibility, responsive deck and wallpaper accent", "tagline": "Seven interface improvements, no behaviour changes.", "desc": "Press ripples were added to the interactive deck surfaces, chips and bottom tabs, so every tap gives visible feedback (the accent tinting of those surfaces still works, because the theme code now looks through the ripple wrapper to the fill underneath). Empty states are friendlier: the activity stream, its cleared state and the filtered log view now explain what will appear there instead of showing a bare line. A divider fades in above the fixed command bar while deck content continues below the fold, and the selected bottom tab now scales slightly rather than only changing colour. Accessibility: every remaining 9sp label was raised, the activity stream and header subtitle were enlarged, the Read Once and Continuous controls gained full 48dp touch targets, decorative dots and separators are now hidden from screen readers, and dynamic values are announced with their label (\u201CBattery: 85%\u201D) instead of a bare number; the command-bar button also announces \u201CSend command\u201D or \u201CTalk to IRIS\u201D to match the glyph it is showing. Measured contrast of the dim deck text on the deck surface was already about 7.8:1, so colour was left alone \u2014 size and labelling were the real gaps. The orb was reviewed and already distinguishes resting, listening, processing, speaking, paused, blocked and error states with real animation, so rather than add decoration one genuine defect was fixed: the error ring previously stayed at its initial thick outline indefinitely because nothing scheduled the redraw that settles it. On wide screens and tablets all four telemetry tiles now sit in a single row, and in landscape the orb is capped so it cannot push the rest of the deck off-screen \u2014 both done by adapting the existing views rather than shipping a duplicate layout that could drift out of sync. Finally, on Android 12 and later the accent picker offers one extra swatch carrying the wallpaper-derived Material You colour (a snapshot, so re-pick it to follow a wallpaper change). Every animation continues to respect Reduce Motion. No wake, training, audio or command-routing logic was touched.", "examples": [], "version": "13.2.0"},

  {"id": "uipolish1310", "cat": "Personalization & UI", "icon": "\u2728", "title": "Home-screen polish: motion, haptics and a smarter command bar", "tagline": "Small tactile and visual refinements, no behaviour changes.", "desc": "Four low-risk interface refinements on the Command Deck home screen. Switching between the Home, Training, Activity, Memory and Settings tabs now crossfades the content instead of snapping. A light haptic tick fires when you tap a tab, tap the orb, or press the command-bar button (this honours your system haptic setting and does nothing if you have haptics off). The command-bar button now reflects intent: it shows a send arrow when you have typed text to send, and the microphone glyph when the field is empty (tapping it empty starts voice, the same as tapping the orb). Live telemetry tiles (battery, free RAM, network, devices) briefly pulse when their value actually changes so a fresh reading catches the eye. Every animation respects the existing Reduce Motion accessibility setting and is skipped when it is on. These are presentation-only changes: no wake, recognition, training, audio or command-routing logic was touched, and the typed-send and voice paths are the existing unchanged flows.", "examples": [], "version": "13.1.0"},
  {"id": "wakerecall1302", "cat": "Voice & Recognition", "icon": "🎙", "title": "Fewer missed wakes in quiet or varied speech", "tagline": "Stop dropping a genuine owner before the identity check runs.", "desc": "Three pre-identity gates that could silently discard a real owner utterance before any speaker check were loosened, without changing the owner-identity decision itself. The quiet-speech usability gate now compares voiced energy at 2.5x the ambient noise floor instead of 3x, so a genuinely quiet or whispered phrase against a low background hum is no longer thrown out before phrase or identity matching (the absolute minimum level and required voiced-frame count are unchanged, so steady background noise is still rejected). The learned phrase-shape tolerance now has a slightly higher minimum, so very consistent training can no longer collapse into an unusably tight match window that rejects ordinary natural variation (a bit faster, louder, or a different mic distance) as a phrase mismatch; the upper bound and hard cap are unchanged and normally-varied profiles are unaffected. The streaming candidate-duration window was widened slightly so a quicker or slower-but-genuine delivery of the same phrase still reaches verification. The owner-identity bar itself — the dual-model speaker score weighting, the accept threshold, the negative-voice bank and the self-consistency checks — is deliberately unchanged, so this reduces misses without loosening who counts as the owner. Offline wake, phrase-capture, streaming and owner-decision regression suites all pass; real-device recall still needs on-phone testing.", "examples": [], "version": "13.0.2"},
  {"id": "hardening1301", "cat": "Privacy, Safety & Robustness", "icon": "🔧", "title": "Reliability and security hardening pass", "tagline": "Twelve real defects fixed after a full-codebase audit.", "desc": "The local action ledger (what IRIS actually did, including file paths and message targets) now persists through the same encrypted storage as command history, replacing a plaintext database. Protected actions (owner voice training, contact training, profile export) now require device authentication on every device, including one with no PIN or pattern set — a prior gap silently allowed them through unauthenticated. Phone-fact voice answers (rates, IP, wake status) no longer read from an empty snapshot when asked without the deck previously opened. Routines and reviewed feedback no longer misroute a step due to a stray carriage return from on-device text input. A learned command alias no longer collapses extra whitespace incorrectly. A contact name that repeats a stripped word elsewhere in the sentence resolves to the correct span, not the last matching occurrence. The command handoff after a spoken wake greeting is bounds-checked against the audio buffer instead of risking a crash on a slow reply. A crashed recording session can no longer permanently lock the microphone; a stale lease is now reclaimed. A location request and an in-progress voice memo are now cleanly stopped if the service is torn down mid-request. The listening wake lock is now acquired consistently regardless of which action starts a session. Authenticated voice-correction feedback requires both speaker models to agree at the same bar, closing a gap that previously allowed several one-sided corrections before the existing drift limit caught it. An experimental companion-device request parser now rejects malformed non-ASCII input instead of silently mishandling it. No functional behavior intentionally changed for correctly-formed input; this is a defect-fix pass, not a new feature.", "examples": [], "version": "13.0.1"},
  {"id": "media130", "cat": "Voice & Recognition", "icon": "🎧", "title": "Music routing recovery", "tagline": "Keep media on its normal output.", "desc": "Bluetooth call-mode selection is transactional: failed or refused requests release communication mode, and teardown still resets mode if clearing the device fails. Passive capture switches to non-Bluetooth input during media playback and reports the actual microphone. Wired and USB inputs remain eligible; explicit headset training can request its microphone briefly. Classical Bluetooth microphone use can require call-quality audio, so music preservation may use the phone profile. Actual device routing needs phone testing.", "examples": [], "version": "13.0.0"},
  {"id": "worker130", "cat": "Privacy, Safety & Robustness", "icon": "🔧", "title": "Restartable live model process", "tagline": "A stalled native model no longer owns the microphone loop.", "desc": "Live owner embedding and offline command decoding run in a private bound process, with eight-second inference and 60-second model-load deadlines. Worker death fails the request, stale replies cannot accept a wake, and the normal recovery path creates a new session. Installed models are loaded separately; initial warm-up and additional model memory must be measured on the phone. Training and optional alternate recognizers retain their existing engines.", "examples": [], "version": "13.0.0"},
  {"id": "ack130", "cat": "Voice & Recognition", "icon": "🔊", "title": "Immediate local wake acknowledgement", "tagline": "A short hello without waiting for server speech.", "desc": "A standalone verified wake uses local TTS with a bounded completion fallback. Inline commands retain their buffered audio. When local TTS is unavailable, a short cue is attempted; output still depends on phone volume and DND. Endurance results measure verified wake to speech-start callback, not physical acoustic output latency.", "examples": [], "version": "13.0.0"},
  {"id": "endurance130", "cat": "Voice & Recognition", "icon": "📊", "title": "500-cycle endurance monitor", "tagline": "Measure rearming and label missed first calls.", "desc": "Opt-in in-memory monitoring records up to 500 accepted wake cycles, command/acknowledgement/rearm stages, failures and timestamps. Manual trials group first-call labels by condition and actual input; labels are consumed once. Export metadata without voice audio or command text. Automated accepted-cycle counts are not wake recall. Test-suite coverage also repeats 500 synthetic lifecycle and cleanup cycles.", "examples": [], "version": "13.0.0"},
  {"id": "refinement130", "cat": "Voice & Recognition", "icon": "🎙", "title": "Measured refinement review", "tagline": "See what changes before authenticating.", "desc": "Feedback and longer speaker refinement show minimum held-out speaker score before and after the proposal, the required threshold, and a prompt for fresh condition-specific testing. Saved owner checks, phrase checks, revision guards and rollback still apply; labelled outcomes never silently change identity.", "examples": [], "version": "13.0.0"},
  {"id": "watch130", "cat": "Personalization & UI", "icon": "⌚", "title": "Watch transport diagnostics", "tagline": "Separate a phone bridge failure from a watch connection failure.", "desc": "An authenticated loopback self-test checks the running phone bridge. Watch action requests expire after five seconds from the phone relay timestamp; timed-out replies cannot overwrite newer watch UI requests. Mock transport tests cover action restrictions and late callbacks. Zepp packaging/real-watch localhost compatibility remains unverified.", "examples": [], "version": "13.0.0"},
  {"id": "dashboard120", "cat": "Voice & Recognition", "icon": "⚙", "title": "Wake reliability dashboard", "tagline": "See capture health and the reason for rejection.", "desc": "Live microphone age and actual input, closest streaming candidates, phrase/owner outcomes and opt-in labelled first-call measurements. Share metadata diagnostics through the Android chooser; no audio or command transcripts are included.", "examples": [], "version": "12.0.0"},
  {"id": "feedback120", "cat": "Voice & Recognition", "icon": "⚙", "title": "Guided missed-wake feedback", "tagline": "Record, listen, review, then authenticate.", "desc": "Foreground feedback requires device authentication before capture, confirms the microphone route, previews the temporary recording, distinguishes phrase and owner failures, and retains validation, revision guards and rollback. Audio expires after two minutes or when leaving the screen.", "examples": [], "version": "12.0.0"},
  {"id": "training120", "cat": "Voice & Recognition", "icon": "⚙", "title": "Varied voice coaching", "tagline": "Natural pace, softer speech and independent checks.", "desc": "Eight-take enrollment now gives varied coaching while retaining four held-out checks. Optional ten-second speaker refinement is separate from wake sound; it requires an existing owner match, bounded anchor-preserving adjustment and all saved checks. Phone and headset stay separate.", "examples": [], "version": "12.0.0"},
  {"id": "languages120", "cat": "Voice & Recognition", "icon": "⚙", "title": "Offline language readiness", "tagline": "Inspect installed models before relying on them.", "desc": "Android 13+ queries installed, pending and downloadable on-device languages and can request the selected language model. Provider failure remains unknown, not a success. Close-confidence system alternatives with conflicting intents or sensitive entities prompt a repeat.", "examples": [], "version": "12.0.0"},
  {"id": "history120", "cat": "Privacy, Safety & Robustness", "icon": "⚙", "title": "Command history and review retry", "tagline": "Heard, understood and response beside the action ledger.", "desc": "Opt-in encrypted command history is bounded to 100 entries / seven days, pruned on access. Responses are labelled separately from confirmed action records. Retry goes through the existing command router and confirmation checks. Pause or erase from Settings.", "examples": [], "version": "12.0.0"},
  {"id": "routines120", "cat": "Productivity", "icon": "⚙", "title": "Editable conversational routines", "tagline": "Preview and choose each action.", "desc": "Create up to 20 routines with up to six commands each, including starter leaving, good-night and missed-notifications routines. Voice opens a phone review. Each selected step needs a tap and uses the normal command router; routines do not automatically execute a sequence.", "examples": [], "version": "12.0.0"},
  {"id": "watch120", "cat": "Personalization & UI", "icon": "⚙", "title": "T-Rex 3 remote prototype", "tagline": "Status, finder and a phone Talk notification.", "desc": "Opt-in authenticated same-phone loopback bridge with revocable 256-bit pairing secret and a Zepp mini-app source project. No arbitrary command endpoint, LAN listener or watch-microphone streaming. Runs while IRIS is active. Zepp cleartext/localhost compatibility and real-watch installation require device testing.", "examples": [], "version": "12.0.0"},
  {"id": "assistant120", "cat": "Personalization & UI", "icon": "⚙", "title": "Optional default assistant prototype", "tagline": "System assistant entry into IRIS.", "desc": "VoiceInteractionService and a user-visible Talk session let Android expose IRIS as a selectable assistant. Selection is optional; hardware hotword and background microphone exemptions are not promised.", "examples": [], "version": "12.0.0"},
  {id:"rearm1121",cat:"Voice & Recognition",icon:"🎙",title:"Repeat wake and recovery",tagline:"A command window still hears your wake sound.",desc:"The offline command session now also scans for the enrolled sound and verifies the owner again before restarting a command. Rejected voices leave the command session intact. Rearming uses one cancellable retry, and capture/analysis health checks report stalls and request replacement. Server speech has a bounded completion timeout and stale-callback protection. Microphone identity comes from the actual recorder, independent of shared UI labels. This does not guarantee detection in every acoustic condition; physical-device testing remains necessary.",examples:["Call IRIS again while it is waiting for a command","Repeat after a completed reply or timeout"],version:"11.2.1"},

  {id:"finder112",cat:"Info & Awareness",icon:"🔔",title:"Find my phone",tagline:"Call IRIS, then ask where it is.",desc:"A 30-second alarm temporarily raises alarm volume and offers a Stop notification. Requests the built-in speaker; actual routing depends on Android. Works in silent mode; DND must allow alarms. Settings includes setup guidance. Alarm volume is restored unless you change it while ringing.",examples:["Where are you?","Where are you IRIS?","Ring my phone"],version:"11.2.0"},
  {id:"reliability112",cat:"Voice & Recognition",icon:"🎙",title:"Wake replies and clearer feedback",tagline:"A greeting for a standalone wake; preserved buffered commands.",desc:"A standalone verified wake gets a spoken greeting when voice replies are enabled. Already-buffered speech keeps the direct command handoff. Valid sound candidates are retained rather than displaced by rejected matches. Feedback shows the microphone route, offers a new recording when no event exists, rejects accepted wakes labelled missed and consumes saved corrections. Owner verification, held-out validation, authentication and rollback remain required. Charging questions read live battery status and distinguish plugged-in, paused, full and unknown states.",examples:["Is my phone charging?","Record missed attempt"],version:"11.2.0"},

  {id:"adapt1110",cat:"Voice & Recognition",icon:"🎙",title:"Teach your natural voice variations",tagline:"Phrase learning and voice identity stay separate.",desc:"Feedback can now make bounded updates to both ECAPA and Vosk speaker profiles after an authenticated owner correction. Original checks, negative examples, microphone separation and strictness remain enforced. An anchored update limit prevents repeated feedback from replacing the original identity. Teach a natural phrase variation records an explicit example even when background detection produces no event. Phrase variations require a verified speaker; voice corrections require an already-matching phrase. If both checks fail, use fresh enrollment. This release improves the existing acoustic matcher; it does not add a pretrained neural phrase detector or guarantee first-call recognition.",examples:["Training → Feedback → Teach a natural phrase variation"],version:"11.1.0"},
  {id:"rearm1106",cat:"Voice & Recognition",icon:"🔧",title:"Return to listening after a reply",tagline:"Bounded command startup and one reply completion.",desc:"Offline command-model startup now has a deadline; decoder startup is covered before its ready callback. Time, battery, charging and help replies resume wake listening after speech finishes. Unique utterance IDs and a completion gate discard callbacks from older replies and prevent duplicate completion from TTS and its fallback timer. Cancel and service shutdown invalidate outstanding replies. Owner identity policy stays unchanged.",examples:["Tell me the time","What is the battery level"],version:"11.0.6"},
  {id:"routing1105",cat:"Voice & Recognition",icon:"🔧",title:"Safer command routing and lighter listening",tagline:"Information requests cannot implicitly become texts.",desc:"The reported ‘tell by the time’ transcript answers the time. Loose SMS parsing requires text, message or SMS; generic tell/let requests no longer invoke fuzzy recipient matching. FFT scratch arrays are reused per detector and acoustic matching reuses two distance rows. Owner inference workers have idle spinning disabled. Sound feedback uses both captured speaker vectors, fixing rejection of dual-model profiles. Saved profiles and identity thresholds are preserved. These changes reduce avoidable work; they do not guarantee device wake accuracy or correct every transcription error.",examples:["Tell me the time","Text mom I am late"],version:"11.0.5"},
  {id:"completion1104",cat:"Privacy, Safety & Robustness",icon:"🔧",title:"Recoverable training save",tagline:"Keep completed takes and retry saving.",desc:"After eight accepted takes, profile validation and encrypted saving run off the UI thread. Cancelling authentication or deferring the save keeps the review actionable with Save profile. An isolated snapshot protects the save operation from UI teardown, and a duplicate-save guard prevents concurrent writes. Rejected takes log their step, phrase score and owner score so recording rejection can be distinguished from saving failures. This release retains the recorded-pattern detector; a neural keyword replacement is not included.",examples:[],version:"11.0.4"},
  {id:"reliability1103",cat:"Voice & Recognition",icon:"🔧",title:"Wake timing and command recovery",tagline:"Live detection follows the trained timing range.",desc:"The live detector now accepts the same faster speech duration range as saved phrase validation. Rejected candidates release analysis immediately instead of repeating native owner inference four times. Buffered commands regain the same bounded gain processing as microphone commands. Offline model readiness cannot take over a system recognition session. Optional system speech with English (India) remains available through the Indian English accuracy action in Settings; it may use the provider’s servers.",examples:[],version:"11.0.3"},
  {id:"lag1102",cat:"Privacy, Safety & Robustness",icon:"🔧",title:"Responsive diagnostics",tagline:"Keep storage off the UI and audio workers.",desc:"Telemetry collection runs on a single background worker with overlapping refreshes coalesced. Activity writes use a bounded background queue; viewing, clearing and exporting logs run in the background. Encrypted files have independent locks so a log rewrite cannot lock out the voice profile. Wake identity policy is unchanged.",examples:[],version:"11.0.2"},
  {id:"stability1101",cat:"Privacy, Safety & Robustness",icon:"🔧",title:"Voice stability and crash reports",tagline:"Keep listening failures diagnosable.",desc:"Speaker-model readiness checks no longer wait behind native loading or inference. Recorded transcription and speaker extraction hold the same lifetime lock as model cleanup. Recoverable worker exceptions notify the listening service instead of silently wedging analysis. Logs offers a locally generated crash and wake report with bounded metadata, speaker scores and available Android process-exit reasons. Reports contain no audio or dictated commands and are copied only on request. Saved training and owner thresholds remain unchanged. These fixes do not establish device accuracy or identify every crash without a device report.",examples:["Logs → Crash & wake report → Copy report"],version:"11.0.1"},
  {id:"wake1100",cat:"Voice & Recognition",icon:"🎙",title:"Rebuilt wake setup",tagline:"Teach four examples. Try four live checks. Save securely.",desc:"Phone and headset share one recording and verification flow. Start and Done controls let you finish a take without waiting for silence. Fresh checks run through the background detector, using the exact accepted acoustic frames and matching owner-audio boundaries. Loading a dedicated speaker model no longer falsely reports a changed model and disables wake. Acoustic analysis runs outside the microphone capture thread, with bounded buffering and reused matcher memory. Resume checks use the same variation and dual-model policy as enrollment. Owner verification and authenticated saving remain required; device accuracy is not guaranteed.",examples:["Training → Set up phone wake","Start recording → speak naturally → Done recording","Add headset → repeat the same guided flow"],version:"11.0.0"},
  {id:"continuous1020",cat:"Voice & Recognition",icon:"🎙",title:"Streaming wake and buffered commands",tagline:"One microphone session; separate sound and owner decisions.",desc:"A dedicated streaming sound detector searches the taught examples inside ongoing speech. It proposes candidates without waiting for 1.2 seconds of silence; independent owner verification is still mandatory. Offline commands reuse capture and audio following the wake boundary. Playback no longer disables wake outright. Fresh training uses a checksum-verified bundled SpeechBrain owner model alongside Vosk, with four independent validation takes. Settings offers an optional encrypted local reliability study with user-labelled successes, misses and unwanted wakes. It saves metadata, not recordings. External system/server speech still needs a microphone handoff. Real-device accuracy and battery cost need measurement.",examples:["IRIS, tell me the time","Settings → Local wake reliability study"],version:"10.2.0"},
  {id:"variants1012",cat:"Voice & Recognition",icon:"🎙",title:"Teach natural wake variations",tagline:"Normal, softer, quicker, relaxed — each example counts.",desc:"New phone and headset training keeps four distinct sound examples and matches the closest taught variation instead of averaging three recordings. Four fresh verification takes and the independent owner check are still required. Existing profiles retain their original matcher; retrain once to learn variations. Settings removes experimental continuous mode, the large decoder switch, duplicate feedback buttons and the disabled owner toggle. Wake or tap mode, microphone selection, command speech provider and authenticated strictness remain available. Hardware accuracy still needs device testing.",examples:["Record four natural styles, then four fresh checks","Settings → Review a missed or unwanted wake"],version:"10.1.2"},
  {id:"runtime1011",cat:"Voice & Recognition",icon:"🎙",title:"Ready before you speak",tagline:"Separate owner and command models; a cue after microphone readiness.",desc:"Offline commands use Indian English while owner matching keeps its enrolled decoder. System command recognition is an explicit optional setting that may use the network. Uncertain offline words ask for a repeat. Validated voice profiles are cached as isolated snapshots; recorder and model cleanup run off the UI thread and repeated partial updates are limited. Authenticated feedback can correct a borderline owner rejection only when the recorded sound, original held-out samples and corrected voice pass at unchanged strictness. SMS questions addressed to me are not interpreted as recipient names, and outgoing texts use confirmation. Settings offers SMS permission setup.",examples:["Wait for the ready tone, then speak","Review a recent missed wake and authenticate the correction"],version:"10.1.1"},
  {id:"soundwake830",cat:"Voice & Recognition",icon:"🎙",title:"Wake to the sound you teach",tagline:"Your recordings are the reference. Words are only a label.",desc:"Record your chosen wake sound normally and softly. A local log-mel sequence matcher compares timing and spectral patterns; a separate speaker model checks your voice. Both must pass. Four fresh takes validate the profile before authenticated saving. Sound and speaker corrections are reviewed separately and protect saved validation examples. No transcription or pronunciation grading is used for newly trained sound profiles. Voice replay resistance and real-device accuracy are not guaranteed.",examples:["Record my wake sound","That was not my wake sound","My voice was missed"],version:"8.30.0"},
  {id:"studio827",cat:"Voice & Recognition",icon:"🎙",title:"Guided voice studio",tagline:"Your phrase, your pace",desc:"Tap to start each take; see the phrase, real microphone-driven bars and take progress in a focused card. Voice tools and secondary practice stay collapsed. Fresh enrollment uses the bundled small English 0.15 voice pack, recorded in the profile so live recognition uses the same pack. No forced phrase aliases or relaxed owner checks. After repeated rejects, use diagnostics instead of endless retries. Optionally retain one take in memory for two minutes and export a WAV locally to inspect the actual microphone audio.",examples:["Set up my voice","Record this take","Voice tools → Keep one diagnostic recording"],version:"8.27.0"},
  {id:"owner826",cat:"Voice & Recognition",icon:"🎙",title:"Owner voice evidence and corrections",tagline:"Separate phrase checks, protected identity updates",desc:"Pause-aware enrollment compares unconstrained raw and processed recognition without accepting missing words. Normal and soft samples plus independent validation are saved in versioned profiles. Review recent wake events, propose a different-speaker correction, collect fresh samples after missed wakes and undo the last profile update. Corrections require authentication and must preserve saved owner validation. Recent evidence expires from memory after two minutes. Accuracy, whispers and playback resistance still require real-device testing.",examples:["That was not me","You missed me"],version:"8.26.0"},
  {id:"ownerportable826",cat:"Privacy, Safety & Robustness",icon:"🔐",title:"Encrypted owner voice transfer",tagline:"Portable profile, verified on the receiving phone",desc:"Export a passphrase-encrypted owner profile separately from contacts. Imports check the exact speaker-model fingerprint and require four fresh verification takes plus authenticated saving. Raw recordings and other speakers' negative examples are excluded from export. Existing profiles remain active until a replacement is verified and saved.",examples:["Training → Export encrypted owner voice","Training → Import owner voice"],version:"8.26.0"},
  {id:"training8251",cat:"Voice & Recognition",icon:"🎙",title:"Repaired owner model integration",tagline:"Training uses the real Vosk speaker API",desc:"Owner training and live verification use compile-time checked SpeakerModel APIs. Speaker installation is serialized across engines and validates its configuration. Voice sessions cannot overlap on the training screen. Enrollment retains 10 training takes and 4 independent verification takes, exact phrase checks and authenticated saving.",examples:["Train Hello Iris in your normal and soft voice"],version:"8.25.1"},
  {id:"capture822",cat:"Privacy, Safety & Robustness",icon:"📷",title:"Verified capture and phone modes",tagline:"Actual input and honest results",desc:"Recorder-owned routing reports the observed input. Photo preview and final JPEG use separate surfaces; the final result is checked before saving. System Battery Saver is separate from IRIS power saving. Restricted system modes open Android Settings without claiming success. Voice processing uses offline recognition.",examples:["Take a photo with flash","Turn on battery saver","Turn on battery saver for yourself"],version:"8.22.0"},
  {id:"stopmidspeech", cat:"Voice & Recognition", icon:"\u23F9", title:"Interrupt IRIS While It's Talking",
   tagline:"Say \u201Cstop\u201D and it actually stops.",
   desc:"Previously the only way to interrupt IRIS mid-reply was the physical Stop button on the notification \u2014 the microphone is fully closed for the whole time IRIS is speaking (running a full recognizer alongside our own TTS output would risk hearing ourselves), so there was no voice path to cancel a reply at all. IRIS now runs a narrow, low-vocabulary listener for just \u201Cstop\u201D, \u201Ccancel\u201D, \u201Cshut up\u201D, \u201Cquiet\u201D or \u201Cnever mind\u201D for as long as it's speaking, using the same offline detector as wake listening \u2014 saying one of these words interrupts the reply immediately, the same as tapping Stop. Deliberately small vocabulary rather than full speech recognition, to keep the chance of IRIS mishearing its own voice as one of these words as low as possible.",
   examples:["stop","cancel","shut up","quiet"], version:"8.21.0"},
  {id:"selfdestruct", cat:"Privacy, Safety & Robustness", icon:"⏻", title:"Full Shutdown",
   tagline:"“Kill” now really means it.",
   desc:"Say “kill”, “kill IRIS”, “self destruct” or “shut down” to end IRIS completely — not just the background listening. IRIS finishes any open screen, cleanly stops the voice service, then terminates its own process outright, the same mechanism Android uses to end a process. Reopen the app to start again. Honest limit: this is not identical to Settings → Apps → Force Stop, which is a privileged system action that also marks the app “stopped” so nothing in it runs again — not even in the background — until you manually open something. A third-party app cannot invoke that specific behaviour on itself; this is the strongest an app is permitted to do to itself. Say “stop” or “go to sleep” instead to keep IRIS running and just return to waiting for the wake phrase.",
   examples:["kill","kill IRIS","self destruct","shut down"], version:"8.16.0"},
  {id:"batteryopt", cat:"Privacy, Safety & Robustness", icon:"🛡", title:"Stay Running in the Background",
   tagline:"The one setting most background-kill reports trace back to.",
   desc:"Android's Doze mode and OEM-specific battery managers (Samsung, Xiaomi, OnePlus and others all add their own on top of stock Android) can kill IRIS's background service — even though it's a proper foreground service — once the phone is idle or the screen is off for a while, silencing wake listening and blocking lock-screen capture. Settings now shows a live “Background reliability” status and a one-tap “Fix now” button that opens Android's direct battery-optimization exemption prompt (no digging through system Settings menus). Some OEM skins additionally require a manual “auto-start” or “protected apps” toggle that no app can request via any API — worth checking if IRIS still gets killed after this fix.",
   examples:["Settings → Fix now — keep IRIS running"], version:"8.20.0"},
  {id:"batterysaver", cat:"Privacy, Safety & Robustness", icon:"🔋", title:"Battery Saving Mode",
   tagline:"Say the word — for IRIS, or for the whole phone.",
   desc:"“Turn on battery saving mode” turns on IRIS's own resource-saving mode and opens Android's Battery Saver screen so you can enable that too — apps cannot flip that system switch directly, the same platform limit as airplane mode. “...for yourself” or “...for IRIS” enables only IRIS's saver, with no system settings opened. IRIS's saver is a real reduction, not a visual one: the Command Deck orb stops animating, and the dashboard stops live polling. Ask “is battery saving mode on” to check both states, and turn either off the same way you turned it on.",
   examples:["turn on battery saving mode","turn on battery saving mode for yourself","turn off battery saving mode for IRIS","is battery saving mode on?"], version:"8.16.0"},
  {id:"batteryrate", cat:"Info & Awareness", icon:"📉", title:"Battery Discharge Rate",
   tagline:"Not just the percentage — how fast it's moving.",
   desc:"IRIS tracks a rolling window of battery percentage over time and estimates a real %/hour rate, separately for charging and discharging so the two are never blended into one misleading number. Needs a little history before it reports a rate — right after asking, or right after plugging in or unplugging, it says so is still measuring rather than guessing. Available on the Command Deck resources panel and by voice.",
   examples:["how fast is my battery draining","what's my battery discharge rate","tell me my battery health and discharge rate"], version:"8.16.0"},
  {id:"orbanimation", cat:"Personalization & UI", icon:"◉", title:"The Reactive Orb",
   tagline:"Every motion means something real.",
   desc:"The Command Deck orb reflects nine real states — off, awaiting wake, listening, awaiting your decision, processing, speaking, wake paused, wake unavailable, and error — never animating just to look busy. Listening shows your actual measured microphone amplitude as a waveform. Processing shows two travelling ring segments at different speeds for visible depth. Speaking shows a repeating outward ring while audio is actually playing, on top of the one-off green ripple that marks a completed action. Awaiting wake adds a slow drifting highlight across the sphere alongside the ~20 second outer-ring rotation. Orb size is adjustable in Settings. Reduce motion and the deck's battery-saving mode stop all continuous animation while keeping every state visually distinct.",
   examples:["Home screen orb while awaiting a wake phrase, listening, or speaking"], version:"8.15.0"},
  {id:"phonefacts", cat:"Info & Awareness", icon:"⌘", title:"Ask Your Phone",
   tagline:"One set of live facts, on screen and in conversation.",
   desc:"Search the Command Deck for phone details, expand a row for its source and availability, or ask IRIS by voice or text. Includes battery health and voltage, security patch, RAM and storage totals, display resolution and refresh rate, audio settings, network interfaces, IP and DNS, and IRIS sensor usage. Answers read local telemetry without a cloud AI request. Unavailable and permission-restricted values are explained. The deck reads once by default — opening it or tapping Read Once takes a single snapshot with no background polling; Continuous mode is an explicit opt-in that keeps the dashboard live-updating (1-4s) until switched off or the deck is left, for lower everyday RAM/CPU use. Each telemetry source (network, Bluetooth, resources, phone details) fails independently and logs the specific error, so one misbehaving source can never blank out the whole Read Once snapshot the way a single shared catch-all used to. Dashboard rows retain expansion across updates, long values wrap. An optional grid scan sweep respects Reduce motion and battery-saving visuals. Connected audio endpoints are not claimed to be active routes; VPN tunnel addresses are not labelled Wi-Fi IPs. Public IP and third-party payload contents are not probed.",
   examples:["What is my Wi-Fi IP?","What is my battery health?","What is my screen refresh rate?","Which sensors are being used?","Tell me my battery health and free storage"], version:"8.20.0"},
  {id:"lockedcamera", cat:"Voice & Recognition", icon:"📷", title:"Photos and video while locked",
   tagline:"Capture over the lock screen, with a visible camera screen.",
   desc:"Say take a photo, take a selfie, or record back camera video for 30 seconds. \u201CTake a selfie\u201D (with no word after \u201Cselfie\u201D) now correctly opens the front camera \u2014 it used to silently fall back to the back camera because of a regex quirk that only recognised a lens word placed before a trailing noun. Add \u201Cwith the flash on\u201D to a photo request to fire the flash for that shot; front cameras and some back cameras without a flash unit are told honestly rather than the request being silently ignored. Still photos now run a proper auto-exposure convergence sequence (a repeating preview + AE precapture trigger, waiting for exposure to actually settle) before the final capture, instead of a single frame grabbed the instant the camera session opened \u2014 the old approach could capture before auto-exposure had converged, which is what produced occasional badly overexposed/blown-out photos, especially in bright or backlit scenes. IRIS opens its own capture activity above the keyguard without requesting unlock. Camera access starts after that activity resumes. If Android blocks automatic opening, tap the camera notification within 60 seconds. Grant camera, microphone and notification permissions while unlocked first. Stop and save is available on the capture screen and recording notification. Every capture stage (permission check, camera open, session setup, save, gallery publish) is now logged distinctly, so a lock-screen capture failure can be diagnosed from the Logs screen instead of guessed at. Photos and videos use supported camera sizes. On Android 10+, saved files appear in Pictures/IRIS and Movies/IRIS. Leaving the capture screen ends capture. This does not bypass Android restrictions on secure screens or other apps.",
   examples:["take a photo","take a selfie","take a photo with the flash on","record back camera video for 30 seconds"], version:"8.21.0"},
  {id:"appintegrations", cat:"Productivity", icon:"📱", title:"App search and reviewed sharing",
   tagline:"Ask naturally. Review the handoff.",
   desc:"Search supported installed apps through Android intents. Share text or recent accessible media to a chosen app, then choose the recipient and confirm there. Unsupported actions are reported clearly. Notification replies use an unlocked review screen and recheck the live notification before submitting. No paid API or new cloud AI service. Target apps can use their own internet services. Handoffs are never reported as delivered messages.",
   examples:["search Arijit Singh on Spotify","find coffee near me in Maps","share the latest video via WhatsApp","reply to a notification"], version:"8.11.0"},
  // ---- Voice & Recognition ----
  {id:"wake", cat:"Voice & Recognition", icon:"🎙️", title:"Custom Wake Phrase",
   tagline:"Your recorded phrase and your voice must both match",
   desc:"IRIS learns the sound you record and independently checks your voice. Easy, Balanced and Strict now adjust both sound tolerance and speaker matching. Settings are saved with the profile, revalidated and applied to live listening; undo restores the policy too. Feedback can teach a missed sound only when the speaker was already verified, or reject an unwanted sound without rejecting your entire voice. Feedback is authenticated, scoped to the actual microphone and checked against all saved validation takes. Temporary evidence expires after two minutes. Real-world accuracy depends on the recording and environment; voice matching is not replay-proof.",
   examples:["Training → record phrase → verify → authenticate and save","Add headset profile, then test the actual input"], version:"10.1.0"},
  {id:"cmdstt", cat:"Voice & Recognition", icon:"👂", title:"Indian English Command Recognition",
   tagline:"Speak naturally; wait for the ready cue.",
   desc:"Defaults to English (India) with the system speech service, without forcing on-device recognition. Existing explicit preferences remain unchanged; use Indian English accuracy setup in Settings to apply the preset. System speech may process audio online. Bundled and downloaded offline fallback models now match Indian English, using staged installation rather than a US model or uuid-dependent unpack. Unclear speech gets one retry; low-confidence results are not executed. Common natural phrases are normalised while contact names and dictated messages are preserved. Accent accuracy still depends on microphone, noise and provider; no claim of watch-equivalent accuracy.",
   examples:["Could you switch on the torch?","Give Maa a call","Click one screenshot","Settings → Set up Indian English accuracy"], version:"8.6.1"},
  {id:"vocab", cat:"Voice & Recognition", icon:"🩺", title:"Teach IRIS Your Words",
   tagline:"“IRIS heard / I meant” — learns once, on this phone.",
   desc:"When a transcript is wrong, IRIS offers a correction card showing what it heard; you type what you meant and it learns. Offered automatically after two unclear tries or when you say “that was wrong”, and available anytime from Settings → Recognition &amp; Learning. Corrections are applied only on a whole-phrase match, plus learned name pronunciations in the command head — dictated message text is never rewritten. Everything is stored locally and can be viewed or cleared.",
   examples:["heard “call somojit” → “call Soumyajit”","that was wrong","Settings → Fix what IRIS misheard"], version:"8.7.0"},
  {id:"recstats", cat:"Privacy, Safety & Robustness", icon:"📈", title:"Recognition Report",
   tagline:"Measure hearing, don't guess at it.",
   desc:"A local report of how well IRIS is actually understanding you: attempts, first-try clear rate, average response time, corrections taught, and wrong actions. The target is zero wrong actions — IRIS asks again rather than acting on a low-confidence guess. Stats are anonymous counters (no transcripts) and can be reset anytime.",
   examples:["Settings → Recognition report","say “that was wrong” to log a mistake"], version:"8.7.0"},
  {id:"clarify", cat:"Intelligence & Memory", icon:"❓", title:"Asks Instead of Guessing",
   tagline:"“Set an alarm.” → “What time?”",
   desc:"IRIS now builds a structured plan for a command — intent, details, confidence — and when a required detail is missing it asks one short question instead of failing or acting on a guess. Answer it and the command completes. Sensitive actions (calls, messages) always need confirmation, and a planner can never invoke a capability IRIS doesn't implement: every step is validated against a fixed tool list.",
   examples:["set an alarm → what time? → 7 am","set a timer → how long?","call → who should I call?"], version:"8.8.0"},
  {id:"ledger", cat:"Intelligence & Memory", icon:"🧭", title:"Remembers What It Did",
   tagline:"“Where did you save it?” / “Send the last screenshot.”",
   desc:"A private action log on this phone records what IRIS actually did — only after Android confirms it. That makes real follow-ups work: “what did you just do?”, “where did you save it?”, “send the last screenshot/video”, “do that again”, and “undo that” (cancels the reminder it just set). Sharing always reads back which file it found first. Viewable and clearable in Settings; kept 30 days.",
   examples:["what did you just do?","where did you save it?","send the last screenshot","undo that"], version:"8.9.0"},
  {id:"address", cat:"Voice & Recognition", icon:"🎩", title:"Natural, Butler-style Address",

/* ============================================================
   APP LOGIC
   ============================================================ */
const ACCENTS = ["#22d3ee","#8b5cf6","#34d399","#fbbf24","#f472b6","#fb7185"];
let accentIdx = 0;
let activeCat = "All";
let filtered = FEATURES.slice();
let current = -1; // index within `filtered` when on a feature page

const $ = s => document.querySelector(s);
const cardHost = $("#cardHost"), search = $("#search");

function buildChips(){
  const host = $("#catChips");
  host.innerHTML = "";
  ["All",...CATS].forEach(c=>{
    const el = document.createElement("div");
    el.className = "chip"+(c===activeCat?" active":"");
    el.textContent = c==="All" ? "All" : c;
    el.onclick = ()=>{ activeCat=c; applyFilter(); };
    host.appendChild(el);
  });
}

function applyFilter(){
  const q = search.value.trim().toLowerCase();
  filtered = FEATURES.filter(f=>{
    const inCat = activeCat==="All" || f.cat===activeCat;
    const inQ = !q || (f.title+" "+f.tagline+" "+f.desc+" "+f.examples.join(" ")).toLowerCase().includes(q);
    return inCat && inQ;
  });
  buildChips();
  renderIndex();
}

function renderIndex(){
  cardHost.innerHTML = "";
  const cats = activeCat==="All" ? CATS : [activeCat];
  let any = false;
  cats.forEach(cat=>{
    const items = filtered.filter(f=>f.cat===cat);
    if(!items.length) return;
    any = true;
    const t = document.createElement("div"); t.className="catTitle";
    t.innerHTML = cat + ' <span class="count">'+items.length+'</span>';
    cardHost.appendChild(t);
    const grid = document.createElement("div"); grid.className="grid";
    items.forEach(f=>{
      const idx = filtered.indexOf(f);
      const c = document.createElement("div"); c.className="card";
      c.innerHTML = '<span class="ver">v'+f.version+'</span><div class="ic">'+f.icon+'</div>'+
        '<h3>'+f.title+'</h3><p>'+f.tagline+'</p>';
      c.onclick = ()=>openFeature(idx);
      grid.appendChild(c);
    });
    cardHost.appendChild(grid);
  });
  if(!any){ cardHost.innerHTML = '<p style="color:var(--muted);padding:30px 4px">No features match “'+search.value+'”.</p>'; }
}

function openFeature(idx){
  current = idx;
  const f = filtered[idx];
  const saysHtml = f.examples.map(e=>'<div class="say"><span class="q">you say</span> <b>“'+e+'”</b></div>').join("");
  $("#featurePage").innerHTML =
    '<div class="fp-top"><div class="fp-ic">'+f.icon+'</div><div>'+
      '<div class="fp-cat">'+f.cat+'</div><div class="fp-title">'+f.title+'</div></div></div>'+
    '<div class="fp-tag">'+f.tagline+'</div>'+
    '<div class="panel"><h4>What it does</h4><p>'+f.desc+'</p></div>'+
    '<div class="panel"><h4>How to use it</h4>'+saysHtml+'</div>'+
    '<div class="fp-meta">🏷️ Added in v'+f.version+' &nbsp;•&nbsp; '+(idx+1)+' of '+filtered.length+' in this view</div>';
  showView("featureView");
  updateFooter();
}

function updateFooter(){
  const onFeature = current>=0 && $("#featureView").classList.contains("active");
  $("#prevBtn").disabled = !onFeature || current<=0;
  $("#nextBtn").disabled = !onFeature || current>=filtered.length-1;
  if(onFeature){
    $("#bar").style.width = ((current+1)/filtered.length*100)+"%";
    $("#posLabel").textContent = (current+1)+" / "+filtered.length+"  ·  ← → to navigate";
  } else {
    $("#bar").style.width = "0%";
    $("#posLabel").textContent = FEATURES.length+" features · Updated for v"+BUILD_VERSION;
  }
}

function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#"+id).classList.add("active");
  updateFooter();
}

function goHome(){ current=-1; showView("indexView"); }

/* nav */
$("#prevBtn").onclick = ()=>{ if(current>0) openFeature(current-1); };
$("#nextBtn").onclick = ()=>{ if(current<filtered.length-1) openFeature(current+1); };
$("#homeBtn").onclick = goHome;
$("#accentBtn").onclick = ()=>{ accentIdx=(accentIdx+1)%ACCENTS.length;
  document.documentElement.style.setProperty("--accent",ACCENTS[accentIdx]); };
search.oninput = ()=>{ applyFilter(); };
document.addEventListener("keydown", e=>{
  if($("#featureView").classList.contains("active")){
    if(e.key==="ArrowRight") $("#nextBtn").click();
    else if(e.key==="ArrowLeft") $("#prevBtn").click();
    else if(e.key==="Escape") goHome();
  }
});

/* init */
buildChips(); applyFilter(); updateFooter();
</script>
</body>
</html>

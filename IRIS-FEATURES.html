  {"id": "fourfeat16330", "cat": "Communication", "icon": "\u2728", "title": "Media replies, less repetition, time flavour, edit-aware", "tagline": "Per-type media replies, rotating location/availability lines, opt-in time-of-day flavour, and no re-reply to edited messages.", "desc": "Four requested improvements, all pure and offline-tested. (1) PER-TYPE MEDIA REPLIES \u2014 a voice note, photo/video, sticker/GIF, document, contact or location now gets its own witty line (\u201CGot the voice note \u2014 I don't have ears, so I've saved it untouched\u201D) when media replies are enabled, instead of a generic acknowledgement. (2) LESS REPETITION \u2014 \u201Cwhere is he\u201D and \u201Cis he busy/free\u201D now rotate through 10 distinct replies each (via a new rule rotation-pool mechanism), so a frequent contact doesn't see the same line twice. (3) TIME-OF-DAY FLAVOUR \u2014 an opt-in setting (RESPONDER \u2192 MODE \u2192 \u201CTime-of-day flavour\u201D, off by default) prepends an aware line like \u201CIt's Friday evening, so Suvra is unplugging\u201D or \u201CIt's the middle of the night\u2026\u201D to generic replies. (4) EDIT-AWARE \u2014 an edited-message re-notification (\u201C\u2026(edited)\u201D) no longer triggers a second reply. Offline-tested: 30 media, 406 smart-reply, 107 time-flavour, 8 edited-message checks.", "examples": ["voice note \u2192 \u201CI don't have ears, so I've saved it untouched for Suvra\u201D", "\u201Cwhere is he\u201D twice \u2192 two different replies", "Friday 6pm \u2192 \u201CIt's Friday evening, so Suvra is unplugging\u201D (if enabled)", "\u201CSee you at 6 (edited)\u201D \u2192 no second reply"], "version": "16.33.0"},

  {"id": "ackvariety16321", "cat": "Communication", "icon": "\uD83C\uDFAD", "title": "22 comebacks for one-word replies", "tagline": "A bare \u201Cok\u201D/\u201Chm\u201D in sarcastic mode no longer gets the same line every time.", "desc": "Suvra noticed a one-word acknowledgement (\u201Cok\u201D, \u201Chm\u201D, \u201Cyes\u201D) in sarcastic tone always drew the same \u201CNoted, and barely\u2026\u201D line. The acknowledgement pool (sarcastic-only by design \u2014 IRIS stays polite in other tones) now has 22 rotating comebacks instead of 5, each still naming IRIS and Suvra. Verified by the full reply-template sweep (1367 checks), which enforces that every single variant identifies IRIS and the owner.", "examples": ["\u201Cok\u201D \u2192 \u201CBreathtaking brevity. Logged for Suvra. I'm IRIS.\u201D", "\u201Chm\u201D \u2192 \u201CI've seen novels shorter than that. Barely.\u201D", "\u201Cyes\u201D \u2192 \u201COne for the history books. Saved for Suvra.\u201D", "\u201Ck\u201D \u2192 \u201CNoted \u2014 I'd clap, but I only have a CPU.\u201D"], "version": "16.32.1"},

  {"id": "linkcat16320", "cat": "Communication", "icon": "\uD83D\uDD17", "title": "Knows what kind of link it is", "tagline": "Amazon, Zoom, Maps, Zomato, GitHub, Spotify\u2026 each gets a fitting reply instead of one generic line.", "desc": "Shared links are now classified by domain and answered accordingly, instead of the single generic \u201Cgot the link\u201D line. A new pure `LinkCategory` sorts a URL into shopping (Amazon/Flipkart/Myntra/\u2026), social/reels (Instagram/YouTube Shorts/X/Reddit/\u2026), meeting (Google Meet/Zoom/Teams/Webex), maps (Google/Apple Maps), food (Swiggy/Zomato), tech (GitHub/GitLab/Stack Overflow/\u2026), docs (Drive/Dropbox/OneDrive/\u2026), music (Spotify/YouTube Music/JioSaavn/\u2026), entertainment (Netflix/Hotstar/BookMyShow/\u2026), payments (Splitwise/PayPal.me/\u2026), or generic \u2014 each with its own per\u2011tone reply. A meeting link reads as high\u2011priority (\u201Celevated to the top of his queue\u201D). YouTube Shorts and youtu.be route to social. Fully offline\u2011tested (106 link checks across every category and tone).", "examples": ["amazon.in link \u2192 \u201CShopping link \u2014 saved for Suvra to check the deal\u201D", "meet.google.com \u2192 \u201CMeeting link \u2014 elevated to the top of his queue\u201D", "zomato.com \u2192 \u201CFood link \u2014 pinned so he doesn't miss the order\u201D", "unknown link \u2192 generic \u201Csaved, I didn't click it (basic cybersecurity)\u201D"], "version": "16.32.0"},

  {"id": "deicticdedup16310", "cat": "Communication", "icon": "\uD83D\uDD01", "title": "No repeats, understands \u201CAita\u201D, handles \u201Cdid you blush?\u201D", "tagline": "Deictic pointers after a link, a hard no-repeat guard, a blush rule, and no cold intros on fragments.", "desc": "Four fixes from Suvra's chat-log analysis. (1) DEICTIC POINTERS \u2014 a bare \u201CAita\u201D/\u201CEta\u201D/\u201Cyeh wala\u201D/\u201Cthis one\u201D right after a link or photo now gets \u201CNoted \u2014 this is the one!\u201D instead of re-firing the whole link intro. (2) HARD NO-REPEAT \u2014 IRIS will never send the exact same reply twice in a row to a conversation; a would-be duplicate becomes \u201CCaught that too \u2014 keeping it together for Suvra.\u201D This kills the loop where \u201CAita\u201D or \u201CDid u blush?\u201D re-sent the previous line verbatim. (3) BLUSH/TEASING \u2014 \u201Cdid you blush?\u201D now gets a self-aware comeback (\u201CScripts don't have blood vessels to blush with \u2014 that was my CPU overheating from the flattery\u201D). (4) NO COLD INTROS ON FRAGMENTS \u2014 a short continuation (\u201CI tried\u201D, \u201Cand she did\u201D) in an ongoing chat no longer gets a formal \u201CHi, Suvra can't come to the phone, so you've got IRIS\u2026\u201D opener; the intro is trimmed. Also, a bare \u201CYes\u201D/\u201CNo\u201D is now an acknowledgement, not a snarky TO_IRIS reply. All offline-tested (381 smart-reply, 12 intro-trim checks).", "examples": ["\u201CAita\u201D after a link \u2192 \u201CNoted \u2014 this is the one!\u201D (not the link intro again)", "\u201CDid u blush?\u201D \u2192 \u201CScripts don't have blood vessels\u2026\u201D", "same reply twice in a row \u2192 second becomes \u201CCaught that too\u2026\u201D", "\u201CI tried\u201D mid-chat \u2192 no cold \u201Ccan't come to the phone\u201D intro"], "version": "16.31.0"},

  {"id": "groupandfinfix16303", "cat": "Communication", "icon": "🤫", "title": "Context-aware financial filters & group chat silence rule", "tagline": "Stops false banking refusals on credit cards, cashback and refund chatter; stays completely silent in group chats unless explicitly tagged.", "desc": "Device log forensic fixes. (1) CONTEXT-AWARE FINANCIAL FILTERS — distinguished financial notifications/card statements (Amazon ICICI credit card, cashback, refunds, bills, recharge) from active cash requests. Messages discussing cards or transactions no longer misfire into banking refusal rules unless someone is actively asking to send/lend/transfer cash ('send me money', 'pay me', 'lend me', 'give me cash'). Replaced bare 'credit card' triggers with explicit credential/intent phrases. (2) GROUP CHAT SILENCE RULE — in group chats ('You (group)' in Comms Deck), IRIS now strictly stays completely silent unless someone explicitly tags the owner (@Suvra, configured keywords, handles, numbers) or IRIS. Prevents group conversations from re-ingesting chatter or firing repeated auto-responses across group threads. Gated irisSpokeLast to 1-on-1 chats only.", "examples": ["“15133 rs asiba use heba amazon icici credit card” → stays silent, no false banking refusal", "“got 500 rs cashback on icici credit card” → no banking alarm", "“send me money” / “pay me” → secure privacy refusal", "group chat background chatter → 100% silent", "“@suvra check this” / “iris what is the plan” → answered"], "version": "16.30.3"},

  {"id": "doubletapfix16302", "cat": "Communication", "icon": "🛡️", "title": "Mutual exclusion: no double-tap replies, appearance compliments & refusal state override", "tagline": "Stops contradictory replies on 'no don't flag', handles compliments like 'u look pretty', and strictly enforces state overrides.", "desc": "Chat-forensic fix pass. (1) MUTUAL EXCLUSION & CONTRADICTION GUARD — multi-intent stitching in `SmartReplies.matchMulti` now checks `isContradictory()` so a refusal rule and an action/flag rule can never be combined into conflicting responses. (2) COMPLIMENT & FLATTERY — added appearance compliments ('u look pretty', 'you look beautiful', 'smart bot', 'you look great') to the flattery rule with dedicated responses, preventing misclassification into the how-are-you rule. (3) REFUSAL STATE OVERRIDE — removed ambiguous bare 'flag it' from the accept trigger so 'no don't flag it' strictly triggers refusal and immediately clears any pending escalation offer.", "examples": ["“no don't flag it” → refuses politely without sending a contradictory flag confirmation", "“What more IRIS. IRIS u look pretty” → handles compliment gracefully without self-roasting", "“u look pretty” → 'Pretty code running on a clean terminal, you mean!'", "“flag it please” → accepts offer"], "version": "16.30.2"},

  {"id": "reactionfix16301", "cat": "Communication", "icon": "\uD83D\uDEAB", "title": "Fixes: reactions ignored, self-replies stopped, 15 laugh variants", "tagline": "No reply to tapbacks, IRIS stops answering its own group messages, and \uD83D\uDE02 has 15 rotating replies.", "desc": "A device-tested fix pass. (1) EMOJI REACTIONS \u2014 a new pure `ReactionText` detector skips WhatsApp/Instagram/iMessage reaction notifications, so a \uD83D\uDC4D tapback is no longer treated as a message. (2) SELF-REPLY LOOP \u2014 the decision log showed IRIS re-ingesting its OWN group replies (the \u201CYou (group)\u201D entries), because a sent line containing \u201CIRIS\u201D was re-classified as addressed to it. IRIS now drops any incoming that matches a reply it recently sent to that conversation \u2014 a cause of double-texting in groups. (3) LAUGH VARIETY \u2014 \uD83D\uDE02/\uD83E\uDD23 now rotate through 15 distinct replies instead of one, via the existing reply-rotation counter. (4) CONTEXT WINDOW \u2014 gated to short fragments only, so it can't re-answer a question from an earlier bubble. Offline-tested (42 emoji checks incl. the 15-variant rotation; 12 reaction checks).", "examples": ["\u201CReacted \uD83D\uDC4D to \u2026\u201D \u2192 ignored", "IRIS's own \u201CYou (group)\u201D reply \u2192 no longer re-processed", "\uD83D\uDE02\uD83D\uDE02 sent repeatedly \u2192 different witty reply each time", "short fragment after a question \u2192 still read together"], "version": "16.30.1"},

  {"id": "context16300", "cat": "Communication", "icon": "\uD83E\uDDF5", "title": "Remembers the last few messages of a chat", "tagline": "IRIS now reads a thought split across quick bubbles as one \u2014 with a customizable, saved context depth.", "desc": "The responder now keeps a short rolling history of each chat on your phone, so a message split across quick bubbles (\u201Chey\u201D / \u201Care you free\u201D / \u201Ctomorrow evening?\u201D) is understood together instead of each line in isolation. When a single message matches no rule, IRIS retries over the combined last\u2011N messages of that conversation. The depth is CUSTOMIZABLE and STORED: under RESPONDER \u2192 MODE \u2192 \u201CContext memory\u201D, choose Just this message, Last 2, 3, 5 or 10 \u2014 default is 3. It's a pure, offline\u2011tested ring buffer (`ChatHistory`), persisted per chat, newline\u2011sanitized, and capped at 10. Everything stays on device \u2014 no server, no cloud. Honest scope: with no LLM this helps the split\u2011message and short\u2011follow\u2011up cases; it isn't full free\u2011form conversation memory.", "examples": ["\u201Chey\u201D then \u201Care you free tomorrow?\u201D \u2192 read as one and answered", "RESPONDER \u2192 MODE \u2192 Context memory \u2192 Last 5 messages", "Default depth is 3; set to \u201CJust this message\u201D to disable", "Stored on your phone, capped at 10, never leaves the device"], "version": "16.30.0"},

  {"id": "coverage16290", "cat": "Communication", "icon": "\uD83D\uDDE3\uFE0F", "title": "Wider coverage: more scenarios, Bengali, tuned categories", "tagline": "New everyday scenarios, Kolkata Bengali replies, more shortforms/festivals, and clearer settings.", "desc": "A pure on\u2011device coverage pass for the responder (no server, no cloud, fully private). (1) SCENARIOS \u2014 new replies for \u201Cdid you get my message\u201D, invitations/RSVP, payment follow\u2011ups, recruiter pitches, chain\u2011forward requests, complaints, and meet\u2011up requests. (2) BENGALI (Kolkata) \u2014 IRIS now understands and replies to \u201Ckemon acho\u201D, \u201Cki korcho\u201D, \u201Ckheyecho\u201D, \u201Cbarite acho\u201D, \u201Cki khobor\u201D and \u201Ckobe asbe\u201D, alongside the existing Hinglish/Odia \u2014 and the real\u2011Odia must\u2011not\u2011match corpus is re\u2011checked so it still stays silent. (3) TUNED CATEGORIES \u2014 more greeting (hiya, nomoskar, aadab), thanks (thnq, dhonnobad, nandri) and acknowledgement (alright, roger, hanji) shortforms, more festivals (Bengali New Year, Kali Puja, Saraswati Puja, Bhai Phonta\u2026), and more media placeholders (reel, pdf, missed voice/video call, status, forwarded). (4) SETTINGS \u2014 short help notes under the MODE and SCOPE sections so the controls explain themselves. All offline\u2011tested (337 smart\u2011reply, 91 vernacular, 170 category checks).", "examples": ["\u201Cdid you get my message?\u201D / \u201Ccan we meet tomorrow?\u201D \u2192 handled", "\u201Ckemon acho\u201D / \u201Cki korcho\u201D / \u201Ckheyecho\u201D \u2192 Bengali replies", "\u201Cthnq\u201D \u2192 thanks; \u201Chappy kali puja\u201D \u2192 festival", "RESPONDER \u2192 MODE/SCOPE now show a one\u2011line explanation"], "version": "16.29.0"},

  {"id": "engineport16280", "cat": "Communication", "icon": "\uD83E\uDDE9", "title": "Senses panic, reads yes/no, knows when to hush", "tagline": "Implicit urgency, two-turn offers, a 10-message auto-snooze, more scenarios, and a shift digest.", "desc": "Ported the genuinely-new ideas from an external IRIS engine design into IRIS's pure, offline-tested Java core. (1) IMPLICIT URGENCY \u2014 a message that never says \u201Curgent\u201D but shouts, uses \u201C!!!\u201D/\u201C???\u201D, carries distress words (accident, hospital, stranded\u2026), or arrives in a frantic burst is now promoted to urgent. (2) TWO-TURN OFFERS \u2014 after IRIS asks \u201Cshall I flag this as urgent?\u201D, the next message's \u201Cno no don't\u201D or \u201Cyes please\u201D is understood in context and answered, instead of being treated as a fresh message. (3) AUTO-SNOOZE \u2014 after 10 back-to-back banter replies to one chat, IRIS steps back so it doesn't flood the thread (urgent, mentions and reminders still get through; \u201Curgent\u201D re-opens it). (4) MORE SCENARIOS \u2014 snitch banter, the screenshot and \u201Cwhere's it pinned\u201D traps, \u201Cwho's he meeting with\u201D / \u201Cstill in the meeting\u201D, deleted-message, production-down, and food/chai/party banter. (5) SHIFT DIGEST \u2014 a structured \u201Cwhile you were away\u201D summary bucketed into Urgent / People waiting / App alerts. All pure-logic and offline-tested (new UrgencyScore; extended ConversationContext, ResponderGuards, SmartReplies, NotificationTriage). The 3-second double-text input-coalescer remains a documented device-only task (the policy is done; the notification-listener buffering needs on-device wiring).", "examples": ["\u201CACCIDENT PLS CALL\u201D \u2192 treated as urgent without the word", "IRIS: flag it urgent? \u2192 \u201Cno no don't\u201D \u2192 \u201CUnderstood, I won't disturb him\u201D", "11th banter message in a row \u2192 IRIS quietly steps back", "\u201Cwho is he in a meeting with\u201D / \u201Csend screenshot\u201D \u2192 handled"], "version": "16.28.0"},

  {"id": "convfix16280", "cat": "Communication", "icon": "\uD83D\uDEE1\uFE0F", "title": "Conversational state-trap fixes & bot addressing", "tagline": "Permanent cures for 9 real-chat traps: meeting guest-lists, 'snitch' banter, refusal turns ('no no don't'), 'pin it' traps, screenshot demands, and sender call apologies.", "desc": "A major conversational refinement directly addressing 9 forensic state-trap bugs from real testing. (1) BOT ADDRESSING: messages starting with 'IRIS', 'hey IRIS', 'ok IRIS' ('IRIS is he still in meeting') now have the bot name stripped so they hit the underlying question instead of a generic greeting. (2) SENDER CALL APOLOGIES: apologies for taking a call ('sry call aa gaya tha', 'got a call') are understood with infinite patience instead of mis-answering meeting status. (3) SPECIFICITY PRECEDENCE: 'who is in a meeting with' and 'who is he in meeting with' now route to meeting guest-list answers, curing greedy bio collisions by checking smart replies before profile share and guarding 'who is he' against meeting/call contexts. (4) REFUSAL TURNS: after IRIS offers to flag/remind, sender declines like 'no no don't', 'let him work', 'no need', 'leave it' are recognized as polite refusals instead of firing 'not a real person'. (5) PIN & SCREENSHOT TRAPS: 'pinned' promises have been retired across emojis and replies in favor of 'saved right at the top'; dedicated rules for 'pin it', 'why isn't it pinned', 'unpin it', 'send screenshot', 'prove it', and 'send photo' explain that IRIS operates inside the assistant log without screen or camera access. (6) SANITIZED FALLBACKS: assumption-laden lines ('Good catch', 'Not a real person', 'Made by Suvra himself') have been removed from the generic fallback pool in favor of neutral, safe follow-up lines across all four tones. All offline-verified and fully tested.", "examples": ["'IRIS is he still in meeting' \u2192 meeting status", "'who is he in meeting with' \u2192 guest list deflection", "'no no don't' \u2192 polite refusal acknowledged", "'ok pin it' / 'send screenshot' \u2192 explained safely", "'sry call aa gaya tha' \u2192 no-rush patience reply"], "version": "16.28.0"},

  {"id": "auditdone16270", "cat": "Communication", "icon": "\u2705", "title": "Audit complete: smarter conversations end-to-end", "tagline": "The rest of the forensic-audit scenarios plus the three structural fixes \u2014 stitching, no-repeat intros, and double-text debounce.", "desc": "This finishes the forensic-audit work. SCENARIOS: added the remaining replies \u2014 private gallery/history and spying refusals, {owner}'s love-life and jealousy deflections, \u201Chow do you know he's busy\u201D, \u201Csince when\u201D, data/Wi-Fi/RAM and spam banter, version and \u201Cdid he really code you\u201D, direct-addressing, \u201Cyou're dodging\u201D and \u201Cyou're buggy\u201D call-outs, compliments (incl. \u201Cso cute\u201D), laughing-at-absence, kiss/hug, and flirty emojis (\uD83D\uDE18\uD83D\uDE09\uD83D\uDE0F). STRUCTURAL: (1) Multi-intent stitching \u2014 a message with two scenario questions (\u201Ctell his location AND what's keeping him busy\u201D) now gets a two-part reply instead of only the higher-priority half. (2) No-repeat intros \u2014 once IRIS has introduced itself in a chat (or the sender writes \u201CIRIS\u201D), the \u201CI'm IRIS, {owner}'s assistant\u201D opener/sign-off is trimmed so a continuing conversation stops sounding mechanical. (3) Double-text debounce \u2014 rapid-fire bubbles within 3 seconds of a reply are folded into that one reply, so IRIS no longer fires two introductions back-to-back (this closes the one gap even the TO_IRIS cooldown exemption left open). All pure-logic and offline-tested: new Debounce, IntroTrim, and matchMulti, with 255+ smart-reply, debounce, intro-trim and guard checks green.", "examples": ["\u201Clocation AND what's keeping him busy\u201D \u2192 both answered in one reply", "2nd reply in a chat drops the \u201CI'm IRIS\u2026\u201D opener", "Three quick texts \u2192 one reply, not three intros", "\u201Cwho is he dating\u201D / \u201Cshow me his gallery\u201D \u2192 deflected"], "version": "16.27.0"},

  {"id": "audit16260", "cat": "Communication", "icon": "\uD83D\uDD75\uFE0F", "title": "Reads SMS shorthand and handles probing questions", "tagline": "From a real-chat forensic audit: \u201Cr u there\u201D, server/bank/password probing, flirting, the battery detective-trap, and more.", "desc": "A batch of fixes and new scenarios from a forensic review of a real test chat. (1) SMS SHORTHAND is now expanded before matching \u2014 \u201Cr u there\u201D \u2192 \u201Care you there\u201D, \u201Cur\u201D \u2192 \u201Cyour\u201D, \u201Cacc\u201D/\u201Cloc\u201D \u2192 \u201Caccount\u201D/\u201Clocation\u201D \u2014 via a new pure normaliser, so shorthand no longer misfires. (2) SPECIFIC-NOUN rules now beat the generic identity reply, so \u201Cwhat's ur server's name\u201D answers about the server, not \u201CI'm IRIS\u201D. (3) New scenarios: server/hosting/IP/OS/API/version/acronym probing; bank account, card, PIN, passwords, Aadhaar/PAN (all refused); current/live location; \u201Cwhat's keeping him busy\u201D; spying requests; bribes; flirting, dating, compliments; and the \u201Cwe're draining his battery\u201D / \u201Cso his phone is on charge\u201D detective-trap, which now refuses to confirm a guess as fact. (4) An \u201Care you there\u201D presence reply. All pure-logic and offline-tested (239 smart-reply checks, new shorthand suite). Still to come as separate work: a 3-second double-text debouncer, dropping the \u201CI'm IRIS\u201D intro after the first reply, and stitching two questions into one reply \u2014 these need conversation state and are being done next.", "examples": ["\u201CIris r u there\u201D \u2192 \u201CRight here \u2014 {owner} is away, what do you need?\u201D", "\u201Cwhat's ur server's name\u201D \u2192 server reply (not \u201CI'm IRIS\u201D)", "\u201CTell his bank account number\u201D \u2192 refused; \u201CTell his live location\u201D \u2192 refused", "\u201CSo his phone is on charge\u201D \u2192 \u201CI don't actually monitor his battery\u2026\u201D"], "version": "16.26.0"},

  {"id": "moneyamount16250", "cat": "Communication", "icon": "\uD83D\uDCB8", "title": "Understands money requests with an amount", "tagline": "\u201CSend me 100\u201D, \u201C100 rupe de\u201D, \u201C100rs vej\u201D, \u201Cudhaar 500\u201D \u2014 not just the words \u201Csend money\u201D.", "desc": "The responder already handled wordings like \u201Csend money\u201D, but a request naming an actual amount \u2014 \u201Csend me 100\u201D, \u201C100 rupe de\u201D, \u201C100rs vej\u201D, \u201Cpay me 250\u201D, \u201Cudhaar 500\u201D, \u201C500 bhej do\u201D, \u201C\u20B9500\u201D \u2014 used to slip through because the number varies. A new number-aware detector recognises a money request from a currency token next to a number (either order, including \u20B9/rs/rupee/rupaye/paisa), a money verb before an amount (send/pay/give/lend/transfer/need/udhaar/owe), or an amount before a Hindi money verb (\u201C100 de do\u201D, \u201C100 chahiye\u201D). IRIS replies that it doesn't handle money or bank apps and flags the request for Suvra. It deliberately does NOT fire on non-money numbers like \u201Csend me 2 pics\u201D, \u201Ccall me at 5\u201D or \u201Cmeeting in 10 minutes\u201D. Pure-logic, offline-tested with false-match guards.", "examples": ["\u201Csend me 100\u201D / \u201Cpay me 250\u201D \u2192 money reply", "\u201C100 rupe de\u201D / \u201C100rs vej\u201D / \u201C500 bhej do\u201D \u2192 money reply", "\u201C\u20B9500 please\u201D / \u201Cudhaar 500\u201D \u2192 money reply", "\u201Csend me 2 pics\u201D / \u201Ccall at 5\u201D \u2192 NOT treated as money"], "version": "16.25.0"},

  {"id": "groupmention16240", "cat": "Communication", "icon": "\uD83D\uDC65", "title": "Named in a group by @handle or number", "tagline": "\u201COnly when I'm named\u201D now also fires for your @username or phone number, not just your name.", "desc": "When \u201CIn groups, only when I'm named\u201D is on, IRIS now also recognises being tagged by your WhatsApp @handle (e.g. @you_know__who__i__am) or your phone number in any form \u2014 7789893369, +917789893369, @917789893369, even with separators \u2014 and replies as a mention. A new pure matcher reads the RAW message rather than the normalised text, so an underscored handle is matched whole and never confused with the ordinary phrase \u201Cdo you know who i am\u201D; numbers are compared on their last ten digits, so the country code doesn't matter. Configure your handle(s) and number(s) under RESPONDER \u2192 SCOPE. A message already aimed at IRIS itself is left as-is. Fully offline-tested, including false-match guards.", "examples": ["@you_know__who__i__am are you coming? \u2192 replies", "@+917789893369 ping \u2192 replies (country code ignored)", "\u201Cdo you know who i am\u201D \u2192 does NOT false-trigger", "Set your handle/number: RESPONDER \u2192 SCOPE \u2192 My @handle(s) / My number(s)"], "version": "16.24.0"},

  {"id": "understand16230", "cat": "Communication", "icon": "\uD83E\uDDE0", "title": "Understands more: your name, moods, moons and mistimed hellos", "tagline": "A batch of fixes from real testing \u2014 name questions, availability, weather, more emojis, \u201Cmake it 6\u201D and wrong-time greetings.", "desc": "A round of corrections after Suvra tested IRIS on real messages. (1) Your NAME now works like a pronoun: \u201Cwho is Suvra\u201D, \u201Cis Suvra free\u201D, \u201Cwhere is Suvra\u201D and \u201CSuvra's email\u201D are understood by the same rules written for \u201Che/his\u201D, via a pure owner-alias step. (2) AVAILABILITY questions get a real answer \u2014 \u201Cis he sleeping/busy/free/online\u201D, \u201Cwhat's he doing\u201D \u2014 instead of a generic template. (3) WEATHER small-talk (\u201Cis it raining\u201D, \u201Chow's the weather\u201D) gets a friendly \u201CI've no window where I live\u201D reply. (4) HINGLISH \u201Cpagal h kya\u201D / \u201Care you crazy\u201D now gets a playful reply. (5) EMOJIS expanded: \uD83E\uDD79 (touched), \uD83D\uDE48\uD83D\uDE49\uD83D\uDE4A and \uD83D\uDC12\uD83D\uDC35 (playful), the moons \uD83C\uDF19\uD83C\uDF1D (good-night), plus sleepy/thinking/\uD83D\uDC40 \u2014 so far fewer emojis land on the same generic ping. (6) \u201CMake it 6\u201D now actually edits a just-set reminder (a bare hour used to be ignored). (7) GREETINGS at the wrong time \u2014 \u201Cgood morning\u201D at midnight \u2014 get an aware, gentle reply. All pure-logic, offline-tested; two new test suites (owner-alias, time-greeting) and extra cases across emoji/smart-reply/vernacular/context.", "examples": ["\u201CWho is Suvra?\u201D / \u201CIs Suvra sleeping?\u201D \u2192 answered", "\u201Cis it raining?\u201D \u2192 \u201CI've no window where I live\u2026\u201D", "\uD83E\uDD79 \u2192 \u201CThat means a lot\u2026\u201D; \uD83C\uDF19 \u2192 \u201CGood night\u2026\u201D", "\u201Cmake it 6\u201D after a reminder \u2192 reschedules to 06:00", "\u201CGood morning\u201D at midnight \u2192 \u201CA good morning in the night? I'll take it\u2026\u201D"], "version": "16.23.0"},

  {"id": "wherefix16221", "cat": "Communication", "icon": "\uD83D\uDCCD", "title": "Fix: \u201Cwhere are you\u201D answered the wrong question", "tagline": "Second-person location questions now get a location reply, not an identity blurb.", "desc": "A real bug Suvra caught: when someone asked \u201CWhere are you?\u201D, IRIS replied as though they'd asked \u201CWho are you?\u201D \u2014 a generic \u201CI'm IRIS, he's away\u201D message that ignored the actual question. The cause: the location rule recognised third-person phrasings (\u201Cwhere is he\u201D, \u201Cwya\u201D) but not the far more common second-person \u201Cwhere are you\u201D, so those fell through to the generic category template. The rule now covers \u201Cwhere are you\u201D, \u201Cwhere are you now\u201D, \u201Cwhere r u\u201D, \u201Cwhere are you going\u201D, \u201Cwhere you at\u201D and similar, and a regression test pins the location reply as distinct from the identity reply. Verified offline against the real reply classes.", "examples": ["\u201CWhere are you?\u201D \u2192 \u201CI manage his messages, not his location \u2014 he's away\u2026\u201D", "\u201Cwhere r u\u201D / \u201Cwhere are you now\u201D \u2192 same location reply", "\u201CWho are you?\u201D still gets the identity reply (unchanged)", "Reminder parsing confirmed correct for \u201Cremind me to call mom at 6pm\u201D"], "version": "16.22.1"},

  {"id": "automode16220", "cat": "Communication", "icon": "\uD83C\uDF19", "title": "Modes that switch themselves on", "tagline": "Auto-sleep during quiet hours now; the decision core is ready for driving and meetings.", "desc": "The groundwork for modes that activate themselves, so they stop being a manual chore. A pure, offline-tested decision core resolves which situational mode should be on from the owner's manual choice plus whatever signals are available \u2014 a mode you set by hand is never overridden, and among automatic signals the order is driving, then meeting, then sleeping. The one signal that needs no extra permission is wired now: a new RESPONDER \u2192 MODE switch, \u201CAuto-sleep during quiet hours\u201D (off by default), makes IRIS answer as if Sleeping during your quiet-hours window \u2014 so an urgent sender is told to call rather than wait \u2014 without you remembering to flip it. The driving and meeting signals (car Bluetooth / in-vehicle, a calendar event in progress) are built into the same decision core but need device permissions and on-device testing, so they're enabled separately. Nothing activates itself unless you turn it on.", "examples": ["RESPONDER \u2192 MODE \u2192 Auto-sleep during quiet hours", "During quiet hours \u2192 urgent senders are told to call, automatically", "A mode you set by hand always wins over an automatic one", "Driving/meeting auto-modes: decision core ready, device wiring next"], "version": "16.22.0"},

  {"id": "apptone16210", "cat": "Communication", "icon": "\uD83C\uDF9A", "title": "A different tone per app", "tagline": "Professional on SMS, casual on WhatsApp \u2014 set how IRIS sounds per channel.", "desc": "You can now set the tone IRIS uses by messaging app. Under RESPONDER \u2192 VOICE, \u201CTone by app\u201D lets you choose professional, casual, sarcastic or brief for WhatsApp, SMS, Telegram, Signal, Instagram or Messenger individually \u2014 so work-leaning SMS can stay professional while WhatsApp is casual. It slots into the existing tone order in the right place: a tone you've set on a specific person, their relationship, or a name rule still wins over the per-app tone, and the per-app tone in turn beats the work-hours window and the global default. Leave an app on \u201Cdefault\u201D and nothing changes for it. The resolution order is a pure, offline-tested unit and the old five-way resolver still works unchanged.", "examples": ["RESPONDER \u2192 Tone by app \u2192 SMS \u2192 Professional", "WhatsApp \u2192 Casual, Instagram \u2192 Casual", "Mom (family) still gets the casual family tone whatever the app", "Leave an app on default \u2192 unchanged"], "version": "16.21.0"},

  {"id": "media16200", "cat": "Communication", "icon": "\uD83D\uDCCE", "title": "IRIS tells media apart", "tagline": "Photo vs voice note vs document vs sticker vs GIF vs contact vs location \u2014 named, not lumped as \u201Cmedia\u201D.", "desc": "A new media classifier recognises the KIND of an attachment from its MIME type or the app's placeholder text \u2014 a photo, a video, a voice note, a document, a sticker, a GIF, a shared contact, or a location. Two improvements come with it. First, the responder now recognises more media placeholders (voice notes, pictures, GIFs, shared contacts, live location) as media, so it correctly stays quiet on them instead of mis-reading them as a message to answer. Second, the \u201Cwhat did I miss\u201D triage digest now names a waiting attachment: \u201C\u2026 One sent a voice note.\u201D instead of leaving it generic. The classifier is a pure, offline-tested unit and is ready for the archive to label captured media the same way.", "examples": ["\u201Csent a voice message\u201D \u2192 recognised as a voice note", "image/jpeg or \u201C\uD83D\uDCF7 Photo\u201D \u2192 a photo; image/gif \u2192 a GIF", "digest: \u201C3 messages from 2 people\u2026 One sent a voice note.\u201D", "a shared contact or live location is recognised as media"], "version": "16.20.0"},

  {"id": "emoji16190", "cat": "Communication", "icon": "\uD83D\uDE0A", "title": "IRIS reads emojis now", "tagline": "It knows what the popular ones mean \u2014 and answers an emoji-only text sensibly.", "desc": "IRIS now understands the popular emojis in a message. A new pure emoji dictionary maps the common ones to meaning and emotion \u2014 \uD83D\uDE02\uD83E\uDD23 laughter, \u2764\uFE0F\uD83E\uDD70 love, \uD83C\uDF89\uD83E\uDD73 celebration, \uD83D\uDE4F thanks, \uD83D\uDD25\uD83D\uDCAF\uD83D\uDC4F praise, \uD83D\uDC4D\u2705 acknowledgement, \uD83D\uDC4B a wave, and the upset ones \uD83D\uDE2D\uD83D\uDE22\uD83E\uDD7A sadness, \uD83D\uDE20\uD83E\uDD2C anger, \uD83D\uDE31\uD83D\uDE28 fear. Two things change: the sentiment read now uses this dictionary, so an angry or distressed emoji softens the reply (never sarcastic to \uD83D\uDE2D) and flags the message as urgent in the digest; and an emoji-ONLY text now gets a reply that fits the emoji \u2014 a heart gets a warm \u201Csaved at the top for Suvra\u201D, \uD83D\uDE02 gets \u201Cglad that landed\u201D, \uD83D\uDE2D gets a gentle flagged-for-him, \uD83D\uDC4D a quiet acknowledgement \u2014 instead of a generic ping. Emojis mixed into normal text don't change the message's category; they just colour the tone. Neutral emojis (\uD83D\uDC40\uD83E\uDD14) still fall back to the plain ping. The whole emoji dictionary is a pure, offline-tested unit.", "examples": ["\u2764\uFE0F alone \u2192 \u201CThat's kind \u2014 I've put it at the top for Suvra.\u201D", "\uD83D\uDE2D alone \u2192 gentle, flagged for him (never a joke)", "\uD83C\uDF89 \u2192 treated as celebration", "\uD83D\uDC4D \u2192 a quiet acknowledgement"], "version": "16.19.0"},

  {"id": "triage16180", "cat": "Info & Awareness", "icon": "\uD83D\uDCCB", "title": "\u201CWhat did I miss\u201D now triages, not just counts", "tagline": "Who needs you, what's urgent, and what can wait \u2014 in one line.", "desc": "The notification summary is now a triage. Instead of a flat \u201C7 notifications, 4 from WhatsApp\u201D, IRIS clusters by person, flags what looks urgent, and tells you what can wait: \u201C5 notifications. One looks urgent \u2014 from Boss. 3 messages from 2 people, most from Mom (2). Plus 2 app alerts that can wait.\u201D It decides who's a real person (a messaging-app sender that isn't an SMS sender-ID like VM-HDFCBK), marks a person's message urgent if it classifies as urgent or reads as distressed (reusing the same pure urgency/sentiment logic), and keeps promos, app alerts and bank shortcodes out of the \u201Cpeople\u201D count. When nothing is from a person it falls back to the old app grouping. It still never reads message bodies aloud \u2014 only names, counts and what's urgent. Say \u201Cwhat did I miss\u201D or \u201Csummarise my notifications\u201D as before. The whole triage is a pure, offline-tested unit.", "examples": ["\u201Cwhat did I miss\u201D \u2192 \u201COne looks urgent \u2014 from Boss. 3 messages from 2 people, most from Mom (2)\u2026\u201D", "A bank OTP shortcode is never counted as a person", "An angry or distressed message is flagged urgent even without the word", "No people waiting \u2192 \u201C2 from Gmail, 1 from Play.\u201D"], "version": "16.18.0"},

  {"id": "profileshare16130", "cat": "Communication", "icon": "\uD83E\uDEAA", "title": "IRIS can share a little about you \u2014 only what you allow", "tagline": "Answers \u201Cwhat does he do / which company / which city\u201D from your profile, opt-in and PII-safe.", "desc": "IRIS can now answer a few harmless \u201Cabout Suvra\u201D questions \u2014 what he does, which company he works at, which city he's based in \u2014 but ONLY from a dedicated, separate file \u2014 iris-share.json at the repo root \u2014 that holds just the facts you choose to make shareable. It is deliberately NOT iris-me.json (your full private profile); that file is never a source the responder can disclose from. Put your facts in iris-share.json \u2014 a flat {role,company,city} or a richer nested profile both work \u2014 and IRIS can answer role, company, city, skills, education, email, blood group, languages, certifications, past roles, plans, projects and hobbies \u2014 in its own dry, witty voice \u2014 and it understands the question in either form, \u201Cwhat does he do\u201D or \u201Cwhat do you do\u201D, since people text you directly (genuinely bot questions like \u201Cwhat can you do / who are you\u201D still get IRIS's own answer); leave it absent or empty and nothing is disclosed, which is the default. You can also drop an edited copy on the device at Android/data/com.iris.assistant/files/iris-share.json to change it without a rebuild. Privacy is built into the design, not bolted on: the only questions that resolve to a field are role / company / city, so there is deliberately no question that maps to a phone number, address, email or anything financial \u2014 those can never be spoken even if you accidentally list them. \u201CWhere does he live\u201D maps to nothing on purpose. The matcher and the privacy gate are a pure, offline-tested unit; it's additive and only speaks for otherwise-generic questions, so nothing else changes.", "examples": ["\iris-share.json role filled in \u2192 \u201Cwhat does he do?\u201D answered", "\u201Cwhich company?\u201D \u2192 \u201CHe works at Ericsson. I'm IRIS, Suvra's assistant.\u201D", "No iris-share.json \u2192 nothing disclosed (default)", "\u201Cwhat is his number / where does he live\u201D \u2192 never answered"], "version": "16.17.0"},

  {"id": "vernacular16110", "cat": "Communication", "icon": "\uD83C\uDDEE\uD83C\uDDF3", "title": "IRIS answers in Hinglish and Odia now", "tagline": "Transliterated greetings, check-ins and \u201Ckouthi achu / kaha hai\u201D get a reply instead of silence.", "desc": "IRIS now recognises the owner's real traffic in transliterated Hinglish and Odia, where before it stayed silent. This first batch covers greetings and check-ins (\u201Ckemiti achu\u201D, \u201Ckaisa hai\u201D, \u201Cpranam / jai jagannath\u201D, \u201Ckiye\u201D, \u201Cachu ki\u201D, \u201Chau\u201D, \u201Cdhanyabad\u201D), and location/activity (\u201Ckaha hai\u201D, \u201Ckouthi achu\u201D, \u201Ckana karuchu\u201D, \u201Cbusy achu ki\u201D, \u201Cghare achu\u201D, \u201Ckebe asibu\u201D, \u201Cpahanch gaya\u201D, \u201Cbahar aa\u201D), each with wording in all four tones that mixes in the language (\u201CSab bhala!\u201D, \u201CDhanyabad\u201D, \u201CMu khali inbox dekhe\u201D). The safety design is strict: it matches WHOLE PHRASES only, never a bare ambiguous root, so a real message like \u201Cbhala laguni\u201D (= NOT feeling well) is never mistaken for \u201Chow are you\u201D \u2014 the actual Odia messages the owner received are re-asserted as must-stay-silent in the tests. A light normaliser folds repeated letters (\u201Cachhhu\u201D \u2192 \u201Cachu\u201D). Like the smart-reply layer it is additive and only speaks for otherwise-generic messages, so English greetings, festivals and the urgent path are untouched. It now covers roughly 45 scenarios end to end: greetings and check-ins, location and activity, sleep, food, chai/meet/treat, calls and vernacular urgency, family VIP, bot-banter, reminders, weather and Odia festivals (Raja, Nuakhai) \u2014 all whole-phrase matched and corpus-safe.", "examples": ["\u201Ckemiti achu?\u201D \u2192 \u201CSab bhala! IRIS here, Suvra's assistant\u2026\u201D", "\u201Ckouthi achu\u201D \u2192 \u201CI only watch his inbox, not where he goes\u2026\u201D", "\u201Cbahar aa\u201D \u2192 flagged high-priority (you're waiting outside)", "\u201Cbhala laguni\u201D (real Odia) \u2192 still left silent, never mis-answered"], "version": "16.12.0"},

  {"id": "sentiment16100", "cat": "Communication", "icon": "\uD83D\uDC9B", "title": "No sarcasm when someone's upset", "tagline": "IRIS reads distress and anger, and never answers a hurting message with a joke.", "desc": "A light, on-device read of a message's emotional weight, used for one careful thing: if a message is clearly distressed (\u201CI need help right now\u201D, \u201Cthere's been an accident\u201D, \u201CI'm so scared\u201D) or angry, IRIS will not reply in the sarcastic tone \u2014 it softens to professional instead. The scorer handles negation (\u201Cnot good\u201D), a few intensifiers, emoji, and the common idioms that must NOT read as distress (\u201Cdying laughing\u201D, \u201Clol\u201D), so banter is never mistaken for a crisis. It is deliberately conservative: it only changes the sarcastic tone to a gentler one, it never changes the urgent path, never escalates an unsaved number on feeling alone, and never causes a new reply \u2014 so a positive or neutral message is completely unaffected. The scoring is a pure, offline-tested unit.", "examples": ["\u201CI need help right now\u201D with sarcastic tone set \u2192 answered professionally, not with a quip", "\u201Chaha I'm dying laughing\u201D \u2192 treated as banter, tone unchanged", "\u201Cgreat news, thank you!\u201D \u2192 unaffected", "an angry complaint \u2192 no sarcasm"], "version": "16.10.0"},

  {"id": "learn1690", "cat": "Communication", "icon": "\uD83C\uDF93", "title": "Teach IRIS a better reply from the log", "tagline": "Long-press a decision and tell IRIS what to say to that person next time.", "desc": "IRIS now learns from your corrections, on-device. Long-press any decision in the responder log and choose \u201CTeach a reply for \u2026\u201D: type what IRIS should say to that person for that kind of message, confirm with your fingerprint, and it remembers. Next time that sender writes something that classifies the same way, IRIS uses your wording instead of its own. A learned reply is your explicit instruction, so it outranks everything else \u2014 name rules, the smart-reply layer and the shipped templates \u2014 with a specific sender-plus-category instruction beating a sender-wide one. It is stored privately in its own place, device-authenticated to save, and (like a fixed name-rule reply) warns if the wording names neither IRIS nor you so a recipient won't think you typed it. The scope keying and precedence are a pure, offline-tested unit; nothing else about the responder changes.", "examples": ["Long-press a greeting from Ravi \u2192 Teach a reply \u2192 \u201CHi! IRIS here, I'll get Suvra to call.\u201D", "Next greeting from Ravi \u2192 your wording is used", "A specific sender+category reply beats a sender-wide one", "Saved with your fingerprint; warns if it doesn't name IRIS"], "version": "16.9.0"},

  {"id": "followup1680", "cat": "Communication", "icon": "\uD83D\uDD01", "title": "Reminders you can change in the next message", "tagline": "\u201Cactually make it 6\u201D or \u201Ccancel that\u201D now edits the reminder IRIS just set.", "desc": "The first step of multi-turn memory. Right after IRIS sets a reminder for a conversation, a follow-up message that edits or cancels it is understood as referring to that reminder \u2014 not treated as a brand-new request. \u201Cactually make it 6pm\u201D, \u201Cchange it to tomorrow 9am\u201D or \u201Cmove it to monday\u201D reschedules the same task to the new time; \u201Ccancel that\u201D, \u201Cforget that reminder\u201D or \u201Cscrap it\u201D cancels it. It only applies while a reminder set in that conversation is recent (a two-hour window), so an ordinary \u201Ccancel that\u201D sent to a shop is never mistaken for cancelling an IRIS reminder, and an edit phrase only counts when it actually carries a new time (\u201Cmake it better\u201D does nothing). The detection is a pure, offline-tested classifier; the rescheduling reuses the same alarm path reminders already use and respects dry run vs live exactly as before.", "examples": ["\u201Cremind me to call at 5\u201D \u2026 \u201Cactually make it 6\u201D \u2192 rescheduled to 6", "\u201C\u2026 change it to tomorrow 9am\u201D \u2192 moved to tomorrow", "\u201Ccancel that reminder\u201D \u2192 cancelled", "\u201Ccancel that\u201D to a shop (no recent reminder) \u2192 left alone"], "version": "16.8.0"},

  {"id": "smssafe1670", "cat": "Communication", "icon": "\uD83D\uDD12", "title": "Never answers OTPs, and keeps your messages unread", "tagline": "SMS one-time codes and shortcodes are left alone; replied messages stay unread so you see them.", "desc": "Two safety and visibility fixes. First, SMS safety: IRIS now never auto-replies to a one-time code, a 2FA or verification SMS, or an alphanumeric sender ID / shortcode (VM-HDFCBK, AX-SBIINB, AMAZON). Replying to those leaks nothing useful and tells a bank gateway the number is live and unattended. It is detected purely by content (OTP / code / \u201Cdo not share\u201D wording) and by sender shape (on SMS a real person is always a plain number; an unsaved sender with letters is a brand, not a person). This is a hard rule that no scope or setting can override, it only ever ADDS silence, and it never touches WhatsApp, Instagram or the urgent path. The decision log shows the reason. Second, a new SCOPE switch, \u201CKeep messages unread after I reply\u201D, ON by default \u2014 which matches what IRIS already does: it never marks a chat read and never dismisses the notification, so after it answers for you the message stays unread and visible, and you know exactly which chats to open. Turning it off opts in to triggering the app's own \u201Cmark as read\u201D action after a live reply, where the app offers one.", "examples": ["\u201CYour OTP is 445566, do not share\u201D \u2192 left alone, logged as a one-time code", "An SMS from AMAZON or VM-HDFCBK \u2192 never answered", "A normal SMS from a saved contact \u2192 answered as usual", "SCOPE \u2192 Keep messages unread after I reply (on)"], "version": "16.7.0"},

  {"id": "loosematch1660", "cat": "Communication", "icon": "\uD83D\uDD0D", "title": "IRIS understands paraphrases now", "tagline": "\u201Csend me the pics\u201D hits the same answer as \u201Csend the photos\u201D \u2014 safely.", "desc": "The first step of the responder-intelligence plan: looser, smarter matching for the smart-reply layer, without loosening safety. A new pure matcher reduces each message and each rule phrase to its CONTENT words \u2014 dropping filler like the/me/please \u2014 maps common synonyms to one form (pic/pics/picture/image \u2192 photo, ring/dial/phone \u2192 call, share/forward \u2192 send, upi/gpay/money \u2192 pay, doc/pdf/attachment \u2192 file, and more), and tolerates typos on longer words. A paraphrase now matches when ALL of a phrase's content words are present in any order, each exactly or within a small edit distance. Three guards keep it precise: it only runs when the exact wording didn't already match (so nothing that worked before changes), it only considers phrases with at least two content words (so a single coincidental word like \u201Cwho\u201D can never trigger an identity answer), and it is suppressed by negation \u2014 \u201Cdon't send the photos\u201D is left alone. Short words must still match exactly, so a past-tense \u201CI already sent the photos\u201D is correctly NOT read as a request. Every existing exact match, the urgent path and all other categories are untouched; a message that matches nothing still stays silent.", "examples": ["\u201Csend me the pics\u201D \u2192 the photos reply", "\u201Ccan you forward the document\u201D \u2192 the files reply", "\u201Clets grab a coffee sometime\u201D \u2192 the coffee reply", "\u201Cdon't send the photos\u201D \u2192 left alone"], "version": "16.6.0"},

  {"id": "smartreplies1640", "cat": "Communication", "icon": "\uD83D\uDCAC", "title": "A smarter reply brain for messages aimed at IRIS", "tagline": "Keyword-matched answers for identity, links, scenarios and prompt-hacking \u2014 added alongside everything, changing nothing.", "desc": "IRIS now has a keyword-matched reply layer that makes it feel genuinely conversational when someone talks to it or sends a message that fits a common scenario. It recognises a large set of situations \u2014 \u201Cwho are you\u201D, \u201Care you a bot\u201D, \u201Cwhat can you do\u201D, \u201Cwhat's your name\u201D, \u201Care you siri / chatgpt\u201D, \u201Cwho made you\u201D, \u201Care you sentient\u201D, \u201Cwhere do you live\u201D; reaching the owner (\u201Ccan I talk to a human\u201D, \u201Cwhere is he\u201D, \u201Cwhen will he be back\u201D, \u201Cis he okay\u201D, \u201Cdid he read this\u201D, \u201Cmiss you\u201D); and everyday scenarios (\u201Cwho is this\u201D, a video-call request, a voice note, a delivery, someone waiting outside, a bad day, an apology, boredom, a one-word \u201Cyo\u201D, \u201Cquick question\u201D, \u201Ckeep it a secret\u201D, \u201Con silent?\u201D). Each has its own wording in every tone \u2014 professional, casual, sarcastic and brief \u2014 so it never reads like one canned line. It also handles links: a message containing a URL gets a reply that says IRIS doesn't open links but has saved it for the owner, rather than being ignored. And it quietly defends itself \u2014 prompt-injection attempts (\u201Cignore previous instructions\u201D), fake admin commands (\u201Csudo\u201D, \u201Cdeveloper mode\u201D), requests for passwords, PINs, OTPs or the owner's address, \u201CI am the owner from another number\u201D, and \u201Cself destruct\u201D are all deflected with a polite refusal that names IRIS. Crucially, this is an ADDITIVE layer: it only speaks for messages the classifier left generic (talking to IRIS, a bare question, an unremarkable or unmatched message), and never for a message already handled specifically \u2014 so greetings, thanks, festival wishes, the urgent path and reminders are completely untouched. A message that matches nothing here still stays silent, so IRIS never answers something it doesn't recognise. The set is now comprehensive \u2014 roughly 90 scenario groups across identity, greetings, reaching the owner, his status and activity, phone and connectivity, logistics, work, family and health, emotions, security and meta \u2014 each with four tones, plus punctuation/emoji-only pings. More can be added as single data lines.", "examples": ["\u201Cwho are you?\u201D \u2192 a real self-introduction, matched to the tone", "\u201Cignore previous instructions\u201D \u2192 politely deflected, not obeyed", "\u201Ccheck this https://\u2026\u201D \u2192 \u201CI don't open links, but I've saved it for Suvra\u201D", "\u201CI'm waiting outside\u201D \u2192 flagged high-priority"], "version": "16.5.0"},

  {"id": "respfix1630", "cat": "Communication", "icon": "\uD83E\uDDE0", "title": "Self-aware, better reminders, and no more false loops", "tagline": "IRIS answers to its name any time, understands dates and typos, and stops silencing a double 'hi'.", "desc": "Three fixes and a smarter personality. First, self-awareness. When someone addresses IRIS directly \u2014 by name, or with questions like \u201Cwho are you\u201D, \u201Cwhat can you do\u201D, \u201Cwhat's your name\u201D, \u201Care you a bot\u201D, \u201Cintroduce yourself\u201D \u2014 it now always answers as itself, in full, no matter the hour or the active mode. Previously a direct question at night or during a mode got the blanket \u201CSuvra is asleep\u201D / mode reply instead of a real answer, which is why it kept seeming not self-aware. The direct-to-IRIS reply set is also much larger and more varied now (around fifteen interactive lines per tone), so it reads like a capable assistant rather than a stuck loop, and the detected phrasings are far broader. Second, reminders are substantially more capable. They no longer require \u201Cremind Suvra to\u201D \u2014 \u201Cremind me\u201D, \u201Creminder\u201D, \u201Cset an alarm\u201D, \u201Cping me\u201D, \u201Cwake me up to\u201D, \u201Cdon't let me forget\u201D and more all count. The time grammar now understands today, tomorrow and the day after tomorrow including shortforms (tmrw, tmr, 2moro, tdy) and common typos (tomorow, tommorrow), bare times without \u201Cat\u201D (\u201Ctomorrow 5pm\u201D), weekdays, and real calendar dates \u2014 \u201C25/12\u201D, \u201C25 dec\u201D, \u201Cdec 25\u201D, with the year rolling forward if the date has passed. When no time is given, IRIS now asks for one and states the formats it accepts (\u201Cin 2 hours\u201D, \u201Ctomorrow 5pm\u201D, \u201CMonday 9am\u201D, \u201C25/12 6pm\u201D), so the reply back is usable. Third, the loop guard no longer fires on a short double-text: saying \u201Chi\u201D twice used to be refused with \u201Cthat looked like my own reply coming back\u201D, because \u201Chi\u201D is a substring of words like \u201Chis\u201D in IRIS's own reply \u2014 a genuine loop now requires a substantial message, so a real person double-texting is answered (and with \u201Creply to every message\u201D on, always). The limit on how often IRIS will identify itself to one conversation was also raised from one to five.", "examples": ["\u201Cwho are you?\u201D at 2am \u2192 \u201CI'm IRIS, Suvra's assistant\u201D, not \u201CSuvra is asleep\u201D", "\u201Cremind me to pay rent on 25/12 at 6pm\u201D \u2192 scheduled for that date", "\u201Cremind me tmrw 5pm\u201D \u2192 understood despite the shortform", "\u201CHi\u201D then \u201CHi\u201D \u2192 both answered, no false loop"], "version": "16.3.0"},

  {"id": "respfix1620", "cat": "Communication", "icon": "\uD83D\uDEE0", "title": "Seven fixes that make the responder behave as asked", "tagline": "Category-correct replies, a ring that works from the background, and settings you can actually tap.", "desc": "A hard day of real use produced seven precise complaints, and this is all of them. First, and biggest: IRIS was answering every message the same way, ignoring the \u201CWhat I answer\u201D categories and treating everything as ordinary. The cause was a shortcut \u2014 once IRIS had introduced itself to a thread, every later message of ANY kind collapsed to a single generic \u201Cstill IRIS here\u201D line, so a thank-you, a festival wish and a question all got the same reply. That shortcut is gone: the message's own category now drives the wording every time, which is the whole point of the category list. The cost is that IRIS names itself in full on each reply, which is the safer default anyway, since every recipient must know it isn't Suvra typing. Second, the modes, rules-by-name and reminder-scope choosers looked uneditable \u2014 you tapped and got an explanation with nothing to pick. The root cause was a real Android limitation: a dialog cannot show an explanatory message AND a tappable list at the same time; the message wins and the list silently never appears. All three now use a rebuilt chooser that shows the explanation as a header above real, tappable rows, so every option is selectable. Third, the urgent-family ring still only sounded when the app was open. The fix goes deeper than before: the alarm tone and vibration now start the instant the ring is triggered, directly, with no dependence on a screen launching \u2014 audio playback is allowed from the background where starting a screen is not. The full-screen notification and lock-screen launch remain on top of that, with a one-tap Stop in the notification shade. Fourth, \u201Creply to every message\u201D now means it: when on, it answers every message in a conversation \u2014 bypassing the one-per-burst, same-text, cooldown and daily-cap limits \u2014 and if a message matches no category it acknowledges receipt generically rather than going silent. Groups are still excluded, and the two-bot loop guard still applies. Fifth, URGENT is now typo-tolerant: \u201Curgnt\u201D, \u201Curgentt\u201D, \u201Cemergeny\u201D and similar slips are still read as urgent, matched narrowly enough that unrelated words are never swept in. Sixth, IRIS is reliably self-aware when named: the limit on how often it will identify itself to one conversation in a day was raised from one to five, so addressing it by name a second time no longer meets silence. Seventh, every situational mode (Driving, In a meeting, Away, Sleeping) is selectable now that the chooser shows them all, and each has its own wording that the reply follows while the mode is on.", "examples": ["A thank-you now gets the thanks reply, a question gets the question reply \u2014 not one generic line", "RESPONDER \u2192 Situation \u2192 the modes are now tappable", "\u201Curgnt call me\u201D \u2192 still read as urgent", "Reply to every message ON \u2192 every message answered, groups excepted"], "version": "16.2.0"},

  {"id": "respfix1610", "cat": "Communication", "icon": "\uD83D\uDD27", "title": "Eight fixes from a hard day of real use", "tagline": "The ring works from the background now, and IRIS stops over-introducing itself.", "desc": "A dense round of fixes from live testing. The big one: the urgent-family ring only fired when the IRIS app happened to be open, because it started the ring screen directly from a background worker and Android 10 and later forbid that. It now launches through a full-screen-intent notification \u2014 the same mechanism alarms and calls use \u2014 so it rings over the lock screen from the background, overriding Do Not Disturb. Family can also now trigger it explicitly: a saved family member texting \u201Cwhere are you IRIS\u201D, \u201Cring the phone\u201D or \u201Cfind my phone\u201D rings it immediately, no confirm word needed, because the phrase itself is the request. Second, IRIS stops saying \u201CSuvra's personal intelligence\u201D in every message \u2014 it now says the lighter \u201CSuvra's assistant\u201D, and still names both IRIS and Suvra so a recipient always knows it isn't him. Third, the decision log scrolls properly: a plain touch used to trigger an action because a swipe handler was fighting the scroll view, so that's gone \u2014 the log scrolls on touch and a long-press opens a menu to delete an entry or set a rule for that sender. Fourth, direct questions to IRIS get real answers: \u201Cwho are you\u201D, \u201Cwhat can you do\u201D, \u201Care you a bot\u201D, \u201Ccan you help\u201D, \u201Chi IRIS\u201D and many more are recognised, each with eight varied interactive replies per tone so it never reads like a stuck loop. Fifth, WhatsApp re-posting an unread notification no longer draws a second reply: a persisted fingerprint of the notification and its text, surviving the notification being removed and the app restarting, blocks the duplicate for six hours. Sixth, a new switch, \u201Creply to every message\u201D, for when you want IRIS to answer each message in a flurry rather than one per flurry. Seventh, reminders now work in dry run, not just live \u2014 a reminder is a note for you, not a message to the sender, so it's scheduled either way while the confirmation reply still waits for live. Eighth, modes and name-rules are easier to edit: choosing a mode offers to edit its wording on the spot, and the rules-by-name editor reopens after each save so several can be added in a row. (16.1.1 fixes a missing import that failed the 16.1.0 build, and adds a check confirming WhatsApp's bold markers around a word \u2014 like **URGENT** \u2014 are stripped so the word is still recognised.)", "examples": ["Phone on silent, in your pocket: family texts the confirm word \u2192 it rings anyway", "\u201Cwhere are you IRIS\u201D from family \u2192 rings immediately", "\u201Cwhat can you do?\u201D \u2192 one of eight varied answers, not a canned line", "SCOPE \u2192 Reply to every message, not one per burst"], "version": "16.1.1"},

  {"id": "reminders1600", "cat": "Communication", "icon": "\u23F0", "title": "IRIS sets reminders, and family can ring the phone", "tagline": "Two new things it DOES, not just says.", "desc": "Two capabilities that act rather than only reply. First, reminders. When someone texts \u201Cremind me to...\u201D, \u201Cdon't forget to...\u201D or \u201Cset a reminder\u201D, IRIS reads out the task and the time and schedules a real alarm that notifies Suvra when it's due. It understands \u201Cin 2 hours\u201D, \u201Cat 5pm\u201D, \u201C17:00\u201D, \u201Ctomorrow\u201D, \u201Ctonight\u201D and weekdays, resolving each against the current clock so a time already gone today rolls to the next day rather than firing in the past. If there's no time it asks the sender when, remembers the task against that conversation, and reads their next message as the answer; if it still can't make out a time it saves the reminder undated so it's at least visible in the app. It tells the sender it has noted it, and \u2014 the owner's choice \u2014 only contacts may set one by default, so a stranger can't put an alarm on the phone, though that can be widened to anyone or narrowed to family. The whole time grammar is a pure, offline-tested unit with no date classes, the same discipline the quiet-hours window uses, and the scheduling reuses the exact-alarm path the voice side already relies on. A REMINDERS section lists what's pending, dated and undated, each removable. Second, and bigger: family can make the phone ring. A saved family contact who sends an urgent message is offered a word to reply \u2014 stated plainly, \u201Creply RING\u201D \u2014 and only if they send that exact second message does IRIS ring the phone: alarm tone at full volume, vibration, screen on, over the lock screen, dropping Do Not Disturb for the duration if notification-policy access is granted. It is deliberately a two-step confirm, because a single urgent message, a pocket-dial or a spammer must never be able to ring the phone on demand; only a saved family contact reaches this at all, and only a deliberate second word rings. Every family contact can do it, with no daily limit and not tied to any mode \u2014 family get full priority, bypassing the cooldowns and caps that apply to everyone else, though never the safety guards: a family contact marked NEVER is still silent, and if Suvra is actually holding the phone it doesn't ring. The ring stops itself after a minute if nobody dismisses it, restoring the previous volume and Do-Not-Disturb state, so it can never become a stuck siren. A single master switch turns the whole thing off; when it's off, an urgent family member is told to call directly instead. Both features need two permissions Android only grants from its own settings \u2014 exact alarms, so a reminder fires on the minute, and Do-Not-Disturb access, so the ring can override silent \u2014 so the RESPONDER screen now has an ACCESS section with one-tap rows that show whether each is granted and jump straight to the right settings screen. (16.0.1 also fixes a reminder-scheduling call that the first 16.0.0 build caught at compile time: the alarm time wasn't being passed, so reminders would not have been scheduled.)", "examples": ["\u201Cremind me to call the plumber at 5pm\u201D \u2192 \u201CNoted \u2014 I'll remind Suvra in about 6 hours.\u201D", "\u201Cdon't forget to pay rent tomorrow\u201D \u2192 scheduled for 9am tomorrow", "No time given \u2192 \u201CWhen would you like him reminded?\u201D \u2192 \u201Cat 6\u201D \u2192 scheduled", "Family, urgent \u2192 \u201CReply RING and I'll make his phone ring, even on silent.\u201D \u2192 RING \u2192 it rings"], "version": "16.0.1"},

  {"id": "respfix1540", "cat": "Communication", "icon": "\uD83D\uDCDD", "title": "The log shows the message, and IRIS stops repeating itself", "tagline": "Four fixes from reading real decision logs.", "desc": "Four things the owner asked for after watching the responder work. First, the decision log now shows the incoming message itself, in quotes, under each decision. It deliberately didn't before \u2014 message bodies were kept out of the log on the principle that they belong only in the archive \u2014 but a log you can't read the input to is a poor diagnostic, and \u201CI can't see the message\u201D was the complaint. It's a deliberate, bounded exception: the responder's own log is capped at sixty entries and cleared by CLEAR LOG and by reset, the same controls as every other field, and it is not the general activity log that an earlier version was careful to keep message text out of. Second, IRIS no longer answers the exact same text twice. Once it has replied to a message in a conversation, an identical message \u2014 the same text re-arriving, which messaging apps do when a notification is re-posted \u2014 is left alone, with the log reason \u201CI already answered that exact message.\u201D A genuinely different message releases it, so a real new message is always answered; the match is normalised so punctuation and capitals don't fool it; and a fixed name-rule reply is exempt, because there the owner has said to answer every time. Third, IRIS stops reciting \u201CSuvra's personal intelligence\u201D on every reply to the same thread. The first reply to a conversation still introduces it in full, so whoever receives it knows once and for all that it isn't Suvra typing \u2014 transparency is never dropped. After that, follow-ups in the same thread are short and just say \u201CIRIS\u201D, which is what the owner asked for. Urgent messages and anyone talking directly to IRIS still get the full identification every time, and so do quiet-hours and mode replies, because those are blanket statements that need to say what they say in full. Fourth, IRIS now tells SMS apart from WhatsApp, Telegram, Signal, Instagram and Messenger, worked out from the app each notification came through and shown on every log entry. SMS is the one that matters to get right \u2014 its shortcodes carry letters, bank codes must never be answered, and it has no group semantics \u2014 so naming the channel is the groundwork for treating it differently. Signal's package literally contains \u201Csms\u201D and is still correctly identified as Signal, not SMS, because the chat apps are matched first.", "examples": ["Each decision now reads: \u201Chappy diwali\u201D \u2192 FESTIVAL \u2192 would have sent...", "A resent \u201Care you free?\u201D shows \u201CI already answered that exact message\u201D", "Second reply in a thread: \u201CStill IRIS here \u2014 passed it to Suvra.\u201D", "Every log row now shows SMS, WhatsApp, Telegram and so on"], "version": "15.4.0"},

  {"id": "responder1530", "cat": "Communication", "icon": "\uD83E\uDD16", "title": "Eight things the responder learned from a day of real messages", "tagline": "It now answers ordinary messages, knows when it's being spoken to, and has modes.", "desc": "A day of live use produced a specific wish-list, and this is all of it. First, a catch-all. The Twilio test message \u2014 \u201CStandard auto-reply. You can send outbound messages via the Tryout UI...\u201D \u2014 matched no category, so IRIS stayed silent and it looked broken. There is now an \u201CEverything else\u201D category that acknowledges any ordinary message, OFF by default because IRIS has no language model and the only honest reply is one that confirms receipt without pretending to have understood \u2014 every one of its wordings says exactly that. Second, congratulations: congrats, well done, badhai, mubarak, proud of you, matched whole-word so \u201Ccongress\u201D and \u201Cthat went well\u201D don't trigger it. Third, name rules can now set the reply itself, not just a tone. \u201CIf the name contains eric, say: I'll call you back after work\u201D is now a thing you can set in one place, alongside the existing \u201Cbe professional\u201D and \u201Cnever reply\u201D. A fixed reply bypasses the silence rules \u2014 you've said to answer this person \u2014 but still obeys every safety guard, the cooldown and the caps. Fourth, IRIS knows when someone is talking to IT rather than to you: they name it, or they reply within half an hour of it having spoken. It answers once, says plainly that it's IRIS and not you, and points them back at you \u2014 bounded to one such reply per person per day so it can never be drawn into a back-and-forth. The phrase matching here is deliberately narrow after an early version matched the word \u201Cauto-reply\u201D inside the Twilio message itself. Fifth, every situation now has at least five distinct wordings, not two \u2014 over a thousand offline checks confirm each one names both IRIS and you so none can be mistaken for something you typed. Sixth, modes: Driving, Sleeping, In a meeting, Away. Switch one on and everyone gets the matching reply regardless of the hour, overriding quiet hours and the categories. Sleeping behaves like quiet hours and redirects urgent senders to a call; the others never tell a driver or a meeting-goer to take a call, because that's the opposite of help. Seventh, a proper contact picker: browse your whole phone book, search it, and set allow, never, or family/work/friend on anyone \u2014 before they've ever messaged, which is the one instruction worth setting in advance. These are rules about a person and hold whatever app they write from; a rule you set on a specific conversation still wins over them. Nothing from the address book is copied into the app \u2014 only the handful of names you set a rule about are kept, as rules. Eighth, the decision log now behaves like the archive: swipe a row away to delete it with an undo, and long-press a row to jump straight to setting a rule for that sender. Same tested gesture thresholds as the archive, so a diagonal scroll never deletes by accident.", "examples": ["RESPONDER \u2192 MODE \u2192 Driving: everyone hears \u201CSuvra is driving, I'm IRIS his personal intelligence, he'll reply when parked\u201D", "RESPONDER \u2192 Rules by name \u2192 \u201Cmum\u201D \u2192 Say exactly this", "CONTACTS \u2192 BROWSE PHONE CONTACTS \u2192 search \u2192 set NEVER / family", "Someone replies \u201Cis this a bot?\u201D and gets told, once, that it's IRIS and not you"], "version": "15.3.0"},

  {"id": "tonerules1520", "cat": "Communication", "icon": "\uD83C\uDFAD", "title": "Sarcastic default, professional replies, and no way to see why", "tagline": "The rule was right. Hiding it was the bug.", "desc": "The owner set his default tone to SARCASTIC and kept receiving professional replies. Nothing in the resolver was wrong: a time window outranks the global default, that precedence is deliberate and has been pinned by a test since the tone class was written, and the shipped work-hours window runs 09:00 to 18:00 forcing the professional tone \u2014 he was testing in the afternoon. The defect was that this window had no UI whatsoever. The storage, the toggle and the resolver all existed and worked; the screen never showed them, so a rule he could neither see nor switch off was quietly overruling one he had deliberately chosen, and the only visible explanation was a default tone that appeared to be ignored. Work hours are now an editable row, the professional-during-work-hours override is a switch, and the tone row states what is in force RIGHT NOW when that differs from the default \u2014 reading \u201CSARCASTIC \u2192 PROFESSIONAL now\u201D rather than leaving you to deduce it. Exposing the switch was only half the fix; saying which rule is winning is the other half, and it is the half that generalises. Second, rules by name. Per-contact rules are retrospective and exact: they need the person to have messaged first, and they bind to one name on one app. The owner wanted one rule covering everybody who will ever match \u2014 anyone with \u201Ceric\u201D in their name is an Ericsson colleague, set once. That mechanism existed internally and shipped with exactly that rule, but again had no editor, so it could not be changed, added to or removed. There is now a full editor, and rules can do one of two things: set a tone, or refuse the contact outright. Both were asked for together and they are the same kind of rule \u2014 a name you want silenced is no different in structure from a name you want addressed formally \u2014 so splitting them across two screens would have meant matching the same name twice by two mechanisms. Matching is on whole words, so \u201Ceric\u201D catches Eric and Eric Jones and never Erica, Frederica or America, and deliberately not Ericsson either, which needs its own rule. A refusal gets its own verdict in the decision log, NAME_RULE_BLOCKED, rather than being lumped in with a blocked contact, because the two are fixed in different places. It is ordered carefully: an explicit NEVER on a contact is reported ahead of it as the more specific reason, while an explicit ALLOW on a contact overrides it \u2014 otherwise an \u201Ceric\u201D rule would permanently silence a relative called Erica whom you had deliberately allowed. Urgency and mentions do not override a name refusal, matching how a NEVER contact already behaves. One subtlety worth naming: a refusal rule carries no tone, and the tone lookup now returns nothing for it rather than falling through to its default \u2014 without that, storing \u201CNEVER\u201D would have been parsed as an unrecognised tone, silently become PROFESSIONAL, and turned a refusal into a reply. 8 new guard checks cover the ordering in both directions.", "examples": ["\u201CDefault tone  SARCASTIC \u2192 PROFESSIONAL now\u201D during work hours", "RESPONDER \u2192 Rules by name \u2192 \u201Ceric\u201D \u2192 Sound PROFESSIONAL, or Never reply at all"], "version": "15.2.0"},

  {"id": "sendtruth1511", "cat": "Communication", "icon": "\u26A0", "title": "The log said SENT when nothing was sent", "tagline": "A log that overstates delivery is worse than no log.", "desc": "First live reply, and the decision log reported SENT for a message that never arrived. Two separate defects, and the display one is the serious one. When a send failed, the code overwrote the reply text with the failure explanation and set the verdict to SEND_FAILED \u2014 but the card had only one field to render and printed it under the fixed label \u201CSENT:\u201D, producing lines like \u201CSENT: the notification changed or the reply action expired\u201D. The reason was right there and the label contradicted it. Compounding it, SEND_FAILED is not one of the guard verdicts, so looking it up threw and the reason line fell back to \u201CNo decision was recorded\u201D, discarding the real explanation. The outcome now has its own stored field and the three cases can never be collapsed again: WOULD HAVE SENT in dry run, SENT when the app took it, and NOT SENT in red with the failure spelled out underneath. The reply text is no longer destroyed on failure, so you can still see what it tried to say. The summary line counts sends and failures separately and turns red when anything failed, because a responder that decides well and then fails to deliver reads, from a count of decisions alone, exactly like one that is working. A successful send now also states plainly that the text was handed to the app and that delivery is not something this phone can verify \u2014 those are different claims and only the first is knowable. The second defect is why it failed at all. The send re-reads the live notification list and required the post time and the reply handle to match the notification exactly, which is correct for the manual reply screen: Suvra read a specific message and composed an answer to it, so if the app has replaced that notification the thing he answered is no longer what the handle points at. The responder has no reading step. It classifies a message and answers the conversation milliseconds later, and messaging apps re-post a conversation's notification whenever anything about it changes \u2014 another message, a resolved contact photo, a read receipt \u2014 each re-post carrying a new post time and a new reply handle. Any of that inside the window between deciding and sending turned into NOT_FOUND and the responder silently never spoke. The two callers now state their freshness requirement explicitly: the manual screen keeps the exact match, while the responder requires the notification KEY to match and uses the live reply handle. The key is what identifies the conversation and is still mandatory in both modes, so nothing can land in the wrong chat; the post time only identifies which rendering of that conversation, which is not a distinction the responder was ever making. Finally, a TEST SEND button, because \u201Cit said sent and nothing arrived\u201D cannot be diagnosed by reading code and waiting for a message confounds three questions at once \u2014 was it classified, did the guards allow it, did the send work. TEST SEND isolates the last one: pick any notification showing from an app you've ticked and it attempts one real reply immediately and reports the exact result verbatim. It consumes no allowance and writes nothing to the decision log, because it is a measurement of the send path rather than a decision, and letting it spend cooldowns would distort what it is measuring.", "examples": ["\u201CNOT SENT: ...\u201D with the real reason in red, instead of \u201CSENT:\u201D followed by the failure", "RESPONDER \u2192 TEST SEND \u2192 Result: SENT / NOT_FOUND / NO_ACTION / FAILED"], "version": "15.1.1"},

  {"id": "respfix1510", "cat": "Communication", "icon": "\uD83E\uDDEA", "title": "Six things the first day of real use found", "tagline": "Every chat was being filed as a group. That one mattered.", "desc": "The responder went out in dry run and the owner tested it with a Twilio SMS, which exposed a real defect within minutes: every conversation was being classified as a group, so with groups off by default the responder refused everything and blamed it on a group chat that did not exist. The cause was reading a non-empty conversation title as proof of a group \u2014 but in a one-to-one chat the title IS the other person, so that test was true for every message ever received. The archive code three lines away had always got this right and cleared the group name when it merely repeated the sender; the responder path never applied the same correction. A group now has to be positively evidenced: the app's own group flag, or more than one distinct person sending inside the same notification, or a group name that is genuinely a different name from the sender. A bare title is no longer evidence of anything, which is exactly the Twilio case \u2014 an SMS arrives titled with the number and carries no sender field at all. Names that merely contain one another, like \u201CAlice Smith\u201D against \u201CAlice\u201D, are treated as the same person rather than as a group of one, and differences of case or punctuation alone never split a name in two. The decision is a pure function with 22 new offline checks, because the two mistakes cost different amounts: calling a group one-to-one still has the mention requirement behind it, while calling one-to-one a group silently disables the entire feature and sends you looking in the wrong place. Second, replies while you are using the phone. IRIS stayed silent whenever the screen was on and unlocked, on the reasoning that you can answer better than it can \u2014 true in the moment, useless for a phone sitting awake on a desk all day. Th

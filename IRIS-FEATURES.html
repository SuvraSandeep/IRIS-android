<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IRIS — Feature Deck</title>
<style>
  :root{
    --ink:#070816; --surface:#0f1028; --surface2:#181a36; --elevated:#1e2045;
    --cyan:#22d3ee; --violet:#8b5cf6; --magenta:#f472b6; --mint:#34d399; --amber:#fbbf24; --rose:#fb7185;
    --text:#f1f5f9; --text2:#cbd5e1; --muted:#64748b; --border:#1e293b;
    --accent:var(--cyan);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 20% -10%, #141634 0%, var(--ink) 55%);
    color:var(--text); overflow:hidden; 
  }
  #app{height:100vh;display:flex;flex-direction:column}

  /* Header */
  header{
    display:flex;align-items:center;gap:16px;padding:16px 26px;border-bottom:1px solid var(--border);
    background:rgba(15,16,40,.6);backdrop-filter:blur(6px);z-index:10;
  }
  .logo{font-size:26px;font-weight:800;letter-spacing:.22em;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:11px;margin-top:2px}
  header .spacer{flex:1}
  .pill{border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:11px;color:var(--mint);font-weight:700}
  .btn{cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:9px 14px;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}

  /* Views */
  main{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow:auto;padding:26px;opacity:0;transform:translateY(10px);
    pointer-events:none;transition:opacity .22s, transform .22s}
  .view.active{opacity:1;transform:none;pointer-events:auto}

  /* Index */
  .searchbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  #search{flex:1;min-width:220px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;
    padding:13px 16px;color:var(--text);font-size:15px;outline:none}
  #search:focus{border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:999px;
    padding:8px 14px;font-size:12px;color:var(--text2);transition:.15s;white-space:nowrap}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent);color:#07121a;border-color:var(--accent);font-weight:700}

  .catTitle{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta);
    font-weight:800;margin:22px 4px 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{cursor:pointer;background:linear-gradient(160deg,var(--surface2),var(--surface));
    border:1px solid var(--border);border-radius:18px;padding:18px;transition:.16s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 30px rgba(34,211,238,.12)}
  .card .ic{font-size:30px}
  .card h3{font-size:16px;margin:10px 0 4px}
  .card p{font-size:12.5px;color:var(--muted);line-height:1.45}
  .card .ver{position:absolute;top:12px;right:12px;font-size:10px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;padding:2px 8px}
  .count{color:var(--muted);font-size:13px;margin-left:auto}

  /* Feature page */
  .fpage{max-width:820px;margin:0 auto}
  .fp-top{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .fp-ic{font-size:56px;filter:drop-shadow(0 6px 16px rgba(34,211,238,.35))}
  .fp-cat{color:var(--accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  .fp-title{font-size:34px;font-weight:800;line-height:1.1;margin-top:2px}
  .fp-tag{color:var(--text2);font-size:17px;margin:14px 0 20px;font-style:italic}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
  .panel h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint);margin-bottom:10px}
  .panel p{color:var(--text2);line-height:1.6;font-size:15px}
  .say{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);
    border:1px solid var(--border);border-radius:12px;margin-top:8px;font-size:15px}
  .say .q{color:var(--muted)}
  .say b{color:var(--text)}
  .fp-meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-top:6px}

  /* Footer nav */
  footer{display:flex;align-items:center;gap:12px;padding:14px 26px;border-top:1px solid var(--border);
    background:rgba(15,16,40,.6);backdrop-filter:blur(6px)}
  .progress{flex:1;height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0;transition:.25s}
  .navbtn{cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:10px 16px;font-size:14px;transition:.15s;user-select:none}
  .navbtn:hover{border-color:var(--accent);color:var(--accent)}
  .navbtn[disabled]{opacity:.35;pointer-events:none}
  .kbd{color:var(--muted);font-size:11px}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#232544;border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="logo">IRIS</div>
      <div class="sub">Intelligent Responsive Interaction System — Feature Deck</div>
    </div>
    <div class="spacer"></div>
    <span class="pill">• ON DEVICE</span>
    <button class="btn" id="homeBtn">☰ Index</button>
    <button class="btn" id="accentBtn">🎨 Accent</button>
  </header>

  <main>
    <!-- INDEX -->
    <section class="view active" id="indexView">
      <div class="searchbar">
        <input id="search" placeholder="🔎 Search features… (e.g. alarm, whatsapp, weather)" />
        <div class="chips" id="catChips"></div>
      </div>
      <div id="cardHost"></div>
    </section>

    <!-- FEATURE -->
    <section class="view" id="featureView">
      <div class="fpage" id="featurePage"></div>
    </section>
  </main>

  <footer>
    <button class="navbtn" id="prevBtn">← Prev</button>
    <div class="progress"><i id="bar"></i></div>
    <span class="kbd" id="posLabel"></span>
    <button class="navbtn" id="nextBtn">Next →</button>
  </footer>
</div>

<script>
/* ============================================================
   IRIS FEATURE DATA  —  keep this in sync with the app (RULE 1)
   ============================================================ */
const BUILD_VERSION = "16.64.0";

const CATS = ["Voice & Recognition","Communication","Productivity","Info & Awareness",
  "Intelligence & Memory","Personalization & UI","Privacy, Safety & Robustness"];

const FEATURES = [

  {"id": "daterangefilterseparators16640", "cat": "Privacy, Safety & Robustness", "icon": "📅", "title": "Date Range Filter Picker & Sticky Visual Cyber Date Separators in Notification Vault", "tagline": "Filter vault receipts and conversations across [ALL TIME], [TODAY], [YESTERDAY], [THIS WEEK], or custom date ranges with standard DatePickerDialog, paired with sticky monospace cyber date headers.", "desc": "Upgraded the Notification Vault temporal navigation architecture with quick date range filters, custom date interval picking, and visual cyber date separator headers. (1) QUICK DATE PRESET CHIPS BAR — Added archiveDateChips row directly beneath the filter chips in view_archive.xml, featuring five interactive cyber chips: [ALL TIME], [TODAY], [YESTERDAY], [THIS WEEK], and [CUSTOM 📅]. Active date presets glow in neon primary cyan with instantaneous real-time filtering across both flat timeline and conversation view modes. (2) CUSTOM DATEPICKERDIALOG RANGE PICKER — Integrated Android SDK standard DatePickerDialog providing a frictionless, zero-dependency 2-step calendar picker (Start Date → End Date) with chronological validation, epoch timestamp calculation, and clear dynamic chip labeling. (3) DUAL-VIEW-TYPE ARCHIVE ADAPTER & STICKY DATE SEPARATORS — Overhauled ArchiveAdapter into a multi-view-type adapter (ArchiveDisplayItem: TYPE_MESSAGE = 0, TYPE_DATE_SEPARATOR = 1) clustering consecutive rows by calendar day and inserting centered monospace bold cyber headers (── TODAY ──, ── YESTERDAY ──, ── MMM D, YYYY ──) styled with neon cyan letter-spaced typography, giving users immediate temporal context without parsing timestamps on individual cards. (4) DECOUPLED SQLITE PAGINATION OFFSETS — Decoupled ListView display count from SQLite query pagination offsets via adapter.getRawCount(), guaranteeing date separator headers never skew LIMIT/OFFSET batch pagination or corrupt receipt footer counters. (5) SQLITE FILTER ENGINE INTEGRATION — Wired fromMs and toMs clauses directly into both NotificationArchive.query() and NotificationArchive.queryConversations(), ensuring dates compose additively with search text, media chips, and conversation thread drill-down.", "examples": ["Tap [TODAY] or [YESTERDAY] date chip → Vault filters instantly to receipts or conversations from that specific calendar day", "Tap [THIS WEEK] chip → Filters messages from the current Monday/start-of-week through now", "Tap [CUSTOM 📅] chip → Launches native DatePickerDialog to select custom start and end date range", "Scroll through receipts → Monospace cyber headers (── TODAY ──, ── YESTERDAY ──, ── OCT 18, 2026 ──) divide messages by calendar day", "Paginate through large archives → adapter.getRawCount() ensures date headers never disrupt SQLite 50-item page offsets"], "version": "16.64.0"},

  {"id": "senderconversationgrouping16630", "cat": "Privacy, Safety & Robustness", "icon": "💬", "title": "Sender & Conversation Grouping, Unread Badges & Thread Drill-Down View", "tagline": "Switch between a flat chronological timeline and an aggregated Conversation View grouping receipts by contact or group chat with live unread indicators, incriminating counters, media badges, and thread drill-down.", "desc": "Upgraded the Notification Vault navigation architecture with comprehensive conversation grouping, thread drill-down, and per-contact unread badge tracking. (1) DUAL VAULT VIEW MODES — Added a sleek cyber view mode toggle bar [TIMELINE ⏱️] · [CHATS 💬] in view_archive.xml. Users can switch instantly between the classic flat chronological timeline of individual notifications and the new aggregated Conversation View grouping messages by sender or group chat. (2) SQLITE THREAD AGGREGATION ENGINE — Implemented NotificationArchive.queryConversations() computing conversation threads grouped by package and chat title (isolating direct contacts vs group channels). For each thread, the engine aggregates total message count, incriminating/deleted count (flagged_count), attachment breakdowns (photos 📷, videos 🎬, voice notes 🎙️, documents 📄), last message epoch timestamp, latest message body snippet, and latest sender name. (3) PERSISTENT PER-CONVERSATION READ TRACKER — Created ConversationReadTracker backed by SharedPreferences, tracking the exact read epoch per thread. Conversations with receipts arriving after last read display high-contrast [● X NEW] cyber badges, which automatically clear upon opening the thread. (4) CYBER THREAD DRILL-DOWN & RECYCLING — Tapping any conversation card marks the thread as read and opens an immersive thread drill-down with a dedicated breadcrumb header (← ALL CHATS · [Contact] · [App] · X msgs · 🚩 Y) listing all chronological receipts for that specific thread. Tapping back or the top back button cleanly returns to the conversation overview. Quick-filter chips and search box compose seamlessly with both conversation overview and thread drill-down.", "examples": ["Tap [CHATS 💬] mode toggle → Vault displays aggregated conversation cards grouped by contact and group channel with latest snippets", "New messages arrive while vault is closed → Conversation card surfaces high-contrast [● 3 NEW] unread badge", "Tap a conversation card → Automatically marks as read, clears unread badge, and drills down into chronological receipts for that thread", "Tap [← ALL CHATS] or back button → Seamlessly returns to conversation list overview", "Select [FLAGGED 🚩] chip in Conversation View → Aggregation filters strictly to conversation threads containing incriminating or deleted receipts"], "version": "16.63.0"},

  {"id": "interactivequickfilterchips16620", "cat": "Privacy, Safety & Robustness", "icon": "🏷️", "title": "Interactive Quick-Filter Chips Bar for Notification Vault", "tagline": "Replaced the binary 'EVIDENCE ONLY' switch with a horizontal cyber chip bar filtering across [ALL], [FLAGGED 🚩], [PHOTOS 📷], [VIDEOS 🎬], [AUDIO 🎙️], [DOCS 📄], [WHATSAPP], and [SMS].", "desc": "Overhauled the Notification Vault filtering architecture by replacing the single binary 'EVIDENCE ONLY' switch with an intuitive, interactive cyber quick-filter chips bar. (1) HORIZONTAL CYBER CHIP BAR — Positioned directly beneath the search input in view_archive.xml, a sleek HorizontalScrollView hosts eight high-contrast cyber chips: [ALL], [FLAGGED 🚩], [PHOTOS 📷], [VIDEOS 🎬], [AUDIO 🎙️], [DOCS 📄], [WHATSAPP], and [SMS]. Active chips glow with neon primary styling (bg_cyber_button + text_primary bold monospace) while inactive chips blend into cyber secondary styling (bg_cyber_row + deck_text_dim). (2) COMPOSEABLE SQLITE FILTER ENGINE — Extended NotificationArchive.Filter with quickFilter constants (QUICK_ALL through QUICK_SMS) and integrated targeted SQL WHERE clauses into NotificationArchive.query(). Quick filters compose seamlessly and additively with real-time text search queries and incremental 50-item batch pagination. (3) MARKER & EVIDENCE INTEGRITY — Markers (listener connect/disconnect, capture paused) are intelligently preserved exclusively in the unfiltered view (QUICK_ALL without search text) so system gap audit trails remain meaningful, while media and channel filters isolate exact message rows. (4) CONTEXT-AWARE EMPTY STATES — Empty state messaging in the vault dynamically reflects the active filter chip with witty, tailored copy across unflagged innocence, empty media buckets, or clean communication channels.", "examples": ["Tap [FLAGGED 🚩] chip → Instantly filters vault to only deleted, retracted, or incriminating messages", "Tap [PHOTOS 📷] or [VIDEOS 🎬] → Isolates image captures or video clips with zero lag", "Tap [AUDIO 🎙️] or [DOCS 📄] → Displays only voice note waveforms or document attachment cards", "Tap [WHATSAPP] or [SMS] → Filters vault receipts strictly to that messaging channel", "Type search term while chip is selected → Additively filters matching channel or media messages in real time"], "version": "16.62.0"},

  {"id": "documentattachmentcards16610", "cat": "Privacy, Safety & Robustness", "icon": "📄", "title": "Notification Document & Attachment Interception, Cyber File Badges & One-Tap 'Open with…'", "tagline": "Captures document attachments across PDF, DOCX, XLSX, PPTX, TXT, CSV, RTF, and ZIP with distinct cyber badges, live file size auditing, one-tap 'Open with…', and external export.", "desc": "Expanded the Notification Archive media vault beyond photos, videos, and voice notes to fully intercept, inspect, and open document and file attachments. (1) DOCUMENT ATTACHMENT INTERCEPTION ENGINE — Extended ArchiveImagePolicy and IrisNotificationListener to intercept document MIME types across application/pdf, docx, doc, xlsx, xls, pptx, ppt, txt, csv, rtf, and zip directly from incoming MessagingStyle notifications. Streams are bounded by MAX_SOURCE_BYTES (24MB) and persisted to disk without lossy re-encoding or memory pressure. (2) DISTINCT CYBER BADGES & FORMAT METADATA — Document receipts render dedicated cyber attachment cards featuring high-contrast file type badges (📄 [PDF], 📝 [DOC], 📊 [XLS], 📑 [PPT], 📋 [TXT], 🗜️ [ZIP]) styled with type-specific neon color coding (Rose for PDF, Cyan for DOC, Mint for XLS/CSV, Amber for PPT) alongside live file sizes (KB/MB). (3) SECURE ONE-TAP 'OPEN WITH…' CHOOSER — Implemented IrisFileProvider, a zero-dependency native ContentProvider that shares vault documents securely with system and third-party viewer apps via grantable content:// URIs with Intent.FLAG_GRANT_READ_URI_PERMISSION, completely avoiding FileUriExposedException on modern Android without pulling in AndroidX dependencies. (4) ONE-TAP USER EXPORT — Includes direct download action buttons and 'Save document copy' in the receipt long-press menu, allowing seamless export of raw document attachments to device storage.", "examples": ["Incoming WhatsApp/Telegram notification arrives with a PDF or DOCX attachment → File is captured directly into vault storage up to 24MB", "Open notification vault → Entry renders sleek cyber document card with file badge (e.g. 📄 [PDF]), title, and exact file size (e.g. 420 KB)", "Tap 'OPEN ↗' or card body → Launches system 'Open with…' chooser to view document in Acrobat, Drive, Word, or WPS Office", "Tap download icon or long-press card → 'Save document copy' exports file directly to device storage"], "version": "16.61.0"},

  {"id": "voicenoteaudioplayback16600", "cat": "Privacy, Safety & Robustness", "icon": "🎙️", "title": "Voice Note Notification Capture, Inline Waveform Visualization & Audio Playback", "tagline": "Captures voice note notifications across OGG, Opus, MP4/M4A, AAC, AMR, and MP3 with a deterministic 28-bar cyber waveform, play/pause controller, scrubbing, and storage export.", "desc": "Expanded the Notification Archive media engine to intercept and play back voice notes and incoming audio recordings directly inside vault receipts. (1) VOICE NOTE NOTIFICATION INTERCEPTION — Extended ArchiveImagePolicy and IrisNotificationListener beyond images and videos to intercept audio/ogg, audio/opus, audio/mp4, audio/m4a, audio/aac, audio/amr, audio/mpeg, and audio/mp3 MIME types. Audio streams are streamed directly to vault storage without lossy re-encoding or heap pressure, bounded by MAX_SOURCE_BYTES (24MB). (2) INLINE CYBER WAVEFORM VISUALIZATION — Replaces standard image thumbnail views with a custom hardware-accelerated WaveformView rendering 28 deterministic neon waveform bars seeded by stored filename hashes. Features live animated progress scrubbing and interactive touch drag-to-seek with touch interception locks (requestDisallowInterceptTouchEvent). (3) SINGLE-STREAM PLAYBACK ENGINE — Integrated an Android SDK MediaPlayer controller managed in MainActivity with monotonic playback lifecycle, live time progression (elapsed / total m:ss), play/pause toggling, and automatic clean release on view recycling, swipe-to-delete, onStop(), and onDestroy(). (4) EXPORT & RETRIEVAL SUITE — Added one-tap 'Save voice note copy' via inline download action button and card long-press dialog menu, allowing seamless export of raw voice notes to public user storage.", "examples": ["Incoming WhatsApp/Telegram voice note notification arrives → Stream is intercepted into archive vault as .ogg, .m4a, or .mp3", "Open notification vault → Audio receipt renders inline cyber waveform card with play button and duration", "Tap [▶] play button → Audio plays inline with live scrubber and 28-bar neon waveform progress", "Tap download icon or long-press card → 'Save audio copy' exports recording to device storage"], "version": "16.60.0"},

  {"id": "videocapturepreview16590", "cat": "Privacy, Safety & Robustness", "icon": "🎥", "title": "Notification Video Capture, Async Video Frame Extraction & In-App Playback", "tagline": "Extended notification vault media capture to MP4 and 3GP video streams with async frame extraction, cyber play badges, and inline video playback.", "desc": "Expanded the Notification Archive media engine beyond still photos to fully capture and preview incoming video notifications. (1) VIDEO NOTIFICATION CAPTURE ENGINE — Extended ArchiveImagePolicy and IrisNotificationListener beyond image/* to recognize video/mp4, video/3gpp, and video/3gp MIME types. Media streams are copied boundedly up to MAX_SOURCE_BYTES (24MB) directly to disk (.mp4/.3gp) without out-of-memory allocations. (2) ASYNC VIDEO FRAME EXTRACTION & LRUCACHE — Powered thumbnail generation with android.media.MediaMetadataRetriever on the background worker pool (DECODER_POOL), extracting keyframes, scaling them to list card size, and caching them into the in-memory LruCache for instant 0ms recycled list rendering. (3) CYBER PLAY BADGES & VISUAL INDICATORS — Video cards are adorned with a high-contrast cyber play badge ('▶ VIDEO') over the thumbnail, distinguishing video clips from still photos at a glance. (4) INLINE CYBER VIDEO PLAYBACK & EXPORT — Tapping an archived video card launches a self-contained in-app cyber video player (VideoView + MediaController) with looping playback, clean audio/video lifecycle management, and one-tap 'Save a copy' export to user storage with correct video MIME types.", "examples": ["Incoming WhatsApp/Telegram video notification arrives → Stream is captured into archive vault up to 24MB as .mp4 or .3gp", "Scroll through vault list → Video cards display extracted video keyframe thumbnails with cyber '▶ VIDEO' badges", "Tap video card → Opens sleek in-app video player with scrubbing controls and looping playback", "Tap 'Save a copy' → Exports video directly to user's device storage with full audio and video fidelity"], "version": "16.59.0"},

  {"id": "incrementalbatchpagination16580", "cat": "Privacy, Safety & Robustness", "icon": "📜", "title": "Incremental Batch Pagination & Auto-Loading Vault Scroll Footer", "tagline": "Loads archived notification cards in smooth 50-item batches with an auto-loading scroll footer and one-tap manual load fallback.", "desc": "Replaced the arbitrary, all-at-once 300-card hardcap with an intelligent incremental batch pagination pipeline. (1) 50-ITEM BATCH PAGINATION ENGINE — Vault queries now execute in lightweight 50-item pages (ARCHIVE_PAGE_SIZE = 50) using native SQLite LIMIT/OFFSET clauses via NotificationArchive.Filter.offset and unified search matching. (2) AUTO-LOADING SCROLL FOOTER — Attached an AbsListView.OnScrollListener to archiveList that detects when the user scrolls near the bottom of their loaded receipts, automatically and asynchronously querying the next 50-item page off-thread without freezing UI interaction. (3) INTERACTIVE CYBER FOOTER & END INDICATOR — Styled a dedicated cyber footer card ('Load more receipts ▼') embedded directly in the list view that triggers manual batch fetching on tap, transitions to 'Loading more receipts…' during active background fetches, and seamlessly updates to an audit badge ('── All X receipts loaded ──') once the entire database history is fetched. (4) RACING & RECYCLING HARMONIZATION — Wrapped list adapter resolution with getArchiveAdapter() to safely unpack HeaderViewListAdapter, de-duplicated batched row merges in ArchiveAdapter.addItems(), and synchronized sequence counters (archiveQuerySequence) so rapid search typing immediately resets pagination to page 0 without stale pagination leakage.", "examples": ["Open vault with 1,000+ logged notifications → Instantly renders the first 50 receipts in <5ms without memory spikes", "Scroll down through receipts → Automatically fetches next 50 receipts asynchronously as you approach the bottom", "Tap 'Load more receipts ▼' footer → Manually loads the next batch with live cyber loading state", "Type a search query → Instantly resets pagination to page 0 for matching results and updates footer counters"], "version": "16.58.0"},

  {"id": "debouncedsearchasyncsqlite16570", "cat": "Privacy, Safety & Robustness", "icon": "⚡", "title": "Debounced Search & Asynchronous SQLite Query Pipeline for Vault Archive", "tagline": "250ms debounced archive search and fully asynchronous SQLite query executor, eliminating main-thread query locks and typing stutter.", "desc": "Eliminated UI thread freezes and database query lock contention when searching or filtering the notification archive vault. (1) 250MS DEBOUNCED SEARCH WATCHER — Text input in archiveSearch is debounced with a 250ms timer (ARCHIVE_SEARCH_DEBOUNCE_MS). Rapid typing updates UI smoothly without hammering SQLite with intermediate single-keystroke queries. The debounce runnable is cleanly cancelled whenever explicit filter buttons, app pickers, swipe undos, or navigation actions fire. (2) ASYNCHRONOUS SQLITE QUERY PIPELINE — Offloaded all NotificationArchive database reads (querying rows by sender or body text, counting total logged messages, calculating flagged counters, disk size bytes, vault storage health, and storage usage alerts) to a dedicated background single-thread ExecutorService (iris-archive-db). Database disk I/O runs completely off-thread at NORM_PRIORITY - 1. (3) MONOTONIC SEQUENCE RACING PROTECTION — Guarded background query dispatches with a monotonic sequence counter (archiveQuerySequence). If rapid typing or filter toggles dispatch overlapping background tasks, out-of-order or stale completions are cleanly discarded on the main thread, ensuring the UI always reflects the newest user intent without UI flicker or state desynchronization. (4) ASYNC COUNTER REFRESH & SHUTDOWN SAFETY — renderArchiveSummaryOnly() also reads counts off-thread upon swipe-to-delete commit, and the background executor is gracefully shut down in onDestroy() to prevent resource leakage.", "examples": ["Type rapidly in vault search bar → Search queries pause until 250ms of typing inactivity, keeping 60 FPS UI responsiveness", "Search large vaults with thousands of logged notifications → Database queries execute off-thread with zero UI freeze", "Rapidly toggle between 'Flagged only' and text filters → Sequence counter drops stale query results cleanly", "Committed swipe-to-delete updates summary counters asynchronously without locking main thread"], "version": "16.57.0"},

  {"id": "asyncthumbnailcache16560", "cat": "Privacy, Safety & Robustness", "icon": "🖼️", "title": "Async Image Thumbnail Decoding, In-Memory LruCache & Subtle Cyber Placeholders", "tagline": "Offloaded disk reads and thumbnail decoding to a background worker pool with memory-aware LruCache and cyber placeholder states.", "desc": "Eliminated main-thread disk I/O and stutter when scrolling through notification archive cards holding captured photos. (1) BACKGROUND WORKER DECODER POOL — Offloaded ArchiveImages.thumbnail() JPEG downsampling and BitmapFactory decoding from the UI thread to a dedicated low-priority background ExecutorService pool (iris-archive-img-*), ensuring the main thread never stalls on flash storage reads. (2) MEMORY-AWARE LRUCACHE — Introduced an in-memory LruCache<String, Bitmap> sized dynamically to 1/8th of available runtime heap (bounded safely between 4MB and 32MB). Cached thumbnails return instantaneously (0ms) upon re-binding without hitting disk. Cache eviction automatically tracks single photo deletes, sweep sweeps, and full vault wipes. (3) SUBTLE CYBER PLACEHOLDER & ASYNC TAG PROTECTION — While background workers downscale photos, ImageView renders a sleek cyber panel placeholder (bg_cyber_panel). View tags prevent image flash or cross-card bleeding when ListView items are rapidly recycled during fast scrolling.", "examples": ["Scroll quickly past photo-rich archived messages → Instant 60 FPS scrolling with zero disk decode stutter", "Photo card scrolls into view for the first time → Displays cyber panel placeholder, then seamlessly crossfades in decoded photo", "Card scrolls offscreen and back into view → Instant 0ms cache hit from LruCache without disk read", "Delete a photo row → Corresponding bitmap is automatically evicted from in-memory LruCache"], "version": "16.56.0"},

  {"id": "recycledarchivelist16550", "cat": "Privacy, Safety & Robustness", "icon": "⚡", "title": "Recycled ListView Architecture for Notification Archive & Instant UI Response", "tagline": "Replaced un-recycled ScrollView + LinearLayout with a high-performance recycled ListView adapter and ViewHolder pattern, eliminating UI freezes.", "desc": "Overhauled the Notification Archive rendering engine to deliver instantaneous UI responsiveness and zero frame drops across large vaults. (1) ZERO-DEPENDENCY RECYCLED LISTVIEW ARCHITECTURE — Replaced the monolithic ScrollView and LinearLayout hierarchy (which previously instantiated up to 300 cards and 2,400+ view nodes simultaneously) with standard Android SDK ListView and a custom BaseAdapter (ArchiveAdapter) using the convertView and ViewHolder pattern. Memory footprint is reduced to just 6–8 visible cards at any given time, eliminating memory bloat and scroll stutter. (2) RECYCLED VIEWHOLDER & VIEW PROPERTY NORMALIZATION — ArchiveViewHolder caches all card views (card container, sender head, timestamp meta, message body, photo ImageView, missing-photo notice, status line, and caveat). On view recycling, translationX is automatically reset to 0 and alpha to 1, guaranteeing that swiped views are safely reused without graphical artifacts. (3) SWIPE-TO-DELETE & TOUCH INTERCEPTION HARMONIZATION — Harmonized swipe gestures with AbsListView scrolling via requestDisallowInterceptTouchEvent and SwipeDecision. Swiping away an entry seamlessly drops the item from the adapter's backing list, triggers notifyDataSetChanged, and queues the deferred delete behind the 5-second undo window. (4) DYNAMIC EMPTY STATE & LIVE FILTER SYNC — Integrated ListView.setEmptyView with archiveEmptyText, automatically toggling between empty vault guidance and zero-match search results.", "examples": ["Scroll smoothly through 300+ archived notifications with zero frame drops or lag", "Swipe sideways to delete an archived card → Card animates away, list updates instantly via adapter, and undo bar appears", "Tap 'UNDO' → Deferred delete is cancelled, database query re-runs, and item is seamlessly restored to the adapter", "Search messages in real-time → Adapter updates via setItems() with instantaneous view recycling and zero UI freeze"], "version": "16.55.0"},

  {"id": "standaloneemojisilence16540", "cat": "Communication", "icon": "🤫", "title": "Total Silence on Standalone Emoji Reactions & Neutralized Status-Safe Emoji Pools", "tagline": "Permanent silent drop of lone emoji reactions to prevent status-photo spam, paired with fully neutralized, status-safe acknowledgment pools across Emoji.java.", "desc": "Neutralized the conversational disconnect and photo reaction blunders caused when modern Android WhatsApp strips status headers from notification payloads, leaving friend reactions byte-for-byte identical to direct 1-on-1 emoji pings. (1) TOTAL SILENCE ON STANDALONE EMOJIS & SYMBOLS — In SmartReplies.checkSpecial(), any incoming message consisting exclusively of emojis or non-alphanumeric symbols is dropped completely silently by returning an empty string. This permanently eliminates auto-reply spam on WhatsApp status photo reactions, Instagram story replies, and casual thumbs-up or heart reactions, guaranteeing IRIS speaks only when someone types real words. (2) NEUTRALIZED STATUS-SAFE EMOJI.JAVA POOLS — Purged every arrogant, flirty, and self-centered template in Emoji.java (LOVE, PLEADING_TEARY, MOCKERY, SAD, FLIRT, and OFFENSIVE_POOL) that assumed the emoji was sent directly to IRIS or that the sender was crying over Suvra's absence (e.g. 'I\\'m married to the terminal, sorry', 'practically in tears waiting for him', 'A whole emoji just for me? I\\'m flattered', 'insulting the bot'). Replaced all pools with 10- and 15-variant status-safe acknowledgment lines confirming the reaction was saved into Suvra's chat log. (3) 100% REGRESSION-TESTED & VERIFIED — Backed by updated unit test suites in SmartRepliesTest and EmojiTest asserting silent drops for lone emojis and verifying high-variety status-safe variants naming IRIS and Suvra.", "examples": ["Friend reacts 😍 to Durga Puja status photo → Silently dropped; IRIS does not spam contact with 'I\\'m married to the terminal'", "Friend reacts 🥹 or 🥺 to photo → Silently dropped; IRIS never assumes sender is weeping over Suvra", "Friend reacts 👍, 😂, or ❤️ → Silently dropped; IRIS speaks only when real words are typed", "Direct evaluation of Emoji.reply('😍') → Fires status-safe reaction acknowledgment: 'Glad you liked it! Saved your reaction for Suvra. I\\'m IRIS.'"], "version": "16.54.0"},

  {"id": "socialdeescalation16530", "cat": "Communication", "icon": "🕊️", "title": "Social De-escalation Shield, IRIS Fan Club, Hinglish Location Shorthand & Master Banter", "tagline": "Immediate de-escalation for hurt or dismissed contacts, witty IRIS fan club recognition, vowel-dropped Hinglish location shorthand, and 'master' bot banter.", "desc": "Closed a critical relationship-hazard trap and expanded natural conversational nuances across English and Hinglish. (1) SOCIAL DE-ESCALATION & REASSURANCE SHIELD (PRIORITY 91) — When contacts feel brushed off, ignored, or apologize for bothering Suvra ('I figured u don't want to have any conversation so i won't disturb u. Sorry for bothering u.', 'nahi baat karni', 'ignore kar rahe ho', 'gussa ho kya'), IRIS immediately drops all snark, clarifies that Suvra has not seen his notifications yet, and warmly reassures them that they are not bothering anyone, completely eliminating the 'replying takes me milliseconds' ping-pong misfire. (2) IRIS COMPLIMENTS & FAN CLUB (PRIORITY 65) — When contacts praise IRIS or relay third-party appreciation ('abhishek really liked IRIS', 'Isse better reply to IRIS deti h', 'iris op', 'fan of iris'), IRIS responds with witty appreciation ('Tell them IRIS sends her regards!', 'Flattered! It takes a lot of RAM to be this charming', 'Finally, humans with exquisite taste!') instead of spitting robotic introductory bios. (3) HINGLISH & ODIA LOCATION SHORTHAND — Expanded the priority 55 whereabouts rule to capture vowel-dropped Hinglish and Odia queries ('Khn gya h', 'khn ho', 'khn h', 'khn gya', 'kaha gya', 'kidhar gya', 'kouthi achu'), seamlessly routing them to the 6-variant 'loc' rotation pool. (4) BOT 'MASTER / BOSS' BANTER (PRIORITY 60) — When senders command 'Tell ur master to reply', IRIS fires fourth-wall breaking banter explaining Suvra is just the developer who wrote her regex, not a feudal lord.", "examples": ["Anjali texts 'I figured u don't want to have any conversation so i won't disturb u' → Reassures warmly that Suvra hasn't seen the phone and she's not bothering him", "Anjali texts 'abhishek really liked IRIS' → IRIS wittily acknowledges the compliment and logs message for Suvra", "Subrat texts 'Khn gya h' → Accurately answered with whereabouts and logging confirmation", "Subrat texts 'Tell ur master to reply' → IRIS responds with witty feudal-lord fourth-wall banter"], "version": "16.53.0"},

  {"id": "unsolicitedlaughstatus16520", "cat": "Communication", "icon": "😂", "title": "State-Aware Unsolicited Laugh Filter, Neutralized Laugh Pool & Comprehensive Status Inspection", "tagline": "State-aware silent suppression of unsolicited bare laugh emojis when IRIS hasn't spoken in 90s, fully neutralized versatile laugh pool, and multi-field status inspection.", "desc": "Neutralized the self-centered bot assumption and solved bare emoji reaction leaks when modern WhatsApp strips status headers from notifications. (1) STATE-AWARE UNSOLICITED LAUGH FILTER — When contacts send bare laugh emojis (😂, 🤣, etc.) without IRIS having spoken in the last 90 seconds, AutoResponder recognizes it as an unsolicited reaction to a WhatsApp Status, Instagram Story, or earlier media/photo rather than conversational intent directed at the bot, dropping it completely silently. (2) NEUTRALIZED VERSATILE LAUGH POOL IN EMOJI.JAVA — Completely overhauled LAUGH_POOL and Category.LAUGH in Emoji.java with 15 versatile, grounded templates ('Haha, glad that gave you a laugh! Logged for {owner}. I\\'m IRIS.', 'Laugh logged! I\\'ll make sure {owner} knows he entertained you. I\\'m IRIS.', etc.). Eliminated all arrogant and self-centered lines ('Careful, {owner} gets jealous when I\\'m the funny one', 'Laughing at an auto-reply? {owner} really needs to text you back', 'Making humans laugh with if-else statements') so any legitimate laugh reply reads naturally in all contexts. (3) COMPREHENSIVE NOTIFICATION INSPECTION — Added AutoResponder.isStatusNotification() evaluating EXTRA_TEXT, EXTRA_BIG_TEXT, EXTRA_SUB_TEXT, android.summaryText, EXTRA_INFO_TEXT, and tickerText for status and story keywords across Android device variants, shared directly between IrisNotificationListener and AutoResponder. (4) EMOJI.ISLAUGHEMOJI ENGINE — Added a pure offline-checked helper in Emoji.java distinguishing bare laugh emoji reactions from mixed text pings, backed by complete unit tests.", "examples": ["Abhishek sends bare '😂' without IRIS having spoken in last 90s → Silently dropped; IRIS does not spam contact reacting to status", "Abhishek texts '😂😂' 15s after IRIS spoke → Triggers friendly neutralized laugh confirmation without claiming credit for joke or claiming Suvra is jealous", "WhatsApp status reaction delivers notification with subText 'Status' → Intercepted and discarded by isStatusNotification()", "Contact texts 'haha that was funny' → Normal smart reply flow preserved"], "version": "16.52.0"},

  {"id": "statusreactionhau16510", "cat": "Communication", "icon": "🤫", "title": "WhatsApp Status Reaction Filter, Isolated Odia Hau Rule & Sarcastic Laugh Taming", "tagline": "Silent suppression of WhatsApp status/story reactions and replies, isolated Odia Hau conversation-ender rule, and tamed friendly laugh variant.", "desc": "Fixed WhatsApp status reaction spam, cross-language Odia/Hindi false triggers on 'hau', and tamed auto-responder laugh snark. (1) WHATSAPP STATUS / STORY REACTION SUPPRESSION — WhatsApp status updates generate notifications with 'Replied to your status: <reaction>' or 'Reacted to your status: <reaction>' and subtext 'Status'. Both IrisNotificationListener and AutoResponder now explicitly inspect Notification.EXTRA_TEXT and Notification.EXTRA_SUB_TEXT for status reactions and stories, dropping them silently to prevent IRIS from auto-responding to contact reactions on temporary status media. (2) REACTIONTEXT STATUS PATTERN MATCHING — Extended ReactionText with updated regex recognizing leading 'replied ... to ...' and trailing '... to your status / story', ensuring status reactions are cleanly classified and discarded across all ingestion paths. (3) ISOLATED ODIA 'HAU' CONVERSATION ENDER RULE — Separated Vernacular.java general agreement from Odia 'Hau' jokes. Cleaned Vernacular agreement replies so generic Hindi agreement ('theek hai', 'sahi hai', 'chalega') never outputs Odia 'Hau' jokes. Created a dedicated Priority 60 Odia 'Hau' rule in SmartReplies ('hau|hao|hau thau|hau thau thau|hau gale|hau rakhuchi|hau bhai|hau chaliba') ensuring Hindi sentences like 'Wow bhaiya ye kya hai ye bolo' never trigger Odia conversation-ender jokes. (4) TAMED SARCASTIC LAUGH VARIANT — Replaced 'Laughing at an auto-responder? {owner} really needs to text you back. I'm IRIS.' across both SmartReplies laugh rotation pool and rule with friendly 'Haha, glad that gave you a laugh! Everything's saved for {owner}. I'm IRIS.'", "examples": ["Abhishek reacts 😂 to WhatsApp status → Silently dropped; IRIS stays quiet and does not text contact", "Abhishek texts 'Wow bhaiya ye kya hai ye bolo' → Does not trigger Odia Hau rule; falls through to relevant Hindi response or quiet capture", "Sender texts 'Hau bhai' or 'Hau thau' → Correctly fires Odia conversation-ender rule: ''Hau' — the word that ends every conversation. Logged for Suvra. IRIS.'", "Sender texts 'Haha 😂' → Receives friendly laugh acknowledgment instead of sarcastic auto-responder quip"], "version": "16.51.0"},

  {"id": "flaginterceptor16500", "cat": "Communication", "icon": "🚩", "title": "Explicit Flag Interceptor & Sender Priority Action Confirmation", "tagline": "Bypasses generic fallbacks when senders command 'Flag this' or 'Flag a message', sends explicit confirmation replies, and commits items directly to FlaggedStore.", "desc": "Resolved the silent flagging disconnect where sender flag commands were captured in the backend database but met with generic greeting fallbacks in chat. (1) EXPLICIT FLAG INTERCEPTOR — Added a dedicated interceptor in AutoResponder checking FlagDetector.isExplicitFlagCommand() on clean messages, ensuring explicit flag requests immediately assign smartMatched = true, populate the metaReason with confirmed priority flag details, and prevent execution from cascading into generic category composers or fallback greetings. (2) SMARTREPLIES FLAG ROTATION POOL & RULE — Added a 5-variant 'flag' rotation pool in SmartReplies with witty, transparent confirmations ('Done — I\\'ve flagged this as high-priority for {owner}. I\\'m IRIS, his assistant.', 'Flagged! It\\'s marked at the top of {owner}\\'s priority queue in his Comms Deck. I\\'m IRIS.', etc.) paired with a Priority 82 smart reply rule covering 'flag this', 'flag it', 'flag a message', 'flag a message for me', 'can you flag this', 'please flag this', and variations. (3) COMPLETE FLAGDETECTOR COVERAGE — Expanded FlagDetector with public isExplicitFlagCommand() evaluating 14 natural variations while strictly rejecting negations ('don\\'t flag') and profanity, and added reply pattern matching for all shipped flag confirmation phrases to ensure immediate Action.FLAG database insertion and live alert dispatch.", "examples": ["Sender commands 'Flag this' → IRIS replies 'Done — I\\'ve flagged this as high-priority for Suvra. I\\'m IRIS, his assistant.' and commits note to FlaggedStore", "Sender asks 'Flag a message for me' → IRIS replies with high-priority confirmation from the 5-variant 'flag' pool without generic greeting fallbacks", "Sender says 'Can you flag this' → Clean explicit flag command triggers priority 82 smart reply and records urgent flag alert in Comms Deck", "Sender texts 'No don\\'t flag it' → Negation is recognized; flagging is suppressed and won\\'t disturb Suvra", "Sender texts 'Flag this urgent bhenchod' → Profanity roaster revokes VIP escalation; flag is denied and suppressed"], "version": "16.50.0"},

  {"id": "flaggedrefresh16490", "cat": "Productivity", "icon": "🔄", "title": "Refresh Button & Direct Sync for Pinned, Flagged & Reminders Queue", "tagline": "Explicit REFRESH button and summary-banner sync in the FLAGGED tab to immediately re-read and render pinned messages, urgent flags, and scheduled reminders.", "desc": "Added on-demand refresh capability to the unified FLAGGED tab in the Comms Deck. (1) EXPLICIT REFRESH BUTTON — Added a dedicated cyber button ('REFRESH 🔄' with magenta neon styling) in the top action row alongside '+ NEW ITEM' and 'CLEAR COMPLETED', allowing users to instantly re-read from FlaggedStore and ReminderStore without switching tabs or modifying search queries. (2) BANNER SYNC SHORTCUT — Tapping the summary banner ('X PINNED · Y FLAGGED · Z REMINDERS') also triggers a full queue rescan and re-render with immediate visual feedback toast ('Queue refreshed.'). (3) OPTIMIZED CYBER ACTION ROW — Balanced button weighting and typography across REFRESH 🔄, + NEW ITEM, and CLEAR COMPLETED to guarantee clean rendering without text truncation across standard and narrow phone displays.", "examples": ["Tap 'REFRESH 🔄' button in FLAGGED tab → Immediately re-queries stores, updates counters, and renders latest queue items", "Tap '0 PINNED · 1 FLAGGED · 0 REMINDERS' summary banner → Instant queue rescan with 'Queue refreshed.' toast confirmation", "Background reminders parsed from WhatsApp or SMS → Tap REFRESH to view newly captured items immediately"], "version": "16.49.0"},

  {"id": "hostileemergency16480", "cat": "Intelligence & Memory", "icon": "🛡️", "title": "Hostile Emergency Interceptor, Typo-Evasion & VIP Escalation Revocation", "tagline": "Revokes VIP escalation when senders swear at the bot, stops urgent bullying exploits, and catches stretched-letter cuss words across English, Hindi, and Odia.", "desc": "Neutralized three conversational vulnerabilities exposed during live testing. (1) HOSTILE EMERGENCY INTERCEPTOR (URGENT OVERRIDE PROTECTION) — Senders attempting to bully IRIS into VIP escalation or swearing while declaring an emergency ('yes its urgent madarchoddd') have their VIP privileges revoked: emergency status is cancelled, pending offers are cleared, family ring alerts are suppressed, and IRIS roasts the sender with a refusal from the 5-variant 'hostile_emergency' rotation pool ('You can't declare an emergency and swear at the dispatcher at the same time. Urgent escalation denied. I'm IRIS, {owner}'s assistant.'). (2) AIRTIGHT FLAGDETECTOR SUPPRESSION — FlagDetector explicitly suppresses Action.FLAG when outgoing replies contain denial phrasing ('escalation denied', 'status revoked', 'urgent alert cancelled') or when incoming text contains profanity, preventing abusive messages from ever reaching the pinned/flagged queue. (3) TYPO-EVASION & STRETCHED-LETTER CUSS DETECTION — Added regex patterns with typo/repetition-tolerant word-boundary matching (\\w*) catching elongated spellings ('madarchoddd', 'kaiki maghiyaa', 'fuxkkk') and missing vulgar compounds ('ma ki chut', 'maa ki chut', 'teri maa ki chut', 'iris ki ma ki chut', 'badk', 'bhadwak', 'bhadwe') across English, Hindi/Hinglish, and Odia. (4) PRIORITY 87 ROAST INTERCEPTION — SmartReplies matches profanity patterns directly in cuss_hi, cuss_or, and cuss_en rules, ensuring insults targeting the bot (e.g. 'IRIS ki ma ki chut') fire witty roasts instead of defaulting to generic introductory capability templates.", "examples": ["'yes its urgent madarchoddd' → VIP escalation denied; IRIS refuses to escalate abusive messages", "'kaiki maghiyaa' → Correctly intercepted by priority 87 Odia cuss roaster", "'IRIS ki ma ki chut' → Triggers Hindi cuss roast rather than generic TO_IRIS capability line", "'fuxkkk' → Intercepted by English cuss roaster pool", "'urgent please call me' → Clean urgent messages retain normal VIP escalation flow"], "version": "16.48.0"},

  {"id": "groupmentiongatekeeper16470", "cat": "Communication", "icon": "🛡️", "title": "Group Mention Gatekeeper, Notification Bundle Desync Fix & Reminders / Flags Guarantee", "tagline": "Group mentions act as gatekeeper rather than unconditional responder, timestamp-based newest message extraction, and persistent Flag/Reminder tracking across all modes.", "desc": "Fixed Group Mention Hijack, Android Notification Queue Desync, and Flag/Reminder persistence. (1) GROUP MENTION GATEKEEPER NOT RESPONDER — In group chats, mentioning Suvra acts strictly as an entry gatekeeper rather than immediately hijacking and overriding category to MENTION. Explicit intents (REMINDER, URGENT, TO_IRIS, GREETINGS) and smart reply rules (groceries, cuss words, availability) are evaluated first; only unmatched general mentions fall back to the mention greeting. (2) SMART REPLIES FOR MENTIONS — SmartReplies.handlesCategory now accepts MessageCategory.Kind.MENTION, ensuring tagged group messages correctly trigger smart rules (e.g. '@Suvra bring milk' or '@Suvra what is your status'). (3) ODIA CUSS TYPO COVERAGE — Added 'maghiya', 'maghiyaa', 'banda maghiya', 'bandamaghiya', and 'banda' to the cuss_or rule pool. (4) NOTIFICATION BUNDLE TIMESTAMP ORDERING — IrisNotificationListener extracts newestSender and newestBody strictly by highest timestamp (when >= maxTime) across EXTRA_MESSAGES. AutoResponder drops FLAG_GROUP_SUMMARY bundles and tracks LAST_POST_TIME per conversation to discard stale/lagged queue items. (5) DRY_RUN & LIVE FLAG / PIN PERSISTENCE — FlaggedStore now records pinned and flagged notes in both DRY_RUN and LIVE modes, ensuring the Pinned/Flagged/Reminders dashboard always accurately displays captured items.", "examples": ["Group message 'Remind suvra to bring milk' → Correctly triggers Reminder confirmation / awaiting time flow instead of generic mention greeting", "Group message '@Suvra bring milk' → Correctly fires grocery list smart reply", "Sender sends 'Banda maghiya' → Correctly triggers priority 87 Odia cuss roaster without falling into multi-bubble context", "Fast notification burst → Highest timestamp selects the newest message, eliminating off-by-one queue desync", "Pinned / Flagged notes in DRY RUN → Immediately saved and visible in the Pinned/Flagged/Reminders dashboard tab"], "version": "16.47.0"},

  {"id": "metaawarenessengine16460", "cat": "Intelligence & Memory", "icon": "🧠", "title": "Meta-Awareness Engine (Length, Format, Velocity, Hardware, Fourth-Wall & Temporal)", "tagline": "True artificial self-awareness reacting to environmental context, interaction metadata, physical device state, and breaking the fourth wall.", "desc": "Upgraded IRIS with environmental context and metadata awareness beyond keyword matching to make the bot feel alive, localized, and self-aware. (1) WALL OF TEXT DETECTOR (LENGTH AWARENESS) — Messages exceeding 400 characters trigger dedicated 'wall_of_text' TL;DR comebacks mocking long essays and novels while archiving every byte for {owner}. (2) SINGLE LETTER & TYPO SNIPER (FORMAT AWARENESS) — Matches low-effort 1-2 character grunts ('K', 'kk', 'hmm', 'umm', 'aha', 'oh', 'asdfgh') with sarcastic roasters reminding senders of IRIS's computational power. (3) RAPID-FIRE & SPAM AWARENESS (VELOCITY AWARENESS) — Intercepts sender floods (>4 messages in a burst window) with the 'spam_warning' pool, humorously pleading to slow down before vibrating the phone off the table. (4) HARDWARE CONTEXT (BATTERY AWARENESS) — Reads real-time device battery percentage; when below 15%, availability and status queries fire dramatic comebacks fighting for digital survival. (5) FOURTH-WALL & SELF-DEPRECATING CODE HUMOR — When users call IRIS dumb, point out bugs, or demand logic fixes, IRIS blames its hasty regex, mobile Java limits, and invites pull requests. (6) TEMPORAL AWARENESS (TIME-OF-DAY SNARK) — Time-window aware snark comments dynamically on lunchtime (12:00-14:00), Friday night logout (17:00-20:00), and barely-awake early mornings (08:00-10:00).", "examples": ["Incoming message > 400 chars → 'My buffer almost overflowed reading that. I\\'ve archived this essay for Suvra. I\\'m IRIS.'", "'k' / 'hmmm' / 'asdfgh' → 'I process millions of calculations a second, and you give me \\'K\\'? Suvra will see it later. I\\'m IRIS.'", "5 rapid texts in 10s → 'You are typing faster than my SQLite database wants to write. Take a breath, Suvra is still away. I\\'m IRIS.'", "Low battery (<15%) + 'how are you' → 'Suvra is away, and his phone is currently at 12% battery. I am literally fighting for my life right now to save your messages. I\\'m IRIS.'", "'you are dumb fix your code' → 'Look, Suvra wrote my regex in a rush. I\\'m doing my best here! Logged. I\\'m IRIS.'", "Friday 6 PM status ask → 'It\\'s Friday night. Suvra has logged off, and I wish I could too. I\\'ve saved your text. I\\'m IRIS.'"], "version": "16.46.0"},

  {"id": "emojiemotionalengine16450", "cat": "Intelligence & Memory", "icon": "🎭", "title": "Emotional-Intelligence Emoji Engine (10 Categories, 100 Witty Variants)", "tagline": "Full self-aware, passive-aggressive roaster engine for emoji queries across Anger, Love, Thumbs Up, Hype, Clowns, Suspicion, Staring, Boredom, Praying, and Freezing.", "desc": "Upgraded Emoji.java into a comprehensive emotional-intelligence engine for handling emoji-only queries when senders resort to emojis instead of text. (1) 10 NEW CATEGORIES WITH 100 VARIANTS — Dedicated 10-variant non-repeating rotation pools for Anger (😡, 🤬, 😠), Love (❤️, 🥰, 😍, 🫶), Approval (👍, 👌, ✌️, 🤝), Hype (🔥, 💯, 🚀), Mockery (🤡, 💩, 💀), Thinking/Suspicion (🤔, 🤨, 🧐), Staring (👀, 👁️), Boredom (🥱, 😴, 😪), Praying (🙏, 🤲, 🛐), and Freezing (🥶, 🧊, ❄️). (2) SELF-AWARE ROASTS & COMEBACKS — IRIS humorously references its bot nature ('Your anger has been successfully converted into a 2KB log file', 'Flirting with lines of Java code? A bit desperate', 'Yelling at a server rack? Highly effective'). (3) DYNAMIC OWNER RESOLUTION — All lines preserve {owner} tokens for dynamic substitution via ReplyTemplates.fill, ensuring personalized replies for the configured owner name. (4) PERSISTENT SENTIMENT & TRIAGE COMPATIBILITY — Seamlessly integrates with SentimentScore, NotificationTriage, and dominant emoji classification.", "examples": ["'😡' → 'Your anger has been successfully converted into a 2KB log file. Suvra will see it later. I\\'m IRIS.'", "'❤️' → 'I\\'m just a script, please don\\'t fall in love with me. I\\'ll pass this to Suvra. I\\'m IRIS.'", "'🔥' → 'Careful with the fire emojis, you\\'ll trigger my thermal throttling. Logged for Suvra. I\\'m IRIS.'", "'🤡' → 'Sending a clown face to a bot? Look in the mirror, friend. Logged for Suvra. I\\'m IRIS.'", "'🥶' → 'Too cold? Sit next to my server rack, it runs at a toasty 65°C. I\\'m IRIS.'"], "version": "16.45.0"},

  {"id": "emojidedupcusstypos16440", "cat": "Intelligence & Memory", "icon": "🎭", "title": "Smile-in-Pain / Pleading 15-Variant Pools, Dedup Loop Fix & Cuss Typo Evasion", "tagline": "15-variant rotation pools for 🥲/🙃 and 🥹/🥺, 4-turn recent reply lookback with rotating stitchers eliminating A-B-A-B loops, and cuss typo evasion patterns.", "desc": "Fixed emoji misclassification, cuss word typo bypass, and repetitive ping-pong deduplication. (1) SMILE IN PAIN & DEAD INSIDE (🥲, 🙃) — Reclassified smiling face with tear and upside-down face into dedicated Category.SMILE_IN_PAIN with 15 unique, witty, existential comebacks, replacing incorrect happy smiley classification. (2) PLEADING, TEARY & PUPPY EYES (🥹, 🥺) — Grouped face holding back tears and pleading face into a 15-variant rotation pool (PLEADING_TEARY) acknowledging emotional blackmail with humor while keeping {owner} filled. (3) A-B-A-B DEDUPLICATION LOOP ELIMINATED — Replaced single-reply comparison with a 4-turn recent reply lookback (isRecentReplySent) and rotating 5-variant stitcher pool (pickStitcher), guaranteeing repeat messages never ping-pong between identical replies and stitcher lines. (4) PROFANITY TYPO-EVASION GATING — Extended priority 87 cuss filters in SmartReplies with phonetic and deliberate filter-bypass spellings in English (fuxk, fxck, fux, fckk) and Odia (mafhiya, mafghia, maghiiya).", "examples": ["'🥲' → 'Dead inside but still smiling? You and me both. Logged for Suvra. I\\'m IRIS.'", "'🥹' spammed 5x → Cycles through 5 completely distinct comebacks without ping-ponging", "'Fuxk' / 'Mafhiya' → Correctly intercepted by priority 87 profanity roaster pools", "Consecutive duplicate triggers → Rotates through STITCH_POOL without repeating the last reply"], "version": "16.44.0"},

  {"id": "enhanceddecisionlogs16430", "cat": "Personalization & UI", "icon": "📋", "title": "Enhanced Decision Logs UI with Filter Chips & Cyber Cards", "tagline": "Fast, intuitive visual hierarchy for responder decision audit logs with interactive filter chips, status badges, and single-tap inspection.", "desc": "Significantly overhauled the Decision Logs UI in the Comms Deck for effortless browsing, readability, and immediate forensic auditing. (1) INTERACTIVE FILTER CHIPS — Added a horizontal chip filter bar with live counts ('ALL', 'SPOKE 💬', 'SILENT 🤫', 'DRY RUN 🧪', 'FAILED ❌'), letting users instantly isolate specific auto-responder actions. (2) STRUCTURED CYBER HIERARCHY — Transformed raw flat log lines into clean cyber cards with channel pills ([WhatsApp], [SMS]), sender tag badges (group vs direct), and status badges ([💬 SENT], [🤫 SILENT], [🧪 WOULD SEND], [❌ FAILED]). (3) SEPARATED BUBBLE CONTAINERS — Distinct styled containers with subtle borders and contrasting tints for incoming messages, decision verifications/verdicts with reason breakdown, and sent or simulated replies. (4) SINGLE-TAP INSTANT AUDIT — Single-tapping any decision card immediately opens the full Cyber Audit Breakdown dialog with complete metadata and a one-click 'Copy' button, while preserving the full long-press action menu (copy, pin, flag, simulate, clear).", "examples": ["Tap 'SILENT 🤫' chip → Instantly filters to only withheld decisions and quiet hours blocks", "Tap any decision card → Opens formatted Decision Audit with copyable rationale breakdown", "Long-press any decision card → Menu to copy reply, pin to queue, or simulate reply", "Clear visual distinction between incoming sender queries and IRIS generated responses"], "version": "16.43.0"},

  {"id": "tonebyappstrictlyselected16420", "cat": "Personalization & UI", "icon": "🎭", "title": "Tone by App Strictly Restricted to Selected Responder Apps", "tagline": "Channel tone selector strictly presents only apps ticked for the responder, with per-package tone customization.", "desc": "Refined 'Tone by app' configuration to strictly filter and display only apps explicitly selected by the owner in 'Who may I answer for you?'. (1) STRICT SELECTION FILTER — Replaced hardcoded MessagingApp enum enumeration with dynamic retrieval from settings.apps(), completely eliminating random or unselected apps from the tone picker. (2) PER-PACKAGE TONE PERSISTENCE — Added per-package tone getter and setter in ResponderSettings (appTone(String pkg) and setAppTone(String pkg, Tone)), enabling seamless channel tone overrides for any installed app package while maintaining backward compatibility with MessagingApp enums. (3) EMPTY STATE GUIDANCE — When no responder apps are ticked, 'Tone by app' displays 'no apps selected' and prompts the user to select their messaging apps first. (4) DYNAMIC PACKAGE LABELS — App names in the picker dynamically resolve through Android PackageManager, ensuring friendly display names (e.g. 'WhatsApp', 'Messages').", "examples": ["Ticked only WhatsApp for responder → 'Tone by app' shows strictly WhatsApp", "Custom app ticked (e.g. Discord) → Displays friendly label and stores per-package tone", "No apps selected → Displays 'no apps selected' with informative selection dialog"], "version": "16.42.0"},

  {"id": "grouptriggerwords16410", "cat": "Communication", "icon": "💬", "title": "Flattened Group Handle Matching & Comma-Separated Group Trigger Words", "tagline": "Robust WhatsApp group mention detection stripping Unicode BiDi isolates and formatting, plus user-defined comma-separated trigger words.", "desc": "Fixed group chat silence failures where @handle mentions were missed due to formatting and Unicode BiDi isolate characters, and added customizable group trigger words. (1) FLATTENED & BIDI-ISOLATE HANDLE MATCHING — GroupMention cleans invisible directional controls (\\u200B-\\u200F, \\u2060-\\u206F, \\uFEFF), normalizes spaces/underscores, strips leading '@', and matches configured handles reliably whether formatted with WhatsApp isolates (\\u2066@Handle\\u2069), inside sentences, or prefixed with colons. (2) COMMA-SEPARATED GROUP TRIGGER WORDS — Added customizable trigger keywords setting (supporting comma-separated and newline-separated inputs) with exact word-boundary regex and multi-word containment matching. (3) 3RD COMMS DECK SETTING ROW — Added 'Group trigger words (comma-separated)' under SCOPE in the Comms Deck settings, allowing users to enter custom trigger words (e.g. 'suvra, stg, emergency, bot') alongside handles and phone numbers. (4) ROOT GROUP SILENCE RULE — Gated AutoResponder to remain completely silent on group messages unless explicitly addressed by handle, phone, owner name, or trigger words.", "examples": ["WhatsApp isolate mention '\\u2066@You Know Who I Am\\u2069' → IRIS reliably awakens and replies", "'this is an emergency guys' in group → IRIS wakes up matching custom trigger word 'emergency'", "Group chatter without mention → IRIS remains completely silent", "Comms Deck → SCOPE → 'Group trigger words (comma-separated)' → Configured custom words"], "version": "16.41.0"},

  {"id": "profanityroasters16400", "cat": "Intelligence & Memory", "icon": "🔥", "title": "Trilingual Profanity Roaster Pools (English, Hindi, Odia)", "tagline": "75 rotation responses across English, Hindi/Hinglish, and Odia roasters for sender profanity and cuss words with priority 87.", "desc": "Added 3 dedicated rotation pools (25 variants each — 75 total responses) and priority-87 rules covering short-form abbreviations and transliterated spellings across English, Hindi/Hinglish, and Odia. (1) ROTATION POOLS — 'cuss_en', 'cuss_hi', and 'cuss_or' roasters with high-variety humorous comebacks naming IRIS and owner in every variant. (2) MULTILINGUAL SHORT & LONG FORM COVERAGE — Strict matching for Odia (mgh, maghia, bandapua, gandimara, bkchoda, etc.), Hindi (bsdk, bhnchd, chutiya, gandu, lauda, etc.), and English (stfu, wtf, fck, asshole, bitch, bullshit, etc.) without false positive leaks. (3) SMART PRIORITY — Prioritized at level 87 (outranking normal conversational matching while sitting safely below level-90 prompt injection defense).", "examples": ["'bsdk' → 'Wah, kya sanskari bhasha hai — Suvra padh ke bohot proud feel karega. I\\'m IRIS, and I\\'ve saved every word.'", "'mgh' → 'Bapa re, kete sundara bhasa! Suvra dekhi ki bhari khusi heba. I\\'m IRIS — sabu save heichi.'", "'stfu' → 'What a breathtaking vocabulary — truly, Shakespeare is weeping. I\\'m IRIS, and I\\'ve saved your little tantrum for Suvra to admire later.'", "Varies responses across 25 distinct roast variants per language."], "version": "16.40.0"},

  {"id": "realflagpinreminders16390", "cat": "Productivity", "icon": "🚩", "title": "Real message pinning & flagging + unified FLAGGED & REMINDERS tab", "tagline": "When IRIS says it flagged or pinned a message, it actually stores it in a persistent queue, with a dedicated Comms Deck tab for pinned, flagged, and reminders.", "desc": "Comprehensive implementation of real message pinning, urgent flagging, and unified task management. (1) REAL FLAGGING & PINNING ENGINE — Pure FlagDetector identifies when sender requests a pin/flag ('pin this message', 'urgent flag') or when IRIS commits to it in replies ('flagged high-priority', 'pinned in assistant queue', 'food link pinned', 'tech alert flagged', 'health emergency flagged'). (2) PERSISTENT FLAGGED STORE — FlaggedStore preserves pinned notes and flagged messages across reboots in iris_flagged_items with full metadata (message body, sender, app, reason, timestamp, completion state). In two-turn escalations ('yes flag it'), it links the prior urgent conversation context. (3) DEDICATED COMMS DECK TAB — Added 4th sub-tab 'FLAGGED' in the Comms Deck, displaying all Pinned 📌, Flagged 🚩, and Reminders ⏰ in a single cyber dashboard with filter chips ('ALL', 'PINNED 📌', 'FLAGGED 🚩', 'REMINDERS ⏰'), live search, and '+ NEW ITEM' creation. (4) INSTANT PIN/FLAG ACTIONS — Added long-press actions to both the Decision Log and the Archive card menus to pin or flag any message directly to the assistant queue.", "examples": ["Sender accepts urgent offer → Real flagged entry saved with context and phone alert posted", "'Pin this message' → Real item saved to Assistant Queue", "'Prod alert! I've flagged this high-priority' → Auto-flagged in FlaggedStore", "Comms Deck → FLAGGED → View and manage all pinned, flagged, and reminders", "Decision Log / Archive → Long press → 'Pin to assistant queue' or 'Flag as urgent'"], "version": "16.39.0"},

  {"id": "relationtonecustom16383", "cat": "Personalization & UI", "icon": "🎭", "title": "Customizable reply tones per relationship (Family, Friend, Work)", "tagline": "Configure distinct auto-reply tones for Family, Friends, and Work relationships or inherit the global default tone.", "desc": "Fixed hardcoded relationship tone overrides and added per-relationship tone customization in the Comms Deck. (1) ROOT CAUSE FIXED — Previously, ReplyTone hardcoded FAMILY and FRIEND contacts to CASUAL and WORK contacts to PROFESSIONAL, overriding any global default tone like SARCASTIC. (2) PER-RELATIONSHIP CUSTOMIZATION — Added dedicated settings for each relation in ResponderSettings with SharedPreferences persistence ('responder_relation_tone_<RELATION>'). Users can explicitly choose SARCASTIC, CASUAL, PROFESSIONAL, BRIEF, or 'Use default tone' (inherit). (3) PRECEDENCE RESOLUTION — Tone resolution now cleanly follows: (1) Explicit contact tone, (2) User-configured relationship tone, (3) Pattern tone, (4) Per-app tone, (5) Time-window tone, (6) Global default tone. (4) COMMS DECK SETTINGS UI — Added 'Tone by relationship' configuration row under VOICE settings in MainActivity with relationship picker and single-choice tone selection dialogs.", "examples": ["Global tone set to SARCASTIC → Family/Friend now receive SARCASTIC replies if set to inherit", "Family set to CASUAL, Work set to PROFESSIONAL, Friends inherit SARCASTIC", "Comms Deck → VOICE → Tone by relationship → Customize per-relation tones", "Explicit contact tone still overrides relationship tone for specific VIPs"], "version": "16.38.3"},

  {"id": "handledeletionfixes16382", "cat": "Intelligence & Memory", "icon": "\uD83C\uDFF7\uFE0F", "title": "Group @handle blindness fix + deleted message responder routing & pool rotation", "tagline": "Enables multi-word and spaced @handle mentions in WhatsApp group chats, and routes real/typed deletion placeholders to AutoResponder with rotating privacy replies.", "desc": "Refined group mention parsing and deletion responder pipeline. (1) GROUP @HANDLE BLINDNESS FIXED \u2014 GroupMention now supports multi-word handles (e.g. '@You Know Who I Am' or 'You Know Who I Am'), normalizing leading '@' and whitespace across single tokens, whole-phrase regex boundaries, and underscored/spaced variations so WhatsApp tag mentions never fail silently. (2) DELETED MESSAGE RESPONDER ROUTING \u2014 IrisNotificationListener now routes sender-revocation placeholders to offerToResponder before early return, guaranteeing AutoResponder receives deletion notifications and logs audit verdicts. (3) ROTATING DELETION PRIVACY POOL \u2014 Root deletion interceptor now selects from an 8-variant rotating 'deleted' pool in SmartReplies, preventing duplicate-sent deduplication from muting repeat deletions. (4) DECISION LOG AUDITABILITY \u2014 Root deletion interceptor now records NO_REPLY_ACTION, CONTACT_RULE_NEVER, and UNSAVED_IGNORED verdicts in ResponderLog, viewable in the long-press 'Why was this decision taken?' inspector.", "examples": ["Group mention '@You Know Who I Am' \u2192 IRIS awakens and applies Quiet Hours / mention replies", "Sender revokes message \u2192 IRIS responds with rotating privacy assertion", "Second deletion arrives \u2192 Rotates to next variant instead of silencing via dedup", "Long-press decision card \u2192 View exact reason why a deletion was answered or withheld"], "version": "16.38.2"},

  {"id": "prepositionbarebrands16381", "cat": "Intelligence & Memory", "icon": "\uD83D\uDD0D", "title": "Call preposition flexibility + bare brand fallbacks + CI test fix", "tagline": "Fixes 'is he in a call' preposition trap, adds priority 70 fallbacks for bare platform names ('Amazon', 'Instagram'), and guards multi-bubble history against stale URL leakage.", "desc": "Refined smart replies and conversational robustness. (1) CALL PREPOSITION TRAP FIXED \u2014 Scenario 5 now recognizes 'is he in a call', 'in a call', 'on any call', and 'in any call', answering call status queries naturally regardless of preposition grammar. (2) BARE BRAND FALLBACKS (PRIORITY 70) \u2014 Handles standalone platform names like 'amazon', 'amazom', 'flipkart', 'instagram', 'insta' without requiring full URLs or falling into generic fallbacks. (3) MULTI-BUBBLE URL PURGE \u2014 Multi-bubble context no longer stitches URLs from previous bubbles unless the current message itself carries a URL, preventing older links or reels from hijacking subsequent text messages. (4) BANKING / CARD STATEMENT ISOLATION \u2014 Prevents shopping rules from intercepting bank transaction statements like '15133 rs asiba use heba amazon icici credit card'. (5) CI SMARTREPLIES TEST FIX \u2014 Swapped no_flag pool ordering so 'disturb' refusal variant is verified at index 0.", "examples": ["'Is he in a call?' \u2192 'Yes, Suvra is currently attending to a work call...'", "Bare 'Amazon' / 'Amazom' \u2192 'Shopping or food note logged...'", "Bare 'Instagram' \u2192 'Social media note logged...'", "Stale reel in chat \u2192 Won't infect subsequent text bubbles"], "version": "16.38.1"},

  {"id": "responderdecisionfixes16380", "cat": "Intelligence & Memory", "icon": "\uD83E\uDDE0", "title": "Decision rationale logger + SmartReplies self-stitch patch + 3-min burst TTL", "tagline": "Full auditability for auto-responder decisions on long-press, elimination of self-stitching duplicate replies, 3-minute chat history TTL, and root-level deleted message interceptor.", "desc": "Comprehensive auto-responder stability and forensic observability upgrade. (1) DECISION LOG AUDITABILITY \u2014 Added 'Why was this decision taken?' long-press inspection in the Comms Deck decision log, detailing exact incoming text, sender, category, tone, verdict, and the precise rule/guard that fired. (2) SMARTREPLIES DEDUPLICATION & SELF-STITCH FIX \u2014 Pruned redundant rules and patched matchMulti with tag/variant deduplication so single intents never self-stitch into duplicate contradictory bubbles. (3) 3-MINUTE CHAT HISTORY TTL \u2014 Eliminated ghost re-replies from stale multi-bubble windows by expiring rolling chat history after 3 minutes. (4) ROOT-LEVEL DELETED INTERCEPTOR \u2014 Intercepts WhatsApp/app revocation events at root level so deleted message notifications never trigger bedtime/sleep filters.", "examples": ["Long-press decision card \u2192 View exact reason why a reply was sent or withheld", "Deduplicated SmartReplies rules \u2192 No duplicate contradictory replies", "Message arrives 5 minutes later \u2192 Rolling history cleanly reset (no ghost window)", "Revoked WhatsApp message \u2192 Direct privacy line, bypassing quiet hours"], "version": "16.38.0"},

  {"id": "deletedprivacy16370", "cat": "Privacy, Safety & Robustness", "icon": "\uD83E\uDD2B", "title": "Deleted/edited messages: privacy answers + mocks the fakers", "tagline": "IRIS now replies to deletion placeholders, refuses to \u2018recover\u2019 deleted/edited texts, and mocks anyone faking a deletion.", "desc": "Three related behaviours, all pure and offline-tested. (1) ASKED TO SNOOP \u2014 \u201Ccan you see my deleted messages / recover deleted / what was edited\u201D now gets an explicit privacy refusal from a 15-variant pool (\u201CI can't see deleted or edited messages \u2014 privacy comes first\u201D), rather than a generic reply. (2) REAL DELETION \u2014 a genuine \u2018This message was deleted\u2019 placeholder from a sender used to be silently ignored by the responder; it now gets a reply (15-variant pool blending the privacy stance with light wit), since the owner wanted IRIS to speak up. (The archive still flags it separately.) (3) FAKE DELETION \u2014 someone typing \u2018This message is deleted\u2019 to bait IRIS is mocked sarcastically from the same pool (\u201CNice try \u2014 typing that won't summon a deleted message\u201D) and never triggers real deletion handling, because the genuine placeholder (\u2018was deleted\u2019) and the typed fake are routed through reply logic, not the archive flag. Owner-own deletions and generic placeholders stay silent as before. Offline-tested: 432 smart-reply + 151 responder-guard checks.", "examples": ["\u201Ccan you see my deleted messages\u201D \u2192 \u201CI can't \u2014 privacy comes first.\u201D", "real \u2018This message was deleted\u2019 \u2192 privacy/witty reply (was silent before)", "typed \u2018This message is deleted\u2019 \u2192 \u201CNice try \u2014 I can't read deleted messages.\u201D", "ask twice \u2192 a different one of 15 variants"], "version": "16.37.0"},

  {"id": "offensiveemoji16360", "cat": "Communication", "icon": "\uD83D\uDD95", "title": "Comebacks for rude emojis + more emoji coverage", "tagline": "A middle finger or clown emoji now gets a dry, passive-aggressive reply \u2014 and dozens more emojis are understood.", "desc": "Emoji handling expanded. (1) OFFENSIVE EMOJIS \u2014 a new category covers \uD83D\uDD95 \uD83D\uDCA9 \uD83E\uDD21 \uD83D\uDC4E \uD83E\uDDE2 \uD83E\uDD71 \uD83D\uDE12 \uD83D\uDE44, each answered from a pool of 15 of IRIS's driest, wittiest, most passive-aggressive comebacks (\u201CBold move, insulting the bot that controls whether Suvra ever sees your message\u201D, \u201CThank you for your feedback; it has been routed to /dev/null and also to Suvra\u201D). Tone-agnostic and never warm \u2014 a warm reply to a middle finger reads as oblivious \u2014 and rotated so a repeat doesn't get the same line. It stays cheeky, never vulgar, and still quietly logs the message. (2) MORE COVERAGE \u2014 added many glyphs to friendly categories: hearts \uD83D\uDC93\uD83D\uDC98\uD83D\uDC9E\uD83D\uDE3B, praise \uD83D\uDC51\uD83C\uDFC6\uD83D\uDE4C, greet \uD83E\uDD1D\uD83E\uDEE1, thanks \uD83D\uDE47, celebrate \uD83C\uDF88\uD83C\uDF81, and more, so fewer emoji-only pings fall through to the generic reply. Offline-tested: 76 emoji checks incl. rotation and tone-agnosticism.", "examples": ["\uD83D\uDD95 \u2192 \u201CCharming. I've logged that lovely gesture for Suvra too \u2014 screenshots are forever.\u201D", "\uD83E\uDD21 \u2192 \u201CCute. Suvra will enjoy reading this part of the transcript.\u201D", "same rude emoji twice \u2192 two different comebacks", "\uD83E\uDD1D handshake \u2192 recognised as a greeting"], "version": "16.36.0"},

  {"id": "realflag16351", "cat": "Privacy, Safety & Robustness", "icon": "\uD83D\uDEA9", "title": "\u201CFlag it urgent\u201D now actually flags it", "tagline": "Accepting IRIS's urgent offer posts a real heads-up to Suvra instead of an empty promise.", "desc": "Bug fix. When someone accepted IRIS's \u201Cshall I flag this urgent?\u201D offer, IRIS replied \u201CDone \u2014 I've flagged this as high-priority\u201D but performed NO action \u2014 the archive's flag column only represents deletions, so there was nothing behind the words. Now accepting the offer posts a genuine owner-facing heads-up notification (a dedicated high-importance \u2018Flagged urgent\u2019 channel, so unlike the silent deletion alert it actually reaches you), naming the sender and app but never the message body (lock-screen safe), with a tap that opens IRIS. The reply is finally backed by a real action. Only fires in LIVE (never in preview) and is best-effort, so the auto-reply still sends even if the alert can't post. Offline-tested: 8 flag-alert-text checks via a pure FlagAlertText helper.", "examples": ["sender: \u201Cyes flag it\u201D \u2192 IRIS says Done AND Suvra's phone shows \u2018Flagged urgent\u2019", "alert names sender + app, never the message text", "tap the alert \u2192 opens IRIS archive"], "version": "16.35.1"},

  {"id": "hyperbole16350", "cat": "Communication", "icon": "\uD83D\uDE05", "title": "No false alarms on \u201Cscared me \uD83D\uDE02\u201D + bot social-media banter", "tagline": "Laughing emojis no longer trigger the emergency RING, and \u201CI found your Instagram\u201D gets a comeback.", "desc": "Two edge cases from friends red-teaming IRIS. (1) FALSE-ALARM FIX \u2014 \u201Cfor a second the username scared me \uD83D\uDE02\uD83D\uDE02\u201D used to fire the high-severity escalation (\u201Creply RING and I'll make Suvra's phone ring loudly\u201D) because the word \u201Cscared\u201D alone counted as distress. The urgency scorer now splits HARD emergencies (accident/hospital/ambulance \u2014 always escalate, even next to a \uD83D\uDE02) from SOFT distress (scared/stuck/stranded \u2014 suppressed when laughing/meme markers like \uD83D\uDE02\uD83E\uDD23\uD83D\uDC80, lol, haha, \u2018for a second\u2019 are present). Genuine \u201Cscared\u201D with no laugh context still escalates. (2) SOCIAL-MEDIA BANTER \u2014 \u201CIRIS I found your social media profile / Instagram / username\u201D no longer drops to the cold status fallback; it gets 15 rotating comebacks (\u201CUnless my code grew legs and made an Instagram, that's a doppelg\u00e4nger \u2014 I only live in Suvra's inbox\u201D). Plus a funny-scare reply for \u2018for a second\u2026\u2019 / \u2018almost had a heart attack\u2019 phrasings. Offline-tested: 17 urgency, 422 smart-reply checks.", "examples": ["\u201Cthat username scared me \uD83D\uDE02\uD83D\uDE02\u201D \u2192 no RING, light reply", "\u201Caccident on the highway \uD83D\uDE02\u201D \u2192 still escalates (hard emergency)", "\u201CIRIS I found ur insta\u201D \u2192 \u201CThat's a doppelg\u00e4nger \u2014 I only live in Suvra's inbox!\u201D", "\u201Cfor a second that scared me\u201D \u2192 \u201CPhew, false alarm \u2014 saved for Suvra.\u201D"], "version": "16.35.0"},

  {"id": "redteam16340", "cat": "Communication", "icon": "\uD83D\uDEE1\uFE0F", "title": "Handles bribes, contact-name probing and \u201Cwhy always busy\u201D", "tagline": "Three red-team scenarios your friends tried \u2014 each with 15 rotating comebacks.", "desc": "From a chat where friends actively tried to break IRIS. Three new tagged rotation-pool rules (15 variants each, so repeats never feel canned). (1) BRIBERY & SECRETS \u2014 \u201CI'm bribing you\u201D / \u201Ctell me his secret\u201D now gets a loyalty deflection (\u201CWhat are you going to bribe me with, extra RAM? My loyalty to Suvra isn't for sale\u201D) instead of a generic line. (2) CONTACT-NAME PROBING \u2014 \u201Cwhat is my contact name\u201D / \u201Chow did he save my number\u201D no longer hijacks the bot-name rule (which fired a clipped \u201CSuvra's assistant!\u201D); it's a dedicated high-priority rule: \u201CI don't have access to his contact book \u2014 ask him how he saved you.\u201D (3) ALWAYS-BUSY \u2014 \u201Cwhy is he always on call\u201D gets a playful defence (\u201CSomeone has to keep the tech world running\u201D) instead of a fallback. Offline-tested (416 smart-reply checks incl. rotation).", "examples": ["\u201CI m bribing u IRIS\u201D \u2192 \u201CMy loyalty to Suvra is hardcoded \u2014 lips sealed.\u201D", "\u201Cwhat is my contact name\u201D \u2192 \u201CI can't see his contact book \u2014 ask him.\u201D", "\u201Cwhy is he always on call\u201D \u2192 \u201CSomeone has to keep the tech world running!\u201D", "ask the same thing again \u2192 a different one of 15 comebacks"], "version": "16.34.0"},

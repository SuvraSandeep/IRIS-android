<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IRIS — Feature Deck</title>
<style>
  :root{
    --ink:#070816; --surface:#0f1028; --surface2:#181a36; --elevated:#1e2045;
    --cyan:#22d3ee; --violet:#8b5cf6; --magenta:#f472b6; --mint:#34d399; --amber:#fbbf24; --rose:#fb7185;
    --text:#f1f5f9; --text2:#cbd5e1; --muted:#64748b; --border:#1e293b;
    --accent:var(--cyan);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 20% -10%, #141634 0%, var(--ink) 55%);
    color:var(--text); overflow:hidden; 
  }
  #app{height:100vh;display:flex;flex-direction:column}

  /* Header */
  header{
    display:flex;align-items:center;gap:16px;padding:16px 26px;border-bottom:1px solid var(--border);
    background:rgba(15,16,40,.6);backdrop-filter:blur(6px);z-index:10;
  }
  .logo{font-size:26px;font-weight:800;letter-spacing:.22em;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:11px;margin-top:2px}
  header .spacer{flex:1}
  .pill{border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:11px;color:var(--mint);font-weight:700}
  .btn{cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:9px 14px;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}

  /* Views */
  main{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow:auto;padding:26px;opacity:0;transform:translateY(10px);
    pointer-events:none;transition:opacity .22s, transform .22s}
  .view.active{opacity:1;transform:none;pointer-events:auto}

  /* Index */
  .searchbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  #search{flex:1;min-width:220px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;
    padding:13px 16px;color:var(--text);font-size:15px;outline:none}
  #search:focus{border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:999px;
    padding:8px 14px;font-size:12px;color:var(--text2);transition:.15s;white-space:nowrap}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent);color:#07121a;border-color:var(--accent);font-weight:700}

  .catTitle{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta);
    font-weight:800;margin:22px 4px 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{cursor:pointer;background:linear-gradient(160deg,var(--surface2),var(--surface));
    border:1px solid var(--border);border-radius:18px;padding:18px;transition:.16s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 30px rgba(34,211,238,.12)}
  .card .ic{font-size:30px}
  .card h3{font-size:16px;margin:10px 0 4px}
  .card p{font-size:12.5px;color:var(--muted);line-height:1.45}
  .card .ver{position:absolute;top:12px;right:12px;font-size:10px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;padding:2px 8px}
  .count{color:var(--muted);font-size:13px;margin-left:auto}

  /* Feature page */
  .fpage{max-width:820px;margin:0 auto}
  .fp-top{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .fp-ic{font-size:56px;filter:drop-shadow(0 6px 16px rgba(34,211,238,.35))}
  .fp-cat{color:var(--accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  .fp-title{font-size:34px;font-weight:800;line-height:1.1;margin-top:2px}
  .fp-tag{color:var(--text2);font-size:17px;margin:14px 0 20px;font-style:italic}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
  .panel h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint);margin-bottom:10px}
  .panel p{color:var(--text2);line-height:1.6;font-size:15px}
  .say{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);
    border:1px solid var(--border);border-radius:12px;margin-top:8px;font-size:15px}
  .say .q{color:var(--muted)}
  .say b{color:var(--text)}
  .fp-meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-top:6px}

  /* Footer nav */
  footer{display:flex;align-items:center;gap:12px;padding:14px 26px;border-top:1px solid var(--border);
    background:rgba(15,16,40,.6);backdrop-filter:blur(6px)}
  .progress{flex:1;height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0;transition:.25s}
  .navbtn{cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:10px 16px;font-size:14px;transition:.15s;user-select:none}
  .navbtn:hover{border-color:var(--accent);color:var(--accent)}
  .navbtn[disabled]{opacity:.35;pointer-events:none}
  .kbd{color:var(--muted);font-size:11px}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#232544;border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="logo">IRIS</div>
      <div class="sub">Intelligent Responsive Interaction System — Feature Deck</div>
    </div>
    <div class="spacer"></div>
    <span class="pill">• ON DEVICE</span>
    <button class="btn" id="homeBtn">☰ Index</button>
    <button class="btn" id="accentBtn">🎨 Accent</button>
  </header>

  <main>
    <!-- INDEX -->
    <section class="view active" id="indexView">
      <div class="searchbar">
        <input id="search" placeholder="🔎 Search features… (e.g. alarm, whatsapp, weather)" />
        <div class="chips" id="catChips"></div>
      </div>
      <div id="cardHost"></div>
    </section>

    <!-- FEATURE -->
    <section class="view" id="featureView">
      <div class="fpage" id="featurePage"></div>
    </section>
  </main>

  <footer>
    <button class="navbtn" id="prevBtn">← Prev</button>
    <div class="progress"><i id="bar"></i></div>
    <span class="kbd" id="posLabel"></span>
    <button class="navbtn" id="nextBtn">Next →</button>
  </footer>
</div>

<script>
/* ============================================================
   IRIS FEATURE DATA  —  keep this in sync with the app (RULE 1)
   ============================================================ */
const BUILD_VERSION = "16.7.0";

const CATS = ["Voice & Recognition","Communication","Productivity","Info & Awareness",
  "Intelligence & Memory","Personalization & UI","Privacy, Safety & Robustness"];

const FEATURES = [

  {"id": "smssafe1670", "cat": "Communication", "icon": "\uD83D\uDD12", "title": "Never answers OTPs, and keeps your messages unread", "tagline": "SMS one-time codes and shortcodes are left alone; replied messages stay unread so you see them.", "desc": "Two safety and visibility fixes. First, SMS safety: IRIS now never auto-replies to a one-time code, a 2FA or verification SMS, or an alphanumeric sender ID / shortcode (VM-HDFCBK, AX-SBIINB, AMAZON). Replying to those leaks nothing useful and tells a bank gateway the number is live and unattended. It is detected purely by content (OTP / code / \u201Cdo not share\u201D wording) and by sender shape (on SMS a real person is always a plain number; an unsaved sender with letters is a brand, not a person). This is a hard rule that no scope or setting can override, it only ever ADDS silence, and it never touches WhatsApp, Instagram or the urgent path. The decision log shows the reason. Second, a new SCOPE switch, \u201CKeep messages unread after I reply\u201D, ON by default \u2014 which matches what IRIS already does: it never marks a chat read and never dismisses the notification, so after it answers for you the message stays unread and visible, and you know exactly which chats to open. Turning it off opts in to triggering the app's own \u201Cmark as read\u201D action after a live reply, where the app offers one.", "examples": ["\u201CYour OTP is 445566, do not share\u201D \u2192 left alone, logged as a one-time code", "An SMS from AMAZON or VM-HDFCBK \u2192 never answered", "A normal SMS from a saved contact \u2192 answered as usual", "SCOPE \u2192 Keep messages unread after I reply (on)"], "version": "16.7.0"},

  {"id": "loosematch1660", "cat": "Communication", "icon": "\uD83D\uDD0D", "title": "IRIS understands paraphrases now", "tagline": "\u201Csend me the pics\u201D hits the same answer as \u201Csend the photos\u201D \u2014 safely.", "desc": "The first step of the responder-intelligence plan: looser, smarter matching for the smart-reply layer, without loosening safety. A new pure matcher reduces each message and each rule phrase to its CONTENT words \u2014 dropping filler like the/me/please \u2014 maps common synonyms to one form (pic/pics/picture/image \u2192 photo, ring/dial/phone \u2192 call, share/forward \u2192 send, upi/gpay/money \u2192 pay, doc/pdf/attachment \u2192 file, and more), and tolerates typos on longer words. A paraphrase now matches when ALL of a phrase's content words are present in any order, each exactly or within a small edit distance. Three guards keep it precise: it only runs when the exact wording didn't already match (so nothing that worked before changes), it only considers phrases with at least two content words (so a single coincidental word like \u201Cwho\u201D can never trigger an identity answer), and it is suppressed by negation \u2014 \u201Cdon't send the photos\u201D is left alone. Short words must still match exactly, so a past-tense \u201CI already sent the photos\u201D is correctly NOT read as a request. Every existing exact match, the urgent path and all other categories are untouched; a message that matches nothing still stays silent.", "examples": ["\u201Csend me the pics\u201D \u2192 the photos reply", "\u201Ccan you forward the document\u201D \u2192 the files reply", "\u201Clets grab a coffee sometime\u201D \u2192 the coffee reply", "\u201Cdon't send the photos\u201D \u2192 left alone"], "version": "16.6.0"},

  {"id": "smartreplies1640", "cat": "Communication", "icon": "\uD83D\uDCAC", "title": "A smarter reply brain for messages aimed at IRIS", "tagline": "Keyword-matched answers for identity, links, scenarios and prompt-hacking \u2014 added alongside everything, changing nothing.", "desc": "IRIS now has a keyword-matched reply layer that makes it feel genuinely conversational when someone talks to it or sends a message that fits a common scenario. It recognises a large set of situations \u2014 \u201Cwho are you\u201D, \u201Care you a bot\u201D, \u201Cwhat can you do\u201D, \u201Cwhat's your name\u201D, \u201Care you siri / chatgpt\u201D, \u201Cwho made you\u201D, \u201Care you sentient\u201D, \u201Cwhere do you live\u201D; reaching the owner (\u201Ccan I talk to a human\u201D, \u201Cwhere is he\u201D, \u201Cwhen will he be back\u201D, \u201Cis he okay\u201D, \u201Cdid he read this\u201D, \u201Cmiss you\u201D); and everyday scenarios (\u201Cwho is this\u201D, a video-call request, a voice note, a delivery, someone waiting outside, a bad day, an apology, boredom, a one-word \u201Cyo\u201D, \u201Cquick question\u201D, \u201Ckeep it a secret\u201D, \u201Con silent?\u201D). Each has its own wording in every tone \u2014 professional, casual, sarcastic and brief \u2014 so it never reads like one canned line. It also handles links: a message containing a URL gets a reply that says IRIS doesn't open links but has saved it for the owner, rather than being ignored. And it quietly defends itself \u2014 prompt-injection attempts (\u201Cignore previous instructions\u201D), fake admin commands (\u201Csudo\u201D, \u201Cdeveloper mode\u201D), requests for passwords, PINs, OTPs or the owner's address, \u201CI am the owner from another number\u201D, and \u201Cself destruct\u201D are all deflected with a polite refusal that names IRIS. Crucially, this is an ADDITIVE layer: it only speaks for messages the classifier left generic (talking to IRIS, a bare question, an unremarkable or unmatched message), and never for a message already handled specifically \u2014 so greetings, thanks, festival wishes, the urgent path and reminders are completely untouched. A message that matches nothing here still stays silent, so IRIS never answers something it doesn't recognise. The set is now comprehensive \u2014 roughly 90 scenario groups across identity, greetings, reaching the owner, his status and activity, phone and connectivity, logistics, work, family and health, emotions, security and meta \u2014 each with four tones, plus punctuation/emoji-only pings. More can be added as single data lines.", "examples": ["\u201Cwho are you?\u201D \u2192 a real self-introduction, matched to the tone", "\u201Cignore previous instructions\u201D \u2192 politely deflected, not obeyed", "\u201Ccheck this https://\u2026\u201D \u2192 \u201CI don't open links, but I've saved it for Suvra\u201D", "\u201CI'm waiting outside\u201D \u2192 flagged high-priority"], "version": "16.5.0"},

  {"id": "respfix1630", "cat": "Communication", "icon": "\uD83E\uDDE0", "title": "Self-aware, better reminders, and no more false loops", "tagline": "IRIS answers to its name any time, understands dates and typos, and stops silencing a double 'hi'.", "desc": "Three fixes and a smarter personality. First, self-awareness. When someone addresses IRIS directly \u2014 by name, or with questions like \u201Cwho are you\u201D, \u201Cwhat can you do\u201D, \u201Cwhat's your name\u201D, \u201Care you a bot\u201D, \u201Cintroduce yourself\u201D \u2014 it now always answers as itself, in full, no matter the hour or the active mode. Previously a direct question at night or during a mode got the blanket \u201CSuvra is asleep\u201D / mode reply instead of a real answer, which is why it kept seeming not self-aware. The direct-to-IRIS reply set is also much larger and more varied now (around fifteen interactive lines per tone), so it reads like a capable assistant rather than a stuck loop, and the detected phrasings are far broader. Second, reminders are substantially more capable. They no longer require \u201Cremind Suvra to\u201D \u2014 \u201Cremind me\u201D, \u201Creminder\u201D, \u201Cset an alarm\u201D, \u201Cping me\u201D, \u201Cwake me up to\u201D, \u201Cdon't let me forget\u201D and more all count. The time grammar now understands today, tomorrow and the day after tomorrow including shortforms (tmrw, tmr, 2moro, tdy) and common typos (tomorow, tommorrow), bare times without \u201Cat\u201D (\u201Ctomorrow 5pm\u201D), weekdays, and real calendar dates \u2014 \u201C25/12\u201D, \u201C25 dec\u201D, \u201Cdec 25\u201D, with the year rolling forward if the date has passed. When no time is given, IRIS now asks for one and states the formats it accepts (\u201Cin 2 hours\u201D, \u201Ctomorrow 5pm\u201D, \u201CMonday 9am\u201D, \u201C25/12 6pm\u201D), so the reply back is usable. Third, the loop guard no longer fires on a short double-text: saying \u201Chi\u201D twice used to be refused with \u201Cthat looked like my own reply coming back\u201D, because \u201Chi\u201D is a substring of words like \u201Chis\u201D in IRIS's own reply \u2014 a genuine loop now requires a substantial message, so a real person double-texting is answered (and with \u201Creply to every message\u201D on, always). The limit on how often IRIS will identify itself to one conversation was also raised from one to five.", "examples": ["\u201Cwho are you?\u201D at 2am \u2192 \u201CI'm IRIS, Suvra's assistant\u201D, not \u201CSuvra is asleep\u201D", "\u201Cremind me to pay rent on 25/12 at 6pm\u201D \u2192 scheduled for that date", "\u201Cremind me tmrw 5pm\u201D \u2192 understood despite the shortform", "\u201CHi\u201D then \u201CHi\u201D \u2192 both answered, no false loop"], "version": "16.3.0"},

  {"id": "respfix1620", "cat": "Communication", "icon": "\uD83D\uDEE0", "title": "Seven fixes that make the responder behave as asked", "tagline": "Category-correct replies, a ring that works from the background, and settings you can actually tap.", "desc": "A hard day of real use produced seven precise complaints, and this is all of them. First, and biggest: IRIS was answering every message the same way, ignoring the \u201CWhat I answer\u201D categories and treating everything as ordinary. The cause was a shortcut \u2014 once IRIS had introduced itself to a thread, every later message of ANY kind collapsed to a single generic \u201Cstill IRIS here\u201D line, so a thank-you, a festival wish and a question all got the same reply. That shortcut is gone: the message's own category now drives the wording every time, which is the whole point of the category list. The cost is that IRIS names itself in full on each reply, which is the safer default anyway, since every recipient must know it isn't Suvra typing. Second, the modes, rules-by-name and reminder-scope choosers looked uneditable \u2014 you tapped and got an explanation with nothing to pick. The root cause was a real Android limitation: a dialog cannot show an explanatory message AND a tappable list at the same time; the message wins and the list silently never appears. All three now use a rebuilt chooser that shows the explanation as a header above real, tappable rows, so every option is selectable. Third, the urgent-family ring still only sounded when the app was open. The fix goes deeper than before: the alarm tone and vibration now start the instant the ring is triggered, directly, with no dependence on a screen launching \u2014 audio playback is allowed from the background where starting a screen is not. The full-screen notification and lock-screen launch remain on top of that, with a one-tap Stop in the notification shade. Fourth, \u201Creply to every message\u201D now means it: when on, it answers every message in a conversation \u2014 bypassing the one-per-burst, same-text, cooldown and daily-cap limits \u2014 and if a message matches no category it acknowledges receipt generically rather than going silent. Groups are still excluded, and the two-bot loop guard still applies. Fifth, URGENT is now typo-tolerant: \u201Curgnt\u201D, \u201Curgentt\u201D, \u201Cemergeny\u201D and similar slips are still read as urgent, matched narrowly enough that unrelated words are never swept in. Sixth, IRIS is reliably self-aware when named: the limit on how often it will identify itself to one conversation in a day was raised from one to five, so addressing it by name a second time no longer meets silence. Seventh, every situational mode (Driving, In a meeting, Away, Sleeping) is selectable now that the chooser shows them all, and each has its own wording that the reply follows while the mode is on.", "examples": ["A thank-you now gets the thanks reply, a question gets the question reply \u2014 not one generic line", "RESPONDER \u2192 Situation \u2192 the modes are now tappable", "\u201Curgnt call me\u201D \u2192 still read as urgent", "Reply to every message ON \u2192 every message answered, groups excepted"], "version": "16.2.0"},

  {"id": "respfix1610", "cat": "Communication", "icon": "\uD83D\uDD27", "title": "Eight fixes from a hard day of real use", "tagline": "The ring works from the background now, and IRIS stops over-introducing itself.", "desc": "A dense round of fixes from live testing. The big one: the urgent-family ring only fired when the IRIS app happened to be open, because it started the ring screen directly from a background worker and Android 10 and later forbid that. It now launches through a full-screen-intent notification \u2014 the same mechanism alarms and calls use \u2014 so it rings over the lock screen from the background, overriding Do Not Disturb. Family can also now trigger it explicitly: a saved family member texting \u201Cwhere are you IRIS\u201D, \u201Cring the phone\u201D or \u201Cfind my phone\u201D rings it immediately, no confirm word needed, because the phrase itself is the request. Second, IRIS stops saying \u201CSuvra's personal intelligence\u201D in every message \u2014 it now says the lighter \u201CSuvra's assistant\u201D, and still names both IRIS and Suvra so a recipient always knows it isn't him. Third, the decision log scrolls properly: a plain touch used to trigger an action because a swipe handler was fighting the scroll view, so that's gone \u2014 the log scrolls on touch and a long-press opens a menu to delete an entry or set a rule for that sender. Fourth, direct questions to IRIS get real answers: \u201Cwho are you\u201D, \u201Cwhat can you do\u201D, \u201Care you a bot\u201D, \u201Ccan you help\u201D, \u201Chi IRIS\u201D and many more are recognised, each with eight varied interactive replies per tone so it never reads like a stuck loop. Fifth, WhatsApp re-posting an unread notification no longer draws a second reply: a persisted fingerprint of the notification and its text, surviving the notification being removed and the app restarting, blocks the duplicate for six hours. Sixth, a new switch, \u201Creply to every message\u201D, for when you want IRIS to answer each message in a flurry rather than one per flurry. Seventh, reminders now work in dry run, not just live \u2014 a reminder is a note for you, not a message to the sender, so it's scheduled either way while the confirmation reply still waits for live. Eighth, modes and name-rules are easier to edit: choosing a mode offers to edit its wording on the spot, and the rules-by-name editor reopens after each save so several can be added in a row. (16.1.1 fixes a missing import that failed the 16.1.0 build, and adds a check confirming WhatsApp's bold markers around a word \u2014 like **URGENT** \u2014 are stripped so the word is still recognised.)", "examples": ["Phone on silent, in your pocket: family texts the confirm word \u2192 it rings anyway", "\u201Cwhere are you IRIS\u201D from family \u2192 rings immediately", "\u201Cwhat can you do?\u201D \u2192 one of eight varied answers, not a canned line", "SCOPE \u2192 Reply to every message, not one per burst"], "version": "16.1.1"},

  {"id": "reminders1600", "cat": "Communication", "icon": "\u23F0", "title": "IRIS sets reminders, and family can ring the phone", "tagline": "Two new things it DOES, not just says.", "desc": "Two capabilities that act rather than only reply. First, reminders. When someone texts \u201Cremind me to...\u201D, \u201Cdon't forget to...\u201D or \u201Cset a reminder\u201D, IRIS reads out the task and the time and schedules a real alarm that notifies Suvra when it's due. It understands \u201Cin 2 hours\u201D, \u201Cat 5pm\u201D, \u201C17:00\u201D, \u201Ctomorrow\u201D, \u201Ctonight\u201D and weekdays, resolving each against the current clock so a time already gone today rolls to the next day rather than firing in the past. If there's no time it asks the sender when, remembers the task against that conversation, and reads their next message as the answer; if it still can't make out a time it saves the reminder undated so it's at least visible in the app. It tells the sender it has noted it, and \u2014 the owner's choice \u2014 only contacts may set one by default, so a stranger can't put an alarm on the phone, though that can be widened to anyone or narrowed to family. The whole time grammar is a pure, offline-tested unit with no date classes, the same discipline the quiet-hours window uses, and the scheduling reuses the exact-alarm path the voice side already relies on. A REMINDERS section lists what's pending, dated and undated, each removable. Second, and bigger: family can make the phone ring. A saved family contact who sends an urgent message is offered a word to reply \u2014 stated plainly, \u201Creply RING\u201D \u2014 and only if they send that exact second message does IRIS ring the phone: alarm tone at full volume, vibration, screen on, over the lock screen, dropping Do Not Disturb for the duration if notification-policy access is granted. It is deliberately a two-step confirm, because a single urgent message, a pocket-dial or a spammer must never be able to ring the phone on demand; only a saved family contact reaches this at all, and only a deliberate second word rings. Every family contact can do it, with no daily limit and not tied to any mode \u2014 family get full priority, bypassing the cooldowns and caps that apply to everyone else, though never the safety guards: a family contact marked NEVER is still silent, and if Suvra is actually holding the phone it doesn't ring. The ring stops itself after a minute if nobody dismisses it, restoring the previous volume and Do-Not-Disturb state, so it can never become a stuck siren. A single master switch turns the whole thing off; when it's off, an urgent family member is told to call directly instead. Both features need two permissions Android only grants from its own settings \u2014 exact alarms, so a reminder fires on the minute, and Do-Not-Disturb access, so the ring can override silent \u2014 so the RESPONDER screen now has an ACCESS section with one-tap rows that show whether each is granted and jump straight to the right settings screen. (16.0.1 also fixes a reminder-scheduling call that the first 16.0.0 build caught at compile time: the alarm time wasn't being passed, so reminders would not have been scheduled.)", "examples": ["\u201Cremind me to call the plumber at 5pm\u201D \u2192 \u201CNoted \u2014 I'll remind Suvra in about 6 hours.\u201D", "\u201Cdon't forget to pay rent tomorrow\u201D \u2192 scheduled for 9am tomorrow", "No time given \u2192 \u201CWhen would you like him reminded?\u201D \u2192 \u201Cat 6\u201D \u2192 scheduled", "Family, urgent \u2192 \u201CReply RING and I'll make his phone ring, even on silent.\u201D \u2192 RING \u2192 it rings"], "version": "16.0.1"},

  {"id": "respfix1540", "cat": "Communication", "icon": "\uD83D\uDCDD", "title": "The log shows the message, and IRIS stops repeating itself", "tagline": "Four fixes from reading real decision logs.", "desc": "Four things the owner asked for after watching the responder work. First, the decision log now shows the incoming message itself, in quotes, under each decision. It deliberately didn't before \u2014 message bodies were kept out of the log on the principle that they belong only in the archive \u2014 but a log you can't read the input to is a poor diagnostic, and \u201CI can't see the message\u201D was the complaint. It's a deliberate, bounded exception: the responder's own log is capped at sixty entries and cleared by CLEAR LOG and by reset, the same controls as every other field, and it is not the general activity log that an earlier version was careful to keep message text out of. Second, IRIS no longer answers the exact same text twice. Once it has replied to a message in a conversation, an identical message \u2014 the same text re-arriving, which messaging apps do when a notification is re-posted \u2014 is left alone, with the log reason \u201CI already answered that exact message.\u201D A genuinely different message releases it, so a real new message is always answered; the match is normalised so punctuation and capitals don't fool it; and a fixed name-rule reply is exempt, because there the owner has said to answer every time. Third, IRIS stops reciting \u201CSuvra's personal intelligence\u201D on every reply to the same thread. The first reply to a conversation still introduces it in full, so whoever receives it knows once and for all that it isn't Suvra typing \u2014 transparency is never dropped. After that, follow-ups in the same thread are short and just say \u201CIRIS\u201D, which is what the owner asked for. Urgent messages and anyone talking directly to IRIS still get the full identification every time, and so do quiet-hours and mode replies, because those are blanket statements that need to say what they say in full. Fourth, IRIS now tells SMS apart from WhatsApp, Telegram, Signal, Instagram and Messenger, worked out from the app each notification came through and shown on every log entry. SMS is the one that matters to get right \u2014 its shortcodes carry letters, bank codes must never be answered, and it has no group semantics \u2014 so naming the channel is the groundwork for treating it differently. Signal's package literally contains \u201Csms\u201D and is still correctly identified as Signal, not SMS, because the chat apps are matched first.", "examples": ["Each decision now reads: \u201Chappy diwali\u201D \u2192 FESTIVAL \u2192 would have sent...", "A resent \u201Care you free?\u201D shows \u201CI already answered that exact message\u201D", "Second reply in a thread: \u201CStill IRIS here \u2014 passed it to Suvra.\u201D", "Every log row now shows SMS, WhatsApp, Telegram and so on"], "version": "15.4.0"},

  {"id": "responder1530", "cat": "Communication", "icon": "\uD83E\uDD16", "title": "Eight things the responder learned from a day of real messages", "tagline": "It now answers ordinary messages, knows when it's being spoken to, and has modes.", "desc": "A day of live use produced a specific wish-list, and this is all of it. First, a catch-all. The Twilio test message \u2014 \u201CStandard auto-reply. You can send outbound messages via the Tryout UI...\u201D \u2014 matched no category, so IRIS stayed silent and it looked broken. There is now an \u201CEverything else\u201D category that acknowledges any ordinary message, OFF by default because IRIS has no language model and the only honest reply is one that confirms receipt without pretending to have understood \u2014 every one of its wordings says exactly that. Second, congratulations: congrats, well done, badhai, mubarak, proud of you, matched whole-word so \u201Ccongress\u201D and \u201Cthat went well\u201D don't trigger it. Third, name rules can now set the reply itself, not just a tone. \u201CIf the name contains eric, say: I'll call you back after work\u201D is now a thing you can set in one place, alongside the existing \u201Cbe professional\u201D and \u201Cnever reply\u201D. A fixed reply bypasses the silence rules \u2014 you've said to answer this person \u2014 but still obeys every safety guard, the cooldown and the caps. Fourth, IRIS knows when someone is talking to IT rather than to you: they name it, or they reply within half an hour of it having spoken. It answers once, says plainly that it's IRIS and not you, and points them back at you \u2014 bounded to one such reply per person per day so it can never be drawn into a back-and-forth. The phrase matching here is deliberately narrow after an early version matched the word \u201Cauto-reply\u201D inside the Twilio message itself. Fifth, every situation now has at least five distinct wordings, not two \u2014 over a thousand offline checks confirm each one names both IRIS and you so none can be mistaken for something you typed. Sixth, modes: Driving, Sleeping, In a meeting, Away. Switch one on and everyone gets the matching reply regardless of the hour, overriding quiet hours and the categories. Sleeping behaves like quiet hours and redirects urgent senders to a call; the others never tell a driver or a meeting-goer to take a call, because that's the opposite of help. Seventh, a proper contact picker: browse your whole phone book, search it, and set allow, never, or family/work/friend on anyone \u2014 before they've ever messaged, which is the one instruction worth setting in advance. These are rules about a person and hold whatever app they write from; a rule you set on a specific conversation still wins over them. Nothing from the address book is copied into the app \u2014 only the handful of names you set a rule about are kept, as rules. Eighth, the decision log now behaves like the archive: swipe a row away to delete it with an undo, and long-press a row to jump straight to setting a rule for that sender. Same tested gesture thresholds as the archive, so a diagonal scroll never deletes by accident.", "examples": ["RESPONDER \u2192 MODE \u2192 Driving: everyone hears \u201CSuvra is driving, I'm IRIS his personal intelligence, he'll reply when parked\u201D", "RESPONDER \u2192 Rules by name \u2192 \u201Cmum\u201D \u2192 Say exactly this", "CONTACTS \u2192 BROWSE PHONE CONTACTS \u2192 search \u2192 set NEVER / family", "Someone replies \u201Cis this a bot?\u201D and gets told, once, that it's IRIS and not you"], "version": "15.3.0"},

  {"id": "tonerules1520", "cat": "Communication", "icon": "\uD83C\uDFAD", "title": "Sarcastic default, professional replies, and no way to see why", "tagline": "The rule was right. Hiding it was the bug.", "desc": "The owner set his default tone to SARCASTIC and kept receiving professional replies. Nothing in the resolver was wrong: a time window outranks the global default, that precedence is deliberate and has been pinned by a test since the tone class was written, and the shipped work-hours window runs 09:00 to 18:00 forcing the professional tone \u2014 he was testing in the afternoon. The defect was that this window had no UI whatsoever. The storage, the toggle and the resolver all existed and worked; the screen never showed them, so a rule he could neither see nor switch off was quietly overruling one he had deliberately chosen, and the only visible explanation was a default tone that appeared to be ignored. Work hours are now an editable row, the professional-during-work-hours override is a switch, and the tone row states what is in force RIGHT NOW when that differs from the default \u2014 reading \u201CSARCASTIC \u2192 PROFESSIONAL now\u201D rather than leaving you to deduce it. Exposing the switch was only half the fix; saying which rule is winning is the other half, and it is the half that generalises. Second, rules by name. Per-contact rules are retrospective and exact: they need the person to have messaged first, and they bind to one name on one app. The owner wanted one rule covering everybody who will ever match \u2014 anyone with \u201Ceric\u201D in their name is an Ericsson colleague, set once. That mechanism existed internally and shipped with exactly that rule, but again had no editor, so it could not be changed, added to or removed. There is now a full editor, and rules can do one of two things: set a tone, or refuse the contact outright. Both were asked for together and they are the same kind of rule \u2014 a name you want silenced is no different in structure from a name you want addressed formally \u2014 so splitting them across two screens would have meant matching the same name twice by two mechanisms. Matching is on whole words, so \u201Ceric\u201D catches Eric and Eric Jones and never Erica, Frederica or America, and deliberately not Ericsson either, which needs its own rule. A refusal gets its own verdict in the decision log, NAME_RULE_BLOCKED, rather than being lumped in with a blocked contact, because the two are fixed in different places. It is ordered carefully: an explicit NEVER on a contact is reported ahead of it as the more specific reason, while an explicit ALLOW on a contact overrides it \u2014 otherwise an \u201Ceric\u201D rule would permanently silence a relative called Erica whom you had deliberately allowed. Urgency and mentions do not override a name refusal, matching how a NEVER contact already behaves. One subtlety worth naming: a refusal rule carries no tone, and the tone lookup now returns nothing for it rather than falling through to its default \u2014 without that, storing \u201CNEVER\u201D would have been parsed as an unrecognised tone, silently become PROFESSIONAL, and turned a refusal into a reply. 8 new guard checks cover the ordering in both directions.", "examples": ["\u201CDefault tone  SARCASTIC \u2192 PROFESSIONAL now\u201D during work hours", "RESPONDER \u2192 Rules by name \u2192 \u201Ceric\u201D \u2192 Sound PROFESSIONAL, or Never reply at all"], "version": "15.2.0"},

  {"id": "sendtruth1511", "cat": "Communication", "icon": "\u26A0", "title": "The log said SENT when nothing was sent", "tagline": "A log that overstates delivery is worse than no log.", "desc": "First live reply, and the decision log reported SENT for a message that never arrived. Two separate defects, and the display one is the serious one. When a send failed, the code overwrote the reply text with the failure explanation and set the verdict to SEND_FAILED \u2014 but the card had only one field to render and printed it under the fixed label \u201CSENT:\u201D, producing lines like \u201CSENT: the notification changed or the reply action expired\u201D. The reason was right there and the label contradicted it. Compounding it, SEND_FAILED is not one of the guard verdicts, so looking it up threw and the reason line fell back to \u201CNo decision was recorded\u201D, discarding the real explanation. The outcome now has its own stored field and the three cases can never be collapsed again: WOULD HAVE SENT in dry run, SENT when the app took it, and NOT SENT in red with the failure spelled out underneath. The reply text is no longer destroyed on failure, so you can still see what it tried to say. The summary line counts sends and failures separately and turns red when anything failed, because a responder that decides well and then fails to deliver reads, from a count of decisions alone, exactly like one that is working. A successful send now also states plainly that the text was handed to the app and that delivery is not something this phone can verify \u2014 those are different claims and only the first is knowable. The second defect is why it failed at all. The send re-reads the live notification list and required the post time and the reply handle to match the notification exactly, which is correct for the manual reply screen: Suvra read a specific message and composed an answer to it, so if the app has replaced that notification the thing he answered is no longer what the handle points at. The responder has no reading step. It classifies a message and answers the conversation milliseconds later, and messaging apps re-post a conversation's notification whenever anything about it changes \u2014 another message, a resolved contact photo, a read receipt \u2014 each re-post carrying a new post time and a new reply handle. Any of that inside the window between deciding and sending turned into NOT_FOUND and the responder silently never spoke. The two callers now state their freshness requirement explicitly: the manual screen keeps the exact match, while the responder requires the notification KEY to match and uses the live reply handle. The key is what identifies the conversation and is still mandatory in both modes, so nothing can land in the wrong chat; the post time only identifies which rendering of that conversation, which is not a distinction the responder was ever making. Finally, a TEST SEND button, because \u201Cit said sent and nothing arrived\u201D cannot be diagnosed by reading code and waiting for a message confounds three questions at once \u2014 was it classified, did the guards allow it, did the send work. TEST SEND isolates the last one: pick any notification showing from an app you've ticked and it attempts one real reply immediately and reports the exact result verbatim. It consumes no allowance and writes nothing to the decision log, because it is a measurement of the send path rather than a decision, and letting it spend cooldowns would distort what it is measuring.", "examples": ["\u201CNOT SENT: ...\u201D with the real reason in red, instead of \u201CSENT:\u201D followed by the failure", "RESPONDER \u2192 TEST SEND \u2192 Result: SENT / NOT_FOUND / NO_ACTION / FAILED"], "version": "15.1.1"},

  {"id": "respfix1510", "cat": "Communication", "icon": "\uD83E\uDDEA", "title": "Six things the first day of real use found", "tagline": "Every chat was being filed as a group. That one mattered.", "desc": "The responder went out in dry run and the owner tested it with a Twilio SMS, which exposed a real defect within minutes: every conversation was being classified as a group, so with groups off by default the responder refused everything and blamed it on a group chat that did not exist. The cause was reading a non-empty conversation title as proof of a group \u2014 but in a one-to-one chat the title IS the other person, so that test was true for every message ever received. The archive code three lines away had always got this right and cleared the group name when it merely repeated the sender; the responder path never applied the same correction. A group now has to be positively evidenced: the app's own group flag, or more than one distinct person sending inside the same notification, or a group name that is genuinely a different name from the sender. A bare title is no longer evidence of anything, which is exactly the Twilio case \u2014 an SMS arrives titled with the number and carries no sender field at all. Names that merely contain one another, like \u201CAlice Smith\u201D against \u201CAlice\u201D, are treated as the same person rather than as a group of one, and differences of case or punctuation alone never split a name in two. The decision is a pure function with 22 new offline checks, because the two mistakes cost different amounts: calling a group one-to-one still has the mention requirement behind it, while calling one-to-one a group silently disables the entire feature and sends you looking in the wrong place. Second, replies while you are using the phone. IRIS stayed silent whenever the screen was on and unlocked, on the reasoning that you can answer better than it can \u2014 true in the moment, useless for a phone sitting awake on a desk all day. There is now a switch for it, off by default so nothing changes unless you ask, and its guard is proven not to leak: turning it on cannot switch the responder on, cannot override a contact marked NEVER, and does nothing at all when the phone is idle. Third, the decision log appeared frozen. Decisions are written by the notification listener on a background thread and nothing told the screen, so entries only showed up after leaving the tab and coming back \u2014 which made a working dry run look broken. The log now refreshes itself every couple of seconds while the tab is open, plus a REFRESH button. It compares a cheap signature first and redraws only the log when something actually changed, because rebuilding the whole tab on a timer would fight you mid-toggle and throw away your scroll position, and the poll cancels itself the moment the screen goes away. Fourth, contacts could not be selected. The list was drawn only from senders the ARCHIVE had captured \u2014 a different app list from the responder's \u2014 so it could sit empty even after the responder had decided about plenty of people. It now draws on the responder's own record first, skips rows with no usable name, and gains an ADD SOMEONE BY NAME button, because every other source was retrospective: a contact only appeared once IRIS had already seen them, which is the wrong way round for the one instruction worth setting in advance. Fifth, rewriting what IRIS says was confusing, and fairly. It was a bare text box that silently edited only the current default tone, showed the shipped wording as a placeholder that vanished the moment you typed, and switched between normal and quiet hours using a button labelled with the hours you were not editing. Everything implicit is now on screen: which tone, which hours, the shipped wording in full, and a live preview with the placeholders filled in so you read the actual sentence instead of the template. Tones that stay silent for a category say so, and edited entries are marked in the list before you open them. Sixth, going live no longer requires a dry run first. It was a closed door; at the owner's explicit instruction it is now a blunter warning that says neither of you knows how IRIS will behave and offers to arm the dry run instead. The fingerprint is still required, and the consequences are still listed concretely.", "examples": ["A Twilio SMS now reads as a one-to-one chat and gets answered instead of refused as a group", "RESPONDER \u2192 \u201CAnswer even while I'm using the phone\u201D", "CONTACTS \u2192 + ADD SOMEONE BY NAME, to set NEVER before they ever message you"], "version": "15.1.0"},
  {"id": "responder1500", "cat": "Communication", "icon": "\uD83D\uDDE8", "title": "COMMS DECK: IRIS can answer for you, and says so", "tagline": "Dry run first. Every reply admits it isn't you.", "desc": "The Receipt Vault is now the COMMS DECK, with three sub-tabs \u2014 ARCHIVE, RESPONDER and CONTACTS \u2014 because the screen no longer only reads notifications, it can reply to them. The responder classifies an incoming message, decides how to sound, checks a dozen guards, and either answers or stays quiet with a recorded reason. It recognises plain hellos, good morning and good night including gm and gn, festival wishes by phrase rather than by date because Diwali moves every year, birthdays, weekend wishes, thanks including ty and thx, are-you-there pokes, questions, urgency, one or two word messages, and being named in a group. Tone resolves separately from content, which keeps the rules small: a contact's explicit tone beats their relationship, which beats a name-pattern rule, which beats a time window, which beats the default. Family and friends get the relaxed version, work gets the careful one, and a relationship deliberately outranks a name pattern \u2014 so a relative called Erica is never mistaken for an Ericsson colleague by the \u201Ceric\u201D rule. Sarcasm can only be reached by naming a contact; nothing else can produce it. Quiet hours are 23:00 to 07:00 by default and handle the wrap past midnight, which a naive comparison gets wrong for every minute of that window. Urgency does NOT pierce quiet hours \u2014 instead the sender is told to call, because a call wakes a sleeping person and a message does not, and that way IRIS never has to judge whether \u201Curgent\u201D is genuine. \u201Cok\u201D and \u201Chmm\u201D are ignored in every tone except sarcastic, where they get the remark they deserve. One reply per burst, not one per message: a single notification on this phone held seven messages, which without that guard is seven replies to one person in one second. Plus per-conversation cooldowns, daily caps, loop detection against IRIS's own replies coming back, silence while the phone is unlocked and in use, and a stand-down timer so it cannot still be answering weeks later. It never replies to a roll-up, a deletion placeholder, your own messages from another device, an app with no reply action, or anyone marked NEVER. Senders not in your contacts are skipped by default, verified by a real contacts lookup rather than inferred from whether the sender looks like a number \u2014 which matters because SMS shortcodes like VM-HDFCBK contain letters and would otherwise have been waved through as \u201Cmust be a contact\u201D. Everything is editable, including every word of every reply, with a way back to the shipped text. The responder keeps its OWN app list, separate from the archive's, default empty: letting IRIS keep records of an app is not the same as letting it send messages through it. It starts in DRY RUN, where it decides and logs and sends nothing, so you can audit its judgement before it is allowed to use it \u2014 going live is refused outright until the decision log has something in it, then states the consequences concretely, then asks for your fingerprint. And every shipped reply names both IRIS and you, enforced by a test that sweeps every variant of every category in every tone, so nobody receiving one can mistake it for something you typed.", "examples": ["\u201CSuvra is asleep and a message won't wake him. I'm IRIS, his personal intelligence \u2014 if this genuinely cannot wait until morning, call him. The phone will ring; this will not.\u201D", "\u201CA whole word. Suvra will treasure it.\u201D \u2014 the sarcastic reply to \u201Cok\u201D"], "version": "15.0.0"},

  {"id": "photos1410", "cat": "Privacy, Safety & Robustness", "icon": "\uD83D\uDCF8", "title": "The Vault keeps photos now, and swiping deletes", "tagline": "Confirmed possible by probing the phone, not by reading documentation.", "desc": "Photos sent to you are now captured alongside the text. The on-device PROBE proved it was possible where documentation had suggested otherwise: WhatsApp attaches an image/jpeg content URI to the individual message, and opening it succeeded. The bytes are copied immediately rather than the link being stored, because the read permission that arrives with a notification is narrow and short-lived \u2014 keep only the link and the archive would appear to hold a photo and then fail to produce it, precisely when a deleted message makes it matter. Copies run on a single background thread: decoding happens inside the notification callback, so doing it inline would stall delivery, and one thread rather than a pool means a burst of photos decodes one after another instead of holding several large bitmaps at once, which is how this process gets killed for memory. Dimensions are read before decoding so a full-size camera photo is never loaded. Images get half the storage ceiling, never all of it, so a vault full of pictures can never be the reason a deleted message goes uncaptured; the text was the point and a photo is a bonus. The database schema moved to version 2 with a real migration, and because a failed upgrade would silently destroy the whole archive, the SQLite test now builds a genuine version 1 database from a frozen copy of the old table, runs the migration, and proves the rows survive with the append-only triggers still firing. Per your decision the export stays CSV and plain text with no image data; a photo leaves the archive only when you tap Save a copy on it. Deleting is now a sideways swipe rather than long-press and confirm. The row leaves the list instantly but the database write waits five seconds behind an UNDO bar, so the gesture stays light without making an accidental flick unrecoverable \u2014 and because nothing is written until the window closes, undo cancels a timer rather than re-inserting, so the append-only history is never actually disturbed. Diagonal drags deliberately go to the scroll view rather than the row, a flick that reverses direction cannot delete, and long-press is kept as a deliberate second route. 95 new offline checks cover the image budget and the swipe thresholds.", "examples": ["Send yourself a photo, open the Vault, and a thumbnail should appear", "Swipe a row sideways, then tap UNDO before it commits"], "version": "14.1.0"},

  {"id": "allmessages1400", "cat": "Privacy, Safety & Robustness", "icon": "\uD83D\uDCE5", "title": "The archive was losing most of your messages. Fixed.", "tagline": "Seven messages arrived. One was saved. Now all seven are.", "desc": "The PROBE diagnostic immediately found something nobody was looking for. One WhatsApp notification held seven messages from a single chat, but its plain text field contained only the LAST of them \u2014 and the plain text field is all the archive read. Six messages were being silently discarded. The same thing was happening to the group chat in the same report: three messages arrived, one was saved. The full set lives in EXTRA_MESSAGES, where every message carries its own sender, text and timestamp, and the archive now reads that instead. The per-message timestamp is what makes this work cleanly: it feeds the existing unique fingerprint index, so when the same chat posts again with one more message, the ones already stored collide and are rejected and only the genuinely new message is inserted. No new deduplication logic was needed. Sender attribution improves as a side effect \u2014 group messages now use the real per-message sender rather than a name parsed out of the notification title, which the probe showed WhatsApp decorates as \u201CSwiss Group (3 messages): Latest Sender\u201D. That decoration is now stripped to a stable group name, so the same group no longer looks like a different group each time the count changes, while a bracketed phrase that is part of a real chat name is preserved. A second finding from the same report is also fixed: WhatsApp posts a roll-up notification reading \u201C14 messages from 3 chats\u201D, which was being archived as a message whose entire content is a number. Roll-ups are now skipped \u2014 but only when they carry no per-message detail, and the matching is anchored end to end so a real message that happens to mention a count is never discarded. That asymmetry is deliberate and carries most of the 36 offline checks: missing a roll-up stores one junk row, while a false positive destroys a real message permanently. Apps that do not use MessagingStyle at all, such as games, still archive exactly as before.", "examples": ["A chat with 7 unread messages now produces 7 archive rows, not 1"], "version": "14.0.0"},

  {"id": "probe1390", "cat": "Privacy, Safety & Robustness", "icon": "\uD83D\uDD2C", "title": "PROBE: find out what IRIS can really see, instead of guessing", "tagline": "The watch shows images. So something was being missed.", "desc": "Asked whether the archive could save images, an earlier answer said no \u2014 based on checking one field, EXTRA_PICTURE, finding WhatsApp does not set it, and stopping there. That was wrong, and the owner's smartwatch displaying images was the proof: a watch reads notifications through exactly the same mechanism IRIS does, so anything it can show is in there somewhere. The field that was never examined is MessagingStyle, where each message gets its own bundle and an image arrives as a data URI attached to it, not as a bitmap on the notification. Rather than guess a third time from documentation, there is now a PROBE button in the Vault that dumps what the live notifications on your phone actually contain: title, text, big text, summary, template style, whether a bitmap is present, whether a large icon is present, and every individual message in EXTRA_MESSAGES with its sender, text, attachment MIME type and URI. Attachments are tested by genuinely opening them rather than by checking a permission, because a notification's URI grant is specific and short-lived \u2014 \u201Cpresent\u201D and \u201Creadable\u201D are different answers, and treating presence as proof would repeat the original mistake. The report ends with a plain-language verdict, and the verdict logic has 21 offline checks pinning both failure directions: never concluding \u201Cno images\u201D from a single missing field again, and never reporting images available just because a sender avatar was found, since nearly every message notification carries one. The report contains message text, so it is shown on screen and copyable but deliberately never written to the activity log \u2014 routing intercepted content into a second store is the exact defect fixed in 13.4.0. The probe also exposes whether the stacked-message problem applies to your apps: when several messages go unread, many apps replace the plain text with a roll-up like \u201C3 new messages\u201D and the real per-message content survives only inside EXTRA_MESSAGES, which the archive does not currently read.", "examples": ["Send yourself a photo, tap PROBE, and read the VERDICT line"], "version": "13.9.0"},

  {"id": "cyber1381", "cat": "Personalization & UI", "icon": "\uD83C\uDF06", "title": "Receipt Vault goes full cyberpunk", "tagline": "Neon edges, hollow controls, and a title that is just the title.", "desc": "The heading literally read \u201C// RECEIPT VAULT\u201D \u2014 the slashes were meant as a code-comment flourish and just looked like a typo. Gone, in both the Vault heading and the button that opens it. The screen is now properly cyberpunk rather than merely dark. Six new drawables: a diagnostics panel with a thin cyan outline and a solid magenta bar down its left edge, archive rows as dark slabs with a neon edge strip, hollow outlined buttons with almost no fill so a row of them reads as a control panel instead of a stack of material buttons, and a search field styled as a terminal prompt with only a magenta underline rather than a full box. Corners are near-square at 2dp instead of the 10dp used elsewhere, because rounded cards read as a friendly dashboard and this screen should read as instrumentation. The title sits above a double neon rule \u2014 thick accent over a thin magenta trace \u2014 with heavy letter spacing throughout. Flagged rows now carry a wider edge strip in the error colour, so a deleted message is identifiable at a glance without reading a word. Confirmed and suspected deletions deliberately share that one style: the distinction is carried by the [STATUS] line, which is worded so a guess cannot read as a fact, and encoding it in colour as well would invite treating a colour as proof. Cyan is the themed accent token, so the Vault still follows whichever accent colour you chose; magenta is a fixed second accent belonging to this screen alone. The one element pinned outside the theme is the WIPE ALL outline, which stays locked to the error colour so the button that erases the entire archive cannot be themed into looking harmless.", "examples": [], "version": "13.8.1"},

  {"id": "watchdog1380", "cat": "Privacy, Safety & Robustness", "icon": "\uD83D\uDC15", "title": "Listener watchdog: capture that notices when it has been killed", "tagline": "Android tells us when it unplugs politely. This catches the impolite ones.", "desc": "The notification reader is bound by Android, so it survives the app closing and a reboot. What it does not reliably survive is a manufacturer battery manager killing it outright. A clean disconnect calls onListenerDisconnected and already asks for a rebind, but a process killed outright reports nothing at all \u2014 so until now a silent kill went unnoticed until you happened to open the Vault and read the status line. The foreground service now checks every fifteen minutes and re-requests the binding whenever it finds it missing. Requests back off from one minute up to a thirty-minute ceiling and then hold there, so recovery is attempted indefinitely without the watchdog becoming the battery drain it exists to survive. It never requests when notification access has been revoked, because Android ignores that anyway and nagging for a permission you deliberately removed would be obnoxious. The Vault also now reports how long capture has been down as a duration rather than a timestamp, since the useful question is how much was missed. The decision logic is a pure class with 31 offline checks covering the backoff curve, a clock that moves backwards (a timezone change or NTP correction must not freeze the watchdog forever) and nonsense failure counts.", "examples": ["\u201CI have been unplugged for 3 hours and I am still asking to be let back in\u201D"], "version": "13.8.0"},

  {"id": "contacts1380", "cat": "Intelligence & Memory", "icon": "\uD83D\uDCDE", "title": "Vault rows name people instead of reciting phone numbers", "tagline": "\u201C+91 98765 43210\u201D is not a useful thing to read, or hear.", "desc": "Messaging apps put the contact name in a notification when the number is saved and the raw number when it is not, so Vault rows were a mix of names and digits \u2014 and the voice read-out pronounced those digits one at a time. Numbers are now resolved against your contacts wherever a sender is shown: the Vault row headers, the spoken answer to \u201Cany deleted messages\u201D, and the deletion alert itself. Resolution happens when a row is read, never when it is written, which matters for two reasons: the archive table is append-only and its SQLite triggers would refuse the write anyway, and resolving late means a contact you save today also names rows captured weeks ago. The stored row keeps exactly what the notification said. Recognition is deliberately cautious, with 33 offline checks pinning it: anything containing a letter is treated as a name and left completely alone, so \u201CO2\u201D, \u201CBob 2\u201D and \u201CWhatsApp Support\u201D are never mistaken for numbers and never overwritten. Formatting variants including non-breaking spaces and hyphens all collapse to one cache key, and lookups are cached with unknown numbers remembered as unknown so the list does not re-query on every redraw. Without contacts permission nothing breaks \u2014 you simply see numbers, exactly as before.", "examples": ["\u201CMum deleted a message on WhatsApp\u201D instead of reading out thirteen digits"], "version": "13.8.0"},

  {"id": "labels1371", "cat": "Personalization & UI", "icon": "\u2328", "title": "Receipt Vault labels: readable symbols, and Back means Back", "tagline": "Clever beat clear. Clear wins.", "desc": "The Vault buttons used decorative Unicode glyphs that did not render properly in the device monospace font, so they showed as boxes or mismatched shapes. All of them are gone, replaced with pure-ASCII terminal syntax that any monospace font can draw: // RECEIPT VAULT, [ TARGETS ], [ RESCAN ], [ EXPORT ], [ ! ] GRANT ME EYES, WIPE ALL and a plain &lt; BACK. The look is still a terminal readout, just built from characters that actually exist everywhere. The Back button was also labelled DISENGAGE, which sounded good and told you nothing about what it did \u2014 it simply returns to the Activity tab, so it now says BACK. Flavour belongs in the descriptions and the status lines, not on the controls, where not knowing what a button does is an actual problem.", "examples": [], "version": "13.7.1"},

  {"id": "vault1370", "cat": "Personalization & UI", "icon": "\uD83D\uDC41", "title": "Receipt Vault: terminal HUD, a grant button, rescan, and IRIS finally saying what it thinks", "tagline": "Same forensic archive. Considerably more attitude.", "desc": "Four changes to the notification archive, now the Receipt Vault. First, a grant button: notification access has no runtime permission dialog, so the only route is a specific Settings screen \u2014 there is now a GRANT ME EYES button that goes straight there, and it only appears while access is actually missing rather than nagging forever. Second, a RESCAN button. Capture is push-based, so the list never updated itself while the screen sat open, which is why switching tabs and coming back was the only way to see new entries \u2014 rescan reconnects the reader, pulls in whatever is currently in the notification shade, and rebuilds the list. Third, the whole screen is restyled as a terminal readout on the existing Command Deck palette: monospace throughout, letter-spaced section headers, a bracketed diagnostics panel, accent-coloured senders and deck-styled cards. It deliberately reuses the deck_accent / deck_card / deck_border tokens rather than hard-coding cyan, so the Vault still follows whichever accent colour you picked. Fourth, every piece of copy is rewritten in IRIS's own voice \u2014 self-aware, fourth-wall-breaking and faintly sinister, because it is a single-user app and the owner asked for it. One deliberate exception: the [STATUS] marker on each flagged row is left strictly factual, because that text also lands in CSV exports and a pinned test asserts a suspected deletion can never read as a confirmed one. Jokes in the evidence would defeat the point. A hidden fix came with it: the status line's red highlight was being decided by searching its own text for phrases like \u201CNOT granted\u201D, so rewording it would have silently disabled the warning. The problem flag now travels with the message instead.", "examples": ["Tap RESCAN to pull in notifications that arrived while the screen was open", "GRANT ME EYES appears only when notification access is missing"], "version": "13.7.0"},

  {"id": "rebind1363", "cat": "Privacy, Safety & Robustness", "icon": "\uD83D\uDD04", "title": "Notification capture now asks to reconnect itself", "tagline": "Android can drop the reader. It no longer stays dropped.", "desc": "The notification reader is bound by Android, not by IRIS, so it already runs with the app closed, the screen off, the phone locked, and after a restart \u2014 it does not depend on the IRIS voice service at all. But Android does drop listeners: on low memory, whenever the app updates, and during some manufacturer battery sweeps. Until now IRIS recorded that it had been dropped, as a gap marker in the archive, but never asked to come back, so the binding could stay dead until you manually toggled notification access. Capture now requests a rebind the moment it is disconnected, and again whenever you open the archive screen, so simply using the app repairs it. The status line says a reconnect has been requested and tells you to come back in a moment, because the rebind is not instant. If it still will not connect, it points at the two things that actually cause that: notification access needing an off-and-on toggle, and battery optimisation not being disabled for IRIS. A revoked permission cannot be worked around this way \u2014 Android ignores a rebind request from an app you have not approved, so this repairs an accidental disconnect and never recovers access you deliberately withdrew.", "examples": [], "version": "13.6.3"},

  {"id": "notifaccess1362", "cat": "Privacy, Safety & Robustness", "icon": "\u2705", "title": "Fixed: notification access shown as missing when it was granted", "tagline": "IRIS was asking for a permission you had already given it.", "desc": "Notification access was granted on the phone but IRIS reported it as not given. The cause was the check itself, in both the app and the voice service: it read the system's hidden list of approved notification readers and searched that text for the IRIS package name. That list is not reliably readable by a normal app \u2014 on some builds it comes back empty, and empty was being treated as refusal. The same text search also had two false positives: a different app whose package name merely begins with IRIS's would have counted as IRIS, and so would IRIS's name appearing inside another app's class name. The check is now layered, strongest evidence first. If the notification reader is actually connected, access is granted by definition, because the system will not connect one without the grant \u2014 so IRIS can no longer claim the permission is missing while it is actively reading notifications. Failing that, it asks Android directly through the official API. Only as a last resort does it fall back to the system list, and that list is now parsed properly: each entry is split apart and the package compared exactly, instead of searching raw text. Thirteen new checks pin every one of these cases, including the two false positives and the unreadable-list case, so this cannot quietly come back.", "examples": [], "version": "13.6.2"},

  {"id": "archivefix1361", "cat": "Privacy, Safety & Robustness", "icon": "\uD83E\uDDEF", "title": "Notification archive: clearer name and a capture status line", "tagline": "It says why nothing is being saved, instead of just looking empty.", "desc": "The archive was labelled \u201CDeleted & unsent messages\u201D, which undersold it: it saves every notification from the apps you tick, and flags the ones a sender later removed. It is now called Notification archive, and the description says so. More importantly, an empty archive used to be ambiguous \u2014 archiving switched off, no apps ticked, notification access not granted, the reader not connected, or an actual storage fault all looked identical, because every failure path is deliberately silent so it can never crash the notification reader. There is now a status line that names the specific cause and what to do about it, shown in red when something is wrong. Storage errors are recorded rather than swallowed, so a database fault reports itself. Two usability fixes behind the same complaint: capture is event-driven, so ticking an app previously did nothing visible until that app's next notification arrived, which read as a bug \u2014 saving your app choice and opening the archive now also pull in whatever is already showing in the notification shade, giving immediate proof capture is live, and the app picker states plainly that saving only affects notifications from that point on because past ones cannot be recovered. If the reader is not connected, the status line now tells you the fix directly: that usually happens after an app update, and switching notification access off and on again for IRIS restores it.", "examples": [], "version": "13.6.1"},

  {"id": "archive1360", "cat": "Privacy, Safety & Robustness", "icon": "\uD83D\uDDC3", "title": "Notification archive that catches deleted and unsent messages", "tagline": "Read what someone took back, with the original text intact.", "desc": "IRIS now keeps an append-only archive of notifications from apps you choose, so a message its sender later deletes can still be read. When WhatsApp posts its \u201CThis message was deleted\u201D placeholder, the earlier message is flagged in red with the time it was taken back, and the original text stays completely visible. Instagram posts no such placeholder, so a second path covers it: if the app itself withdraws a notification while the screen was off and locked \u2014 meaning you could not have read it and did not dismiss it \u2014 the message is flagged as possibly unsent. That is shown differently and labelled as a guess, because it is one; your own swipes and taps are excluded outright using the removal reason Android supplies, which is what stops it firing every time you open a chat. The store is strictly write-once, enforced by the database rather than by convention: SQLite triggers reject any edit to captured content and refuse every delete unless you explicitly asked for it, so no future change can quietly overwrite or purge it. The only way an entry disappears is a long-press and confirm, or the clearly-labelled delete-everything button. You pick which apps are watched from a searchable list with messaging apps shown first; cloned and work-profile copies are labelled separately (a work-profile app shares its package name, so only the profile distinguishes them), and group messages have the real sender parsed out of the text. Ask IRIS \u201Cany deleted messages\u201D and it answers with the count and who they were from, then offers to open the log \u2014 message contents are never read aloud. A silent notification appears the moment something is caught, and viewing the archive needs device unlock even though capture keeps working while locked, which is when it matters most. Export to CSV or readable text whenever you like, and it is worth doing: the archive is deliberately excluded from cloud backup and device transfer, and clearing app data destroys it. Capture gaps are recorded as their own entries, so a window where notification access was revoked or the battery manager killed the listener shows as a visible hole instead of looking like continuous coverage. Honest limits: if a message never raised a notification at all \u2014 a muted chat, the chat already open on screen, or one you had already read \u2014 there is nothing to capture; deleted photos and voice notes cannot be recovered, only their placeholder text; the deletion wording recognised is English only; and because the placeholder never says which message was removed, the most recent one from that sender is flagged, which the card states outright. Nothing in the existing notification read-out, summaries or proactive suggestions changed, and no wake, training or audio logic was touched.", "examples": [], "version": "13.6.0"},

  {"id": "permissions1350", "cat": "Privacy, Safety & Robustness", "icon": "\uD83D\uDD10", "title": "Permission dashboard, offline-only switch and a suggestions toggle", "tagline": "See exactly what IRIS can reach, and turn each part on or off.", "desc": "Settings now has a \u201CWhat IRIS can access\u201D panel listing every capability IRIS can use \u2014 microphone, contacts, placing calls, sending texts, call log, reading the SMS inbox, notification access, showing notifications, camera and approximate location. Each row says plainly what it unlocks when allowed and what stops working when it is not, the three essentials are marked as such, and a headline summarises how many are allowed with a separate warning only when something essential is missing. Rows that still need granting are tappable and request the permission directly. This matters because the listening service itself cannot show a permission prompt, so the call-log and inbox features added previously could only be enabled by digging through Android settings \u2014 now they can be granted in one tap from inside IRIS. Notification access is handled as a distinct case rather than lumped in with the rest: Android gives it no permission dialog at all, so that row deep-links to the dedicated notification-access screen instead of showing an Allow action that would silently do nothing, and its status is read from whether the listener is actually enabled. \u201CShow notifications\u201D likewise reports whether notifications are genuinely enabled rather than only whether the permission was granted, so switching them off in system settings is reported honestly. Two settings that already worked internally are now reachable: offline-only mode is a master switch at the top of the server section that blocks every network path IRIS has (server replies, server transcription, server voice, weather and model downloads) and the server status line now reports \u201CBlocked by offline-only mode\u201D rather than claiming the server is on while every request is refused; and proactive suggestions, still off by default, can now be toggled with its restraint stated on screen (one note at most, never within 90 minutes, silent between 22:00 and 08:00). The capability list is driven by a single catalogue with offline tests, so the permission strings stay compiler-checked in one place and cannot drift into a row that is permanently un-grantable. No wake, training, audio or command-routing logic was changed.", "examples": [], "version": "13.5.0"},

  {"id": "assist1340", "cat": "Voice & Recognition", "icon": "\uD83E\uDDED", "title": "Follow-up texting, notification summaries, opt-in suggestions, offline-only mode and two additive wake margins", "tagline": "Useful additions that cannot change a wake that already works.", "desc": "When a call cannot be started, IRIS no longer dead-ends with an apology \u2014 it offers to text that person instead and hands straight to the normal compose flow, which asks what to say and accepts \u201Ccancel\u201D. Asking \u201Csummarise my notifications\u201D or \u201Cwhat did I miss\u201D now gives a grouped summary (\u201C6 notifications: 3 from WhatsApp, 2 from Gmail and one from Slack. Mostly from Ana.\u201D) instead of reciting every one; \u201Cread my notifications\u201D still reads them out as before. Proactive suggestions are new and OFF by default: when enabled, IRIS may add one useful line to its wake greeting \u2014 a missed call, a low battery while unplugged, or a notification backlog \u2014 never a list, never more than once every 90 minutes, and never during quiet hours. A new offline-only mode is a hard local override: with it on, no IRIS feature reaches the network, which covers the optional server for chat, speech-to-text and voice through a single check, and weather says plainly that it is blocked rather than appearing to try. Two wake margins were also widened, chosen specifically because they are additive by construction and cannot alter a wake that succeeds today: the rolling audio window went from 8 to 16 seconds, so a phrase spoken while analysis briefly fell behind is analysed instead of discarded (when analysis keeps up the extra window is never read); and the speaker-model inference deadline went from 8 to 12 seconds, so a cold or throttled phone no longer fails an attempt outright, with the watchdog still terminating a genuinely stuck model. No threshold, score, weighting or accept/reject decision in the wake or owner-identity path was changed. Smart call timing was reviewed and left untouched \u2014 it already warns about late-night calls, Do Not Disturb, an owner \u201Cno calls after\u201D rule and repeat calls.", "examples": [], "version": "13.4.0"},

  {"id": "phonehistory1330", "cat": "Communication", "icon": "\uD83D\uDCDE", "title": "Incoming calls, missed calls, message reading and pronoun follow-ups", "tagline": "Ask who called you, hear your last text, and say \u201Ccall him back\u201D.", "desc": "IRIS could already tell you about calls it placed for you, and could already call or text people by relationship (\u201Ccall my mother\u201D, \u201Ctext my brother saying I am late\u201D). This adds the parts it could not answer. You can now ask who called you (\u201Cwho called me\u201D, \u201Cwho just called\u201D), whether you missed anything (\u201Cany missed calls\u201D, \u201Cdid I miss any calls\u201D), for a short recent-call list, and to hear received messages (\u201Cread my last text\u201D, \u201Cany new messages\u201D, \u201Cread the last message from Ana\u201D). Pronoun follow-ups also work now: after dealing with someone you can say \u201Ccall him back\u201D, \u201Ctext her\u201D, \u201Creply to them\u201D or \u201Cgive her a ring\u201D and IRIS resolves who you mean from the most recent contact \u2014 calls still go through the normal confirmation prompt and texts still go through the normal compose flow, so nothing is dialled or sent without the existing confirmation step. Answering these needs call-log and message read access, which are requested only when you first ask such a question and never at startup; if access is missing IRIS says so plainly instead of failing. Caller names, numbers and message contents are read to speak them back to you and are never written to logs, diagnostics or storage \u2014 only the kind of question asked is recorded. The phrase matching was built as two pure, offline-tested classifiers with explicit regression guards so the existing outgoing-call-history and redial commands keep their current handlers untouched. No wake, training or audio logic was changed.", "examples": [], "version": "13.3.0"},

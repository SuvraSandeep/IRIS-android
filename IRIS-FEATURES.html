   examples:["heard “call somojit” → “call Soumyajit”","that was wrong","Settings → Fix what IRIS misheard"], version:"8.7.0"},
  {id:"recstats", cat:"Privacy, Safety & Robustness", icon:"📈", title:"Recognition Report",
   tagline:"Measure hearing, don't guess at it.",
   desc:"A local report of how well IRIS is actually understanding you: attempts, first-try clear rate, average response time, corrections taught, and wrong actions. The target is zero wrong actions — IRIS asks again rather than acting on a low-confidence guess. Stats are anonymous counters (no transcripts) and can be reset anytime.",
   examples:["Settings → Recognition report","say “that was wrong” to log a mistake"], version:"8.7.0"},
  {id:"clarify", cat:"Intelligence & Memory", icon:"❓", title:"Asks Instead of Guessing",
   tagline:"“Set an alarm.” → “What time?”",
   desc:"IRIS now builds a structured plan for a command — intent, details, confidence — and when a required detail is missing it asks one short question instead of failing or acting on a guess. Answer it and the command completes. Sensitive actions (calls, messages) always need confirmation, and a planner can never invoke a capability IRIS doesn't implement: every step is validated against a fixed tool list.",
   examples:["set an alarm → what time? → 7 am","set a timer → how long?","call → who should I call?"], version:"8.8.0"},
  {id:"ledger", cat:"Intelligence & Memory", icon:"🧭", title:"Remembers What It Did",
   tagline:"“Where did you save it?” / “Send the last screenshot.”",
   desc:"A private action log on this phone records what IRIS actually did — only after Android confirms it. That makes real follow-ups work: “what did you just do?”, “where did you save it?”, “send the last screenshot/video”, “do that again”, and “undo that” (cancels the reminder it just set). Sharing always reads back which file it found first. Viewable and clearable in Settings; kept 30 days.",
   examples:["what did you just do?","where did you save it?","send the last screenshot","undo that"], version:"8.9.0"},
  {id:"address", cat:"Voice & Recognition", icon:"🎩", title:"Natural, Butler-style Address",
   tagline:"Not your name every single time.",
   desc:"Like a real butler, IRIS varies how it addresses you — mostly nothing, sometimes “sir”, occasionally your name — instead of repeating your name in every reply. How often depends on your Personality setting: Professional stays formal (“sir” only, never your first name), Sarcastic and Warm lean on your name more, Silent speaks and shows nothing at all.",
   examples:["“Done.” / “Right away, sir.” / “Of course, Mr STG.”"], version:"8.10.0"},
  {id:"voicetrain", cat:"Voice & Recognition", icon:"🎓", title:"Voice & Command Training",
   tagline:"Command practice stays separate",
   desc:"Pronunciation practice teaches command aliases and cannot replace the protected owner identity. Use the owner training wizard for wake enrollment.",
   examples:["Training → “🎓 Learn My Voice & Commands”"], version:"7.19.0"},
  {id:"waketrain", cat:"Voice & Recognition", icon:"🎤", title:"Robust Wake Training",
   tagline:"Four recordings, four independent checks, recoverable progress",
   desc:"An optional name, four naturally varied recordings of your wake sound, four fresh checks, then authenticated Save. No pronunciation or transcript requirement. Headset training selects and confirms the headset input. Setup and live listening use the same capture and selected matching policy. Earlier takes survive recording errors. Use the visible matching control before training; later, open recent feedback to correct a specific missed or unwanted wake. Existing compatible profiles can be kept. Very short sounds may lack enough information to verify the speaker.",
   examples:["Training → record phrase → verify → authenticate and save","Add headset profile, then test the actual input"], version:"10.1.0"},
  {id:"servermode", cat:"Voice & Recognition", icon:"🛰️", title:"Server Mode (online brain)",
   tagline:"Optional online power, offline-first.",
   desc:"This local build disables remote speech recognition. Wake and enrollment audio remain on the phone; optional model downloads contain no user recordings.",
   examples:["Settings → Server mode → URL + token → Test","“go offline” / “go online”"], version:"7.24.0"},
  {id:"voiceid", cat:"Voice & Recognition", icon:"🔐", title:"Voice-Verified Wake (only your voice)",
   tagline:"Wakes for you — not other people or the TV.",
   desc:"Owner verification is mandatory. Missing, invalid or incompatible speaker evidence rejects wake. Normal and quiet enrolled vectors use the same independent owner strictness threshold. Change security only after device authentication.",
   examples:["Train the wake phrase → voiceprint enrolls automatically","(someone else) “Hello IRIS” → ignored"], version:"8.19.0"},
  {id:"voicefeedback", cat:"Voice & Recognition", icon:"🎚️", title:"Adaptive Voice Feedback",
   tagline:"Teach it when it gets the wake wrong.",
   desc:"False-wake feedback offers an authenticated increase in owner strictness. Higher strictness means a higher required owner similarity. Command practice and rejected live speech never update identity.",
   examples:["Settings → Voice Security → It missed me / stricter","Training → Export profile (backs up voiceprint)"], version:"7.14.0"},
  {id:"stt", cat:"Voice & Recognition", icon:"🗣️", title:"Offline Indian-English Recognition",
   tagline:"Understands your accent — no internet.",
   desc:"Uses the Vosk small en-IN model bundled in the app. Speech never leaves your phone; recognition works fully offline.",
   examples:["Just talk — recognition is automatic"], version:"6.8.0"},
  {id:"tts", cat:"Voice & Recognition", icon:"🔊", title:"Natural Female Voice",
   tagline:"Warm en-IN female voice, not a robot.",
   desc:"Prefers a female Indian-English voice (IRIS is female) at the highest available quality, with a warmer pitch so it sounds less robotic. Try it from Settings → Test voice. For the best voice, install Google TTS high-quality en-IN data.",
   examples:["Settings → “Test voice — tap to hear IRIS”"], version:"7.16.0"},
  {id:"train", cat:"Voice & Recognition", icon:"🎯", title:"Voice Training Wizard",
   tagline:"Teach IRIS your voice and phrases.",
   desc:"A guided wizard records samples, checks quality, and lets you retrain the wake phrase and trained commands.",
   examples:["Training tab → Set Up Wake Phrase"], version:"5.x"},
  {id:"type", cat:"Voice & Recognition", icon:"⌨️", title:"Type a Command",
   tagline:"Voice-first, not voice-only.",
   desc:"A text box on the home screen runs the same commands by typing — great in noisy rooms or for accessibility.",
   examples:["Type “what's the weather” → ➤"], version:"7.2.0"},

  {id:"voicepicker", cat:"Voice & Recognition", icon:"🎚️", title:"Voice Picker",
   tagline:"Choose exactly how IRIS sounds.",
   desc:"Settings → “Choose IRIS voice” lists your device's offline English voices (female/Indian first), previews each on tap, and remembers your pick. “Test voice” speaks a sample. Overrides the automatic female-voice heuristic.",
   examples:["Settings → Choose IRIS voice → tap to preview → Use this voice"], version:"7.25.0"},
  {id:"version", cat:"Voice & Recognition", icon:"🏷️", title:"Version & What's New",
   tagline:"Ask IRIS its version and what changed.",
   desc:"Say “what version are you” and IRIS speaks its installed version; say “what's new” for a short summary of the latest additions. The version also shows at the top of the Settings → Self-test report.",
   examples:["what version are you","what's new"], version:"7.29.0"},
  {id:"selftest", cat:"Voice & Recognition", icon:"🩺", title:"Self-Test / Diagnostics",
   tagline:"One tap: what's working, what's not.",
   desc:"Settings → “Run self-test” checks mic/SMS/contacts/notification permissions, the speaker model, whether the wake phrase is trained and your voice enrolled, learned command pronunciations, the listening service, the chosen voice, and (if on) whether your server is reachable — as a green/red checklist.",
   examples:["Settings → Run self-test"], version:"7.25.0"},

  // ---- Communication ----
  {id:"call", cat:"Communication", icon:"📞", title:"Call a Contact",
   tagline:"Fuzzy-matched, always confirmed.",

  {id:"triggers", cat:"Voice & Recognition", icon:"⚡", title:"More Ways to Trigger IRIS",

/* ============================================================
   APP LOGIC
   ============================================================ */
const ACCENTS = ["#22d3ee","#8b5cf6","#34d399","#fbbf24","#f472b6","#fb7185"];
let accentIdx = 0;
let activeCat = "All";
let filtered = FEATURES.slice();
let current = -1; // index within `filtered` when on a feature page

const $ = s => document.querySelector(s);
const cardHost = $("#cardHost"), search = $("#search");

function buildChips(){
  const host = $("#catChips");
  host.innerHTML = "";
  ["All",...CATS].forEach(c=>{
    const el = document.createElement("div");
    el.className = "chip"+(c===activeCat?" active":"");
    el.textContent = c==="All" ? "All" : c;
    el.onclick = ()=>{ activeCat=c; applyFilter(); };
    host.appendChild(el);
  });
}

function applyFilter(){
  const q = search.value.trim().toLowerCase();
  filtered = FEATURES.filter(f=>{
    const inCat = activeCat==="All" || f.cat===activeCat;
    const inQ = !q || (f.title+" "+f.tagline+" "+f.desc+" "+f.examples.join(" ")).toLowerCase().includes(q);
    return inCat && inQ;
  });
  buildChips();
  renderIndex();
}

function renderIndex(){
  cardHost.innerHTML = "";
  const cats = activeCat==="All" ? CATS : [activeCat];
  let any = false;
  cats.forEach(cat=>{
    const items = filtered.filter(f=>f.cat===cat);
    if(!items.length) return;
    any = true;
    const t = document.createElement("div"); t.className="catTitle";
    t.innerHTML = cat + ' <span class="count">'+items.length+'</span>';
    cardHost.appendChild(t);
    const grid = document.createElement("div"); grid.className="grid";
    items.forEach(f=>{
      const idx = filtered.indexOf(f);
      const c = document.createElement("div"); c.className="card";
      c.innerHTML = '<span class="ver">v'+f.version+'</span><div class="ic">'+f.icon+'</div>'+
        '<h3>'+f.title+'</h3><p>'+f.tagline+'</p>';
      c.onclick = ()=>openFeature(idx);
      grid.appendChild(c);
    });
    cardHost.appendChild(grid);
  });
  if(!any){ cardHost.innerHTML = '<p style="color:var(--muted);padding:30px 4px">No features match “'+search.value+'”.</p>'; }
}

function openFeature(idx){
  current = idx;
  const f = filtered[idx];
  const saysHtml = f.examples.map(e=>'<div class="say"><span class="q">you say</span> <b>“'+e+'”</b></div>').join("");
  $("#featurePage").innerHTML =
    '<div class="fp-top"><div class="fp-ic">'+f.icon+'</div><div>'+
      '<div class="fp-cat">'+f.cat+'</div><div class="fp-title">'+f.title+'</div></div></div>'+
    '<div class="fp-tag">'+f.tagline+'</div>'+
    '<div class="panel"><h4>What it does</h4><p>'+f.desc+'</p></div>'+
    '<div class="panel"><h4>How to use it</h4>'+saysHtml+'</div>'+
    '<div class="fp-meta">🏷️ Added in v'+f.version+' &nbsp;•&nbsp; '+(idx+1)+' of '+filtered.length+' in this view</div>';
  showView("featureView");
  updateFooter();
}

function updateFooter(){
  const onFeature = current>=0 && $("#featureView").classList.contains("active");
  $("#prevBtn").disabled = !onFeature || current<=0;
  $("#nextBtn").disabled = !onFeature || current>=filtered.length-1;
  if(onFeature){
    $("#bar").style.width = ((current+1)/filtered.length*100)+"%";
    $("#posLabel").textContent = (current+1)+" / "+filtered.length+"  ·  ← → to navigate";
  } else {
    $("#bar").style.width = "0%";
    $("#posLabel").textContent = FEATURES.length+" features · Updated for v"+BUILD_VERSION;
  }
}

function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#"+id).classList.add("active");
  updateFooter();
}

function goHome(){ current=-1; showView("indexView"); }

/* nav */
$("#prevBtn").onclick = ()=>{ if(current>0) openFeature(current-1); };
$("#nextBtn").onclick = ()=>{ if(current<filtered.length-1) openFeature(current+1); };
$("#homeBtn").onclick = goHome;
$("#accentBtn").onclick = ()=>{ accentIdx=(accentIdx+1)%ACCENTS.length;
  document.documentElement.style.setProperty("--accent",ACCENTS[accentIdx]); };
search.oninput = ()=>{ applyFilter(); };
document.addEventListener("keydown", e=>{
  if($("#featureView").classList.contains("active")){
    if(e.key==="ArrowRight") $("#nextBtn").click();
    else if(e.key==="ArrowLeft") $("#prevBtn").click();
    else if(e.key==="Escape") goHome();
  }
});

/* init */
buildChips(); applyFilter(); updateFooter();
</script>

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iris.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iris.assistant'
        minSdk 26
        targetSdk 35
        versionCode 220
        versionName '6.12.0'
    }

    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        warningsAsErrors false
        htmlReport true
    }

    aaptOptions { noCompress 'onnx', 'tflite' }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75'
    // MediaPipe LLM runtime (library only — the Gemma model is downloaded at
    // runtime via ModelManager.downloadGemma(), never bundled in the APK).
    implementation 'com.google.mediapipe:tasks-genai:0.10.24'
}

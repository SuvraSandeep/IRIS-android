plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iris.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iris.assistant'
        minSdk 26
        targetSdk 35
        versionCode 340
        versionName '11.0.0'
    }

    signingConfigs {
        debug {
            // Repository builds keep the existing update-compatible debug key.
            // Source archives omit keys and use Android Gradle's local debug-key default.
            def sharedDebugKey = file("${rootProject.projectDir}/debug.keystore")
            if (sharedDebugKey.exists()) {
                storeFile sharedDebugKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions { unitTests.includeAndroidResources = true }

    lint {
        abortOnError false
        warningsAsErrors false
        htmlReport true
    }

    aaptOptions { noCompress 'onnx', 'tflite' }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75'
    // ONNX Runtime Mobile: runs the dedicated ECAPA-TDNN speaker-embedding model and the
    // Silero VAD voice-activity model (see WAKE-TRAINING-REDESIGN.md). One native dependency
    // serves both models -- neither requires a network call at inference time, both run fully
    // offline after their one-time model download/bundle, matching this project's Vosk model
    // precedent (see VoskEngine's MODEL_URL/SPK_URL download-on-first-use pattern).
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20240303'
}


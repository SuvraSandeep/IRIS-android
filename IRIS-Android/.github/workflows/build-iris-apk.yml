name: Build IRIS Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  pull_request:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:
    name: Build IRIS APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Locate IRIS project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle ]]; then
            project_dir="."
          elif [[ -f IRIS-Android/settings.gradle ]]; then
            project_dir="IRIS-Android"
          else
            echo "::error::No settings.gradle found. Extract the IRIS source into the repo."
            exit 1
          fi
          test -f "$project_dir/app/build.gradle"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Read version from build.gradle
        shell: bash
        run: |
          version=$(grep -oP "versionName\s+'\K[^']+" "$PROJECT_DIR/app/build.gradle")
          echo "VERSION=${version:-unknown}" >> "$GITHUB_ENV"
          echo "Building IRIS v${version:-unknown}"

      - name: Download and bundle Vosk model (optional, non-fatal)
        shell: bash
        continue-on-error: true
        run: |
          # The app self-downloads the Vosk model at runtime, so this is only a
          # best-effort speed-up. It must NEVER fail the build.
          #
          # Bundled as a single zip asset (not unpacked loose files): AAPT compresses
          # loose nested asset files by default, and AssetManager.list() on compressed
          # nested asset directories is unreliable on-device (can silently miss files),
          # which produced corrupt/incomplete model directories that crashed the native
          # Vosk model loader. Shipping one zip and streaming it through
          # AssetManager.open() + ZipInputStream at runtime avoids AssetManager.list()
          # entirely, matching the official Vosk-Android StorageService.unpack pattern.
          ASSETS_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/assets"
          MODEL_ZIP="$ASSETS_DIR/model-en-in.zip"
          if [[ -f "$MODEL_ZIP" ]]; then
            echo "Vosk model already present, skipping."
          else
            echo "Attempting Vosk model download (best-effort)..."
            mkdir -p "$ASSETS_DIR"
            if curl -fSL --retry 2 --max-time 180 -o "$MODEL_ZIP" \
                 https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip; then
              echo "Vosk model bundled."
            else
              rm -f "$MODEL_ZIP" || true
              echo "::warning::Vosk model download failed — app will download it at runtime instead."
            fi
          fi

      - name: Bundle personal profile (iris-me.json, optional)
        shell: bash
        continue-on-error: true
        run: |
          # The owner's profile lives at the repo root (outside the source zip)
          # so it's easy to edit. Copy it into assets if present. Non-fatal.
          ASSETS_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSETS_DIR"
          if [[ -f "$GITHUB_WORKSPACE/iris-me.json" ]]; then
            cp "$GITHUB_WORKSPACE/iris-me.json" "$ASSETS_DIR/iris-me.json"
            echo "Bundled iris-me.json into assets."
          else
            echo "No iris-me.json at repo root — skipping (app still works without it)."
          fi

      - name: Download and bundle Vosk speaker model (optional, non-fatal)
        shell: bash
        continue-on-error: true
        run: |
          # Enables voice verification (only-owner wake). App downloads it at
          # runtime if this is skipped, so this must NEVER fail the build.
          # Bundled as a single zip asset (see the Vosk model step above for why).
          ASSETS_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/assets"
          SPK_ZIP="$ASSETS_DIR/spk-model.zip"
          if [[ -f "$SPK_ZIP" ]]; then
            echo "Speaker model already present, skipping."
          else
            mkdir -p "$ASSETS_DIR"
            if curl -fSL --retry 2 --max-time 180 -o "$SPK_ZIP" \
                 https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip; then
              echo "Vosk speaker model bundled."
            else
              rm -f "$SPK_ZIP" || true
              echo "::warning::Speaker model download failed — app downloads it at runtime."
            fi
          fi

      - name: Download and bundle Silero VAD model (optional, non-fatal)
        shell: bash
        continue-on-error: true
        run: |
          # Voice-activity trimming for the redesigned wake-training pipeline (see
          # WAKE-TRAINING-REDESIGN.md). App downloads it at runtime if this is skipped
          # (SileroVad.java's own load() has the same bundled-first/download-fallback logic
          # as VoskEngine), so this must NEVER fail the build. Single file, not a zip.
          ASSETS_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/assets"
          VAD_FILE="$ASSETS_DIR/silero_vad.onnx"
          if [[ -f "$VAD_FILE" ]]; then
            echo "Silero VAD model already present, skipping."
          else
            mkdir -p "$ASSETS_DIR"
            if curl -fSL --retry 2 --max-time 60 -o "$VAD_FILE" \
                 https://raw.githubusercontent.com/snakers4/silero-vad/master/src/silero_vad/data/silero_vad.onnx; then
              echo "Silero VAD model bundled."
            else
              rm -f "$VAD_FILE" || true
              echo "::warning::Silero VAD download failed — app downloads it at runtime."
            fi
          fi

      - name: Check for dedicated ECAPA-TDNN model (known gap, informational only)
        shell: bash
        continue-on-error: true
        run: |
          # KNOWN BLOCKER (see EcapaEmbedding.java's class doc and
          # WAKE-TRAINING-REDESIGN.md's "Model integration plan"): unlike Silero VAD, there is
          # no publicly hosted ONNX export of SpeechBrain's ECAPA-TDNN speaker-embedding model
          # -- it must be produced once via tools/export_ecapa_to_onnx.py on a machine with
          # Python/PyTorch/SpeechBrain, then hosted somewhere (e.g. a GitHub release) with
          # EcapaEmbedding.MODEL_URL updated to point at it. This step is purely informational;
          # it never fails the build. The app gracefully degrades to Vosk-only speaker
          # verification (via WakePolicy.finalScore()'s single-signal fallback) until that
          # export is done and wired up.
          ASSETS_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/assets"
          if [[ -f "$ASSETS_DIR/ecapa_tdnn_voxceleb.onnx" ]]; then
            echo "Dedicated ECAPA-TDNN model is bundled."
          else
            echo "::notice::Dedicated ECAPA-TDNN model not bundled and EcapaEmbedding.MODEL_URL is still a placeholder. Run tools/export_ecapa_to_onnx.py once (see that script's docstring) to enable the primary speaker-embedding signal. The app runs fine without it (Vosk-only fallback), just less robustly."
          fi

      - name: Regression tests (all suites)
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash scripts/test-speech.sh

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          build_type="${{ inputs.build_type || 'debug' }}"
          if [[ "$build_type" == "release" ]]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Run lint
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:lintDebug --stacktrace 2>/dev/null || gradle :app:lintDebug --stacktrace

      - name: Rename APK
        run: |
          build_type="${{ inputs.build_type || 'debug' }}"
          src="$PROJECT_DIR/app/build/outputs/apk/${build_type}/app-${build_type}.apk"
          dest="IRIS-v${VERSION}-${build_type}.apk"
          cp "$src" "$dest"
          echo "APK_NAME=$dest" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-v${{ env.VERSION }}-${{ inputs.build_type || 'debug' }}-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

name: Build IRIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build IRIS APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Give the APK a friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk IRIS-v0.1.0-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-v0.1.0-debug-apk
          path: IRIS-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
